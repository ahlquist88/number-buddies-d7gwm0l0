<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Number Buddies">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>Number Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column (max 980px) on a sky backdrop; each screen swaps inside #app. */
:root{
  --sky:#DCEFFF; --sky-deep:#C4E2FB; --cloud:#F4FAFF;
  --card:#FFFFFF; --card-2:#EEF6FF;
  --ink:#1F2D47; --ink-soft:#56688A; --line:#C3D8EE;
  --add:#E8701F; --add-soft:#FFE6D1;
  --sub:#D2407F; --sub-soft:#FBDDEB;
  --mul:#118F84; --mul-soft:#D2F3EF;
  --div:#4F5FE0; --div-soft:#E0E3FD;
  --sun:#FFB400; --good:#1C9150; --good-soft:#D7F5E3; --oops:#D93A3F; --oops-soft:#FDE1E1;
  --dot-a:#F07C2A; --dot-b:#2D8CE0;
  --shadow:0 5px 0 rgba(31,45,71,.07), 0 14px 30px rgba(31,45,71,.10);
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#101A31; --sky-deep:#0A1224; --cloud:#16233F;
    --card:#1C2948; --card-2:#24345A;
    --ink:#EEF3FF; --ink-soft:#A8B7D6; --line:#344A75;
    --add:#FF9B52; --add-soft:#47301F; --sub:#F06AA8; --sub-soft:#47223A;
    --mul:#3CC9BC; --mul-soft:#173F3D; --div:#8C98FF; --div-soft:#262D5C;
    --sun:#FFC83D; --good:#45C97C; --good-soft:#173E2A; --oops:#FF6B6F; --oops-soft:#4A1F24;
    --dot-a:#FF9B52; --dot-b:#5CB0FF;
    --shadow:0 5px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.30);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#101A31; --sky-deep:#0A1224; --cloud:#16233F;
  --card:#1C2948; --card-2:#24345A;
  --ink:#EEF3FF; --ink-soft:#A8B7D6; --line:#344A75;
  --add:#FF9B52; --add-soft:#47301F; --sub:#F06AA8; --sub-soft:#47223A;
  --mul:#3CC9BC; --mul-soft:#173F3D; --div:#8C98FF; --div-soft:#262D5C;
  --sun:#FFC83D; --good:#45C97C; --good-soft:#173E2A; --oops:#FF6B6F; --oops-soft:#4A1F24;
  --dot-a:#FF9B52; --dot-b:#5CB0FF;
  --shadow:0 5px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.30);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background-color:var(--sky);
  background-image:
    radial-gradient(ellipse 140px 46px at 8% 90px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 90px 40px at 14% 70px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 160px 50px at 92% 210px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 90px 44px at 86% 190px, var(--cloud) 98%, transparent 100%),
    linear-gradient(var(--sky), var(--sky-deep));
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-body); font-size:18px; line-height:1.5;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--div);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.2px}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--add);color:#fff;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transform:rotate(-6deg)}
.brand-mark b{transform:rotate(6deg)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--font-display);font-weight:600;box-shadow:var(--shadow)}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow)}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.lang{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.lang button{border:0;background:none;border-radius:999px;padding:0 10px;height:38px;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-soft);letter-spacing:.5px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.star{width:22px;height:22px;fill:var(--line)}
.star.on{fill:var(--sun)}

/* characters */
.cw{flex:none;display:block}
.cw svg{display:block;width:100%;height:auto;overflow:visible}
.cw-lg{width:min(190px,40vw)} .cw-md{width:min(140px,30vw)} .cw-sm{width:84px}
.cw .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.char .eye-joy,.char .mouth-joy{display:none}
.char.mood-joy .eye-open,.char.mood-joy .mouth-calm{display:none}
.char.mood-joy .eye-joy,.char.mood-joy .mouth-joy{display:inline}
.char .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.char .pupil{transition:transform .35s ease}
.char.mood-think .pupil{transform:translate(4px,-5px)}
.char.mood-joy .bob{animation:hop .55s ease-in-out 2}
.char .glow{animation:glow 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.01,.99)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes glow{50%{opacity:.55}}

/* speech bubble */
.talk{display:flex;align-items:flex-end;gap:14px}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:28px;border:12px solid transparent;border-right-color:var(--card);border-left:0}
.bubble-who{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--tc,var(--add))}
.bubble h1{font-size:clamp(30px,5vw,44px)}
.bubble h2{font-size:clamp(24px,4vw,32px)}
.say-row{display:flex;align-items:flex-start;gap:10px}
.say-row p{flex:1;min-width:0}
.replay{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--card-2);display:grid;place-items:center}
.replay svg{width:18px;height:18px;fill:currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:14px 26px;font-family:var(--font-display);font-weight:600;font-size:20px;background:var(--tc,var(--add));color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-big{font-size:24px;padding:16px 34px}
.btn-small{font-size:17px;padding:10px 18px;border-radius:14px}
.btn-soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn-link{background:none;border:0;padding:6px 4px;font-family:var(--font-display);font-weight:600;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px}

/* home */
.hero{display:flex;align-items:flex-end;gap:16px}
.hero-cast{display:flex;align-items:flex-end;gap:0}
.hero-cast .cw:last-child{margin-left:-26px}
.name-form{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.name-form label{font-weight:700}
.name-form .row{display:flex;gap:8px;flex-wrap:wrap}
.name-form input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card-2);color:var(--ink)}
.section-title{font-size:22px;color:var(--ink-soft);font-weight:600}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.topic{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:0;background:var(--card);border-radius:28px;padding:16px 18px 20px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
@media (hover:hover){.topic:hover{transform:translateY(-3px)}}
.topic::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:var(--tc)}
.topic-art{flex:none;width:104px;padding:10px;border-radius:24px;background:var(--tc-soft)}
.topic-art svg{display:block;width:100%;height:auto}
.topic-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.topic-title{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.topic-teacher{color:var(--ink-soft);font-size:16px}
.topic-meta{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--tc);margin-top:6px}
.topic-sign{position:absolute;right:14px;top:6px;font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1;color:var(--tc);opacity:.22}
.topic.soon{cursor:default}
.topic.soon:hover{transform:none}
.topic.soon .topic-art{filter:saturate(.55)}
.lock{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--ink-soft);font-family:var(--font-display);font-weight:600;font-size:14px}
.mixed{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border-radius:28px;padding:18px 22px;box-shadow:var(--shadow)}
.resume{outline:4px solid var(--tc);outline-offset:-4px}
.mixed-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.mixed-text h3{font-size:24px}
.mixed-text p{color:var(--ink-soft)}
.grownups{background:var(--card-2);border-radius:20px;padding:6px 20px;color:var(--ink-soft);font-size:16px}
.grownups summary{font-family:var(--font-display);font-weight:600;font-size:17px;padding:10px 0;cursor:pointer;color:var(--ink)}
.grownups-body{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;max-width:68ch}
.confirm-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.voice-row{display:flex;flex-direction:column;gap:6px}
.voice-row label{font-weight:700;color:var(--ink)}
.voice-row .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voice-row select{flex:1;min-width:0;max-width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}

/* topic levels */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-soft);font-family:var(--font-display);font-weight:600}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:lvl}
.level{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.lvl-num{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--tc-soft);color:var(--tc);font-family:var(--font-display);font-weight:700;font-size:26px}
.level.done .lvl-num{background:var(--tc);color:#fff}
.lvl-text{flex:1;min-width:160px;display:flex;flex-direction:column}
.lvl-text b{font-family:var(--font-display);font-weight:600;font-size:22px}
.lvl-text span{color:var(--ink-soft);font-size:16px}
.lvl-stars{display:flex;gap:2px}
.lvl-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.tag{display:inline-block;align-self:flex-start;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--sun);color:#3A2A00;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase}

/* lesson */
.why-card{background:var(--tc-soft);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.why-card h3{font-size:18px;color:var(--tc);text-transform:uppercase;letter-spacing:.8px}
.lesson-go{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.lesson-go.ready .btn-big{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* stepper (worked explanation) */
.stepper{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.st-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-title{font-family:var(--font-display);font-weight:700;font-size:22px;flex:1;min-width:0}
.st-dots{display:flex;gap:6px}
.st-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.st-dots i.on{background:var(--tc)}
.st-say{display:flex;gap:12px;align-items:flex-start;background:var(--card-2);border-radius:20px;padding:12px 14px;font-size:20px}
.st-say .cw-sm{width:64px}
.st-say p{flex:1;min-width:0;align-self:center}
.st-visual{display:flex;justify-content:center;align-items:center;min-height:120px;overflow-x:auto;padding:6px 0}
.st-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st-why{border-top:3px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.st-why b{font-family:var(--font-display);color:var(--tc)}

/* visuals */
.frames{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:4px;padding:6px;border-radius:14px;background:var(--card);border:3px solid var(--line)}
.cell{display:grid;place-items:center;border-radius:8px;background:var(--card-2)}
.dot{width:32px;height:32px;border-radius:50%;display:block;position:relative;box-shadow:inset -3px -4px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.35)}
.dot-a{background:var(--dot-a)}
.dot-b{background:var(--dot-b);animation:pop .4s ease-out backwards}
.dot-e{background:none;box-shadow:none;border:3px dashed var(--dot-b)}
.dot-x{background:var(--dot-a);opacity:.35}
.dot-x::before,.dot-x::after{content:"";position:absolute;left:50%;top:-4px;width:5px;height:40px;margin-left:-2.5px;background:var(--oops);border-radius:3px;transform:rotate(45deg)}
.dot-x::after{transform:rotate(-45deg)}
@keyframes pop{from{transform:scale(0)}}
.nl{width:100%;max-width:660px;height:auto;display:block}
.nl-axis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.nl-tick{stroke:var(--ink);stroke-width:2}
.nl-pt{fill:var(--ink)}
.nl text{font-family:var(--font-display);text-anchor:middle}
.nl-num{fill:var(--ink-soft);font-size:17px;font-weight:500}
.nl-mark{fill:var(--ink);font-size:22px;font-weight:700}
.nl-hop{fill:none;stroke-width:4;stroke-linecap:round}
.nl-hop.nl-add{stroke:var(--add)} .nl-hop.nl-sub{stroke:var(--sub)}
.nl-head.nl-add{fill:var(--add)} .nl-head.nl-sub{fill:var(--sub)}
.nl-lab{font-size:20px;font-weight:700}
.nl-lab.nl-add{fill:var(--add)} .nl-lab.nl-sub{fill:var(--sub)}
.vis-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.vis-op{font-family:var(--font-display);font-weight:700;font-size:40px;color:var(--ink-soft)}
.vis-stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.blocks{display:flex;flex-direction:column;align-items:center;gap:6px}
.b-set{display:flex;align-items:flex-end;gap:5px;min-height:100px}
.b-rod{display:block;width:12px;height:100px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--bc) 0 9px,rgba(0,0,0,.25) 9px 10px);box-shadow:inset -2px 0 0 rgba(0,0,0,.15)}
.b-ones{display:grid;grid-template-rows:repeat(5,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;margin-left:6px}
.b-cube{display:block;width:12px;height:12px;border-radius:2px;background:var(--bc);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.b-flat{display:block;width:100px;height:100px;border-radius:4px;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(0,0,0,.22) 9px 10px),repeating-linear-gradient(to right,var(--bc) 0 9px,rgba(0,0,0,.22) 9px 10px)}
.tint-a{--bc:var(--dot-a)} .tint-b{--bc:var(--dot-b)}
.b-rod.x,.b-cube.x{opacity:.25;outline:2px solid var(--oops)}
.b-cap{font-family:var(--font-display);font-weight:700;font-size:24px}
.split{display:flex;flex-direction:column;align-items:center;font-family:var(--font-display);font-weight:700;font-size:30px}
.split span{display:grid;place-items:center;min-width:64px;height:64px;padding:0 10px;border-radius:32px;background:var(--card-2);border:3px solid var(--tc)}
.sp-legs{width:150px;height:44px}
.sp-legs path{stroke:var(--tc);stroke-width:4;stroke-linecap:round;fill:none}
.sp-parts{display:flex;gap:56px}
.eq{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,7vw,52px);text-align:center;font-variant-numeric:tabular-nums}
.eq mark{background:var(--good-soft);color:var(--good);border-radius:14px;padding:0 12px}
.eq small{display:block;font-size:20px;font-weight:600;color:var(--ink-soft)}
.col{display:grid;grid-template-columns:40px repeat(var(--n),54px);align-items:end;font-family:var(--font-display);font-weight:700;font-size:38px;text-align:center;font-variant-numeric:tabular-nums}
.col-h{font-size:16px;color:var(--ink-soft);font-weight:600;letter-spacing:.5px;padding-bottom:2px}
.col-c{font-size:20px;color:var(--add);height:26px;line-height:26px}
.col-d{height:56px;line-height:56px;border-radius:10px}
.col-op{font-size:34px;color:var(--ink-soft);height:56px;line-height:56px}
.col-rule{grid-column:1/-1;height:4px;border-radius:2px;background:var(--ink);margin:4px 0}
.col-ans{color:var(--good)}
.col .hl{background:var(--sun);color:#2A1E00}
.col-h.hl{background:none;color:var(--ink)}
.ex{position:relative;display:inline-block;line-height:1}
.ex s{color:var(--ink-soft);text-decoration-color:var(--oops);text-decoration-thickness:4px}
.ex em{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-style:normal;font-size:19px;color:var(--sub);white-space:nowrap}
.col .hl .ex s{color:#5B4A1A}

/* practice */
.practice{display:flex;flex-direction:column;gap:18px}
.pr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pdots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pdots i{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.pdots i.cur{border-color:var(--tc);transform:scale(1.2)}
.pdots i.ok{background:var(--good);border-color:var(--good)}
.pdots i.help{background:var(--sun);border-color:var(--sun)}
.pr-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.pr-left{display:flex;flex-direction:column;gap:18px;min-width:0}
.qcard{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.q-label{font-family:var(--font-display);font-weight:600;color:var(--ink-soft);font-size:16px;letter-spacing:.6px;text-transform:uppercase}
.q{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:var(--font-display);font-weight:700;font-size:clamp(46px,9vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.q .op{color:var(--tc)}
.ans-box{display:inline-grid;place-items:center;min-width:1.6em;height:1.25em;padding:0 .2em;border-radius:20px;border:5px dashed var(--tc);background:var(--card-2);color:var(--ink)}
.ans-box.filled{border-style:solid}
.ans-box.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ans-box.wrong{border-color:var(--oops);background:var(--oops-soft);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.caret{display:inline-block;width:4px;height:.8em;background:var(--tc);animation:caret 1s steps(1) infinite;border-radius:2px}
@keyframes caret{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:66px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);font-family:var(--font-display);font-weight:600;font-size:32px}
.key:active{transform:translateY(2px)}
.key-sm{font-size:18px}
.pr-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.pr-actions .btn{width:100%}
.explain{display:flex;flex-direction:column;gap:12px}

/* results */
.results{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.big-stars{display:flex;gap:8px;justify-content:center}
.big-stars .star{width:64px;height:64px;animation:pop .5s ease-out backwards}
.big-stars .star:nth-child(2){animation-delay:.2s}.big-stars .star:nth-child(3){animation-delay:.4s}
.res-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf{position:absolute;top:55%;width:12px;height:16px;border-radius:3px;animation:fly 1.5s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--rot)*.5))}100%{transform:translate(var(--dx),45vh) rotate(var(--rot));opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--sky);padding:12px 20px;border-radius:16px;font-family:var(--font-display);font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* touch screens (iPad): no double-tap zoom on fast taps, no grey tap flash, no text selection on buttons */
button,.key,.topic{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.cw,.char,.topic-art{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.key:active{background:var(--card-2);box-shadow:none}
.topic:active{transform:scale(.98)}
@media (hover:none){body{background-attachment:scroll}}

/* practice: number pad stays in view while the explanation scrolls under the question */
.pr-right{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px);align-self:start}
@media (min-width:761px){
  .key{height:74px;font-size:36px}
  .key-sm{font-size:19px}
  .pr-actions .btn{min-height:62px}
}

/* lesson: side-by-side on wide screens such as an iPad in landscape */
.lesson-grid{display:flex;flex-direction:column;gap:22px}
.lesson-side,.lesson-main{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:1000px){
  .lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start}
  .lesson-side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
  .lesson-side .talk{flex-direction:column;align-items:flex-start}
  .lesson-side .bubble{width:100%}
  .lesson-side .bubble::before{display:none}
}

@media (max-width:760px){
  .pr-grid{display:flex;flex-direction:column;gap:12px}
  .pr-left,.pr-right{display:contents}
  #pr-talk{order:1} .qcard{order:2} .pad{order:3} .pr-actions{order:4} #explain{order:5}
  .topics{grid-template-columns:1fr}
  .pr-grid{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:stretch}
  .hero-cast{justify-content:center}
  .bubble::before{display:none}
  .talk{flex-direction:column;align-items:center}
  .talk .bubble{width:100%}
  .frame{grid-template-columns:repeat(5,34px);grid-template-rows:repeat(2,34px)}
  .dot{width:26px;height:26px}
  .dot-x::before,.dot-x::after{height:32px}
  .col{grid-template-columns:32px repeat(var(--n),44px);font-size:32px}
  .lvl-actions{margin-left:68px}
  .topbar{gap:6px}
  .brand{font-size:19px;white-space:nowrap;gap:8px;padding:2px}
  .brand-mark{width:34px;height:34px;font-size:21px}
  .pill{padding:5px 10px}
  .icon-btn{width:40px;height:40px}
  #pr-talk{flex-direction:row;align-items:center}
  #pr-talk .cw-md{width:80px}
  #pr-talk .bubble{padding:12px 16px}
  .qcard{padding:18px 12px}
  .key{height:58px}
  .practice,.pr-left{gap:12px}
}
@media (max-width:520px){
  .brand-name{display:none}
  .lang{padding:3px}
  .lang button{height:34px;padding:0 8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
/* =====================================================================
   NUMBER BUDDIES / TALVENNERNE
   How to extend later (times tables, sharing/division, ...):
   1. In TOPICS, remove `soon:true` from a topic and give it `levels`
      (each level: { id, examples:[problem], problems:[...] }).
      A problem is { a, b, op } (op is '+', '-', 'x' or '÷'), optional missing:'b'.
   2. Add the level texts (title, goal, what, why) to I18N.en.levels and
      I18N.da.levels under the same id.
   3. Add an explainer in EXPLAIN (keyed by strategy name), its sentences in
      I18N.<lang>.ex, and teach chooseStrategy() when to use it.
   ===================================================================== */

const M = '−';
const $ = (s, r = document) => r.querySelector(s);
const rep = (c, n) => Array.from({ length: Math.max(0, n) }, () => c);
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s[0].toUpperCase() + s.slice(1);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const digits = (n, N) => Array.from({ length: N }, (_, i) => Math.floor(n / 10 ** i) % 10);
const P = (a, b, op, extra) => ({ a, b, op, ...(extra || {}) });
const list = (a, b) => range(a, b).join(', ');

/* ---------- saved progress (this device only) ---------- */
const KEY = 'numberBuddies.v1';
let store = { name: '', best: {}, sound: true, lang: '' };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) store = { ...store, ...s }; } catch (e) {}
if (store.lang !== 'en' && store.lang !== 'da') store.lang = /^da\b/i.test(navigator.language || '') ? 'da' : 'en';
/* Progress lives in two places: this browser (instant, works offline) and, when the page runs
   on claude.ai, a private document in the signed-in account (survives cleared Safari data and
   follows the account to other devices). Only this viewer can read their own document. */
let cloud = null, cloudBusy = false, cloudDirty = false, cloudTimer = null;
function save() {
  store.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 600); }
}
async function pushCloud() {
  if (!cloud) return;
  if (cloudBusy) { cloudDirty = true; return; }
  cloudBusy = true;
  try { await cloud.set(JSON.parse(JSON.stringify(store))); }
  catch (e) {
    const c = e && e.code;
    if (c === 'unavailable') { cloudDirty = true; await new Promise(r => setTimeout(r, 1500 + Math.random() * 1000)); }
    else if (c !== 'resource_exhausted') cloud = null; // no write access in this view: keep using this device only
  }
  cloudBusy = false;
  if (cloudDirty && cloud) { cloudDirty = false; pushCloud(); }
}
function mergeRemote(r) {
  if ((r.resetAt || 0) > (store.savedAt || 0)) { store = { ...store, ...r }; return; }
  if ((store.resetAt || 0) > (r.savedAt || 0)) return;
  const best = { ...(r.best || {}) };
  for (const [k, v] of Object.entries(store.best || {})) best[k] = Math.max(best[k] || 0, v);
  const newer = (r.savedAt || 0) > (store.savedAt || 0);
  store = {
    ...store, best,
    name: newer ? (r.name || store.name || '') : (store.name || r.name || ''),
    lang: newer && (r.lang === 'en' || r.lang === 'da') ? r.lang : store.lang,
    sound: newer && typeof r.sound === 'boolean' ? r.sound : store.sound,
    round: newer ? (r.round || null) : (store.round || null)
  };
}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    const before = JSON.stringify(store);
    if (snap.exists) mergeRemote(snap.data());
    cloud = ref;
    save();
    if (JSON.stringify({ ...store, savedAt: 0 }) !== JSON.stringify({ ...JSON.parse(before), savedAt: 0 })) refreshAfterSync(JSON.parse(before).lang);
    const note = document.getElementById('sync-note'); if (note) note.textContent = tr().syncCloud;
  } catch (e) {}
}

/* ---------- pictures ---------- */
function frames(cells) {
  const n = Math.max(10, Math.ceil(cells.length / 10) * 10);
  let h = '<div class="frames" aria-hidden="true">';
  for (let f = 0; f < n / 10; f++) {
    h += '<div class="frame">';
    for (let i = 0; i < 10; i++) { const c = cells[f * 10 + i]; h += `<span class="cell">${c ? `<i class="dot dot-${c}"></i>` : ''}</span>`; }
    h += '</div>';
  }
  return h + '</div>';
}
function numberLine(from, hops = [], opt = {}) {
  const pts = [from], H = []; let cur = from;
  hops.forEach(to => { H.push({ a: cur, b: to }); cur = to; pts.push(to); });
  const lo = Math.min(...pts), hi = Math.max(...pts);
  let min = opt.min ?? Math.floor(lo / 10) * 10, max = opt.max ?? Math.ceil(hi / 10) * 10;
  if (max - min < 10) max = min + 10;
  const W = 640, pad = 30, y = 118, sx = v => pad + (v - min) / (max - min) * (W - 2 * pad);
  const dense = max - min <= 20;
  const marks = [...new Set(pts)].sort((a, b) => a - b);
  let s = `<svg class="nl" viewBox="0 0 ${W} 192" role="img" aria-label="${tr().numberLine} ${min}–${max}">`;
  s += `<line x1="${pad - 16}" y1="${y}" x2="${W - pad + 16}" y2="${y}" class="nl-axis"/>`;
  for (let v = min; v <= max; v++) {
    const ten = v % 10 === 0; if (!dense && !ten) continue;
    const x = sx(v);
    s += `<line x1="${x}" y1="${y - (ten ? 11 : 6)}" x2="${x}" y2="${y + (ten ? 11 : 6)}" class="nl-tick"/>`;
    if (!marks.includes(v) && !marks.some(m => Math.abs(sx(m) - x) < 30)) s += `<text x="${x}" y="${y + 34}" class="nl-num">${v}</text>`;
  }
  let lastX = -999, low = false;
  marks.forEach(v => { const x = sx(v); low = x - lastX < 40 ? !low : false; lastX = x;
    s += `<circle cx="${x}" cy="${y}" r="6" class="nl-pt"/><text x="${x}" y="${y + (low ? 62 : 34)}" class="nl-mark">${v}</text>`; });
  let prevLab = null;
  H.forEach(h => {
    const x1 = sx(h.a), x2 = sx(h.b), dx = Math.abs(x2 - x1), hh = Math.min(70, 16 + dx * .35), cy = y - 4 - 2 * hh, mx = (x1 + x2) / 2, yy = y - 4;
    const cls = h.b >= h.a ? 'nl-add' : 'nl-sub';
    s += `<path d="M${x1} ${yy} Q${mx} ${cy} ${x2} ${yy}" class="nl-hop ${cls}"/>`;
    const ang = Math.atan2(yy - cy, x2 - mx), L = 11;
    const p1 = [x2 - L * Math.cos(ang - .5), yy - L * Math.sin(ang - .5)], p2 = [x2 - L * Math.cos(ang + .5), yy - L * Math.sin(ang + .5)];
    s += `<polygon points="${x2},${yy} ${p1} ${p2}" class="nl-head ${cls}"/>`;
    const d = h.b - h.a;
    let ly = yy - hh - 9;
    if (prevLab && Math.abs(prevLab.x - mx) < 44 && Math.abs(prevLab.y - ly) < 22) ly = prevLab.y - 24;
    prevLab = { x: mx, y: ly };
    s += `<text x="${mx}" y="${ly}" class="nl-lab ${cls}">${d > 0 ? '+' : M}${Math.abs(d)}</text>`;
  });
  return s + '</svg>';
}
function blocks(n, { crossOnes = 0, crossTens = 0, tint = 'a' } = {}) {

  return h + '</div>';
}

/* ---------- choosing how to explain a question ---------- */
function chooseStrategy(p) {
  const { a, b } = p;
  if (p.op === '+') {
    if (p.missing) return 'bond10';
    if (a >= 100 || b >= 100) return 'columnAdd';
    if (a % 10 === 0 && b % 10 === 0) return 'tensAdd';
    if (a < 10 && b < 10) return a + b === 10 ? 'bond10' : a + b < 10 ? 'countOn' : 'bridgeAdd';
    if (a < 10 || b < 10) { const big = Math.max(a, b), small = Math.min(a, b); return big % 10 + small < 10 ? 'onesAdd' : 'bridgeAdd'; }
    return 'placeAdd';
  }
  if (a >= 100) return 'columnSub';
  if (a <= 10) return 'takeAway';
  if (b % 10 === 0) return 'tensSub';
  if (b < 10) return a % 10 >= b ? 'onesSub' : 'bridgeSub';
  return 'placeSub';
}
function explain(p) { const s = chooseStrategy(p); return EXPLAIN[s](p, tr().ex[s]); }

const EXPLAIN = {
  countOn({ a, b }, X) {
    const big = Math.max(a, b), small = Math.min(a, b), s = a + b, steps = [];
    steps.push({ say: X.s1(a, b), v: frames([...rep('a', a), ...rep('b', b)]) });
    if (a < b) steps.push({ say: X.trick(big, small), v: numberLine(big, [], { min: 0, max: 10 }) });
    steps.push({ say: X.count(big, small, list(big + 1, s)), v: numberLine(big, range(big + 1, s), { min: 0, max: Math.max(10, s) }) });
    steps.push({ say: X.land(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) });
    return { steps, why: X.why };
  },
  bond10({ a, b, missing }, X) {
    const q = missing ? `${a} + □ = 10` : `${a} + ${b}`;
    return { steps: [
      { say: X.s1(q, a), v: frames([...rep('a', a), ...rep('e', 10 - a)]) },
      { say: X.s2(list(1, b), b), v: frames([...rep('a', a), ...rep('b', b)]) },
      { say: X.s3(a, b), v: eq(missing ? `${a} + ${mk(b)} = 10` : `${a} + ${b} = ${mk(10)}`) }
    ], why: X.why };
  },
  bridgeAdd({ a, b }, X) {
    const big = Math.max(a, b), small = Math.min(a, b), ten = Math.floor(big / 10) * 10 + 10, need = ten - big, rest = small - need, s = a + b;
    const usesFrames = s <= 20;
    return { steps: [
      { say: X.s1(a, b, ten, big, a < b), v: usesFrames ? frames(rep('a', big)) : row(blocks(big), opS('+'), blocks(small, { tint: 'b' })) },
      { say: X.s2(big, need, ten, small, rest), v: split(small, need, rest) },
      { say: X.s3(big, need, ten), v: usesFrames ? frames([...rep('a', big), ...rep('b', need)]) : numberLine(big, [ten]) },
      { say: X.s4(ten, rest, s), v: usesFrames ? stack(frames([...rep('a', big), ...rep('b', small)]), numberLine(big, [ten, s], { min: 0, max: 20 })) : numberLine(big, [ten, s]) },
      { say: X.s5(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) }
    ], why: X.why(ten) };
  },
  onesAdd({ a, b }, X) {
    const big = Math.max(a, b), small = Math.min(a, b), t = Math.floor(big / 10), o = big % 10, s = a + b;
    return { steps: [
      { say: X.s1(big, t, o, small), v: row(blocks(big), opS('+'), blocks(small, { tint: 'b' })) },
      { say: X.s2(o, small, t), v: blocks(s) },
      { say: X.s3(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) }
    ], why: X.why };
  },
  tensAdd({ a, b }, X) {
    const s = a + b;
    return { steps: [
      { say: X.s1(a, b), v: row(blocks(a), opS('+'), blocks(b, { tint: 'b' })) },
      { say: X.s2(a / 10, b / 10, s / 10), v: blocks(s) },
      { say: X.s3(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) }
    ], why: X.why };
  },
  placeAdd({ a, b }, X) {
    const aT = a - a % 10, aO = a % 10, bT = b - b % 10, bO = b % 10, T = aT + bT, O = aO + bO, s = a + b;
    return { steps: [
      { say: X.s1(a, aT, aO, b, bT, bO), v: row(blocks(a), opS('+'), blocks(b, { tint: 'b' })) },
      { say: X.s2(aT, bT, T), v: eq(`${aT} + ${bT} = ${mk(T)}`, tr().tensLbl) },
      { say: X.s3(aO, bO, O), v: eq(`${aO} + ${bO} = ${mk(O)}`, tr().onesLbl) },
      { say: X.s4(T, O, s), v: stack(eq(`${T} + ${O} = ${mk(s)}`), blocks(s)) }
    ], why: X.why };
  },
  columnAdd({ a, b }, X) {
    const s = a + b, N = String(s).length, lenA = String(a).length, lenB = String(b).length, n = Math.max(lenA, lenB);
    const da = digits(a, N), db = digits(b, N), ans = Array(N).fill(null), carry = Array(N).fill(0), steps = [];
    const view = hl => colView('+', da, db, { N, lenA, lenB, ans: [...ans], carry: [...carry], hl });
    steps.push({ say: X.s1, v: view(-1) });
    let c = 0;
    for (let i = 0; i < N; i++) {
      if (i >= n) { ans[i] = c; steps.push({ say: X.carryOver(i), v: view(i) }); break; }
      const x = da[i], y = db[i], t = x + y + c;
      let say = X.col(i, x, y, c, t);
      if (t >= 10) { ans[i] = t % 10; carry[i + 1] = 1; c = 1; say += X.carry(i, t); }
      else { ans[i] = t; c = 0; say += X.write(t); }
      steps.push({ say, v: view(i) });
    }
    steps.push({ say: X.end(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) });
    return { steps, why: X.why };
  },
  takeAway({ a, b }, X) {
    const d = a - b;
    return { steps: [
      { say: X.s1(a, b), v: frames(rep('a', a)) },
      { say: X.s2(b), v: frames([...rep('a', d), ...rep('x', b)]) },
      { say: d ? X.left(list(1, d), d) : X.none(a, b), v: numberLine(a, range(d, a - 1).reverse(), { min: 0, max: 10 }) },
      { say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) }
    ], why: X.why };
  },
  onesSub({ a, b }, X) {
    const t = Math.floor(a / 10), o = a % 10, d = a - b, small = a <= 20;
    return { steps: [
      { say: X.s1(a, t, o), v: small ? frames(rep('a', a)) : blocks(a) },
      { say: X.s2(b, o), v: small ? frames([...rep('a', d), ...rep('x', b)]) : blocks(a, { crossOnes: b }) },
      { say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) }
    ], why: X.why };
  },
  bridgeSub({ a, b }, X) {
    const ten = Math.floor(a / 10) * 10, down = a - ten, rest = b - down, d = a - b, opt = a <= 20 ? { min: 0, max: 20 } : {};
    return { steps: [
      { say: X.s1(a, b, ten), v: numberLine(a, [], opt) },
      { say: X.s2(b, down, rest, ten), v: split(b, down, rest) },
      { say: X.s3(a, down, ten), v: numberLine(a, [ten], opt) },
      { say: X.s4(ten, rest, d), v: numberLine(a, [ten, d], opt) },
      { say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) }
    ], why: X.why };
  },
  tensSub({ a, b }, X) {
    const d = a - b, at = Math.floor(a / 10), bt = b / 10;
    return { steps: [
      { say: X.s1(a, b, at, bt), v: blocks(a) },
      { say: X.s2(at, bt), v: blocks(a, { crossTens: bt }) },
      { say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) }
    ], why: X.why(at, bt) };
  },
  placeSub({ a, b }, X) {
    const bO = b % 10, bT = b - bO, x = a - bT, d = a - b, steps = [];
    steps.push({ say: X.s1(a, b, bT, bO), v: split(b, bT, bO) });
    steps.push({ say: X.s2(a, bT, x), v: numberLine(a, [x]) });
    if (bO) {
      const ten = Math.floor(x / 10) * 10, down = x - ten;
      if (x % 10 >= bO || down === 0) steps.push({ say: X.ones(x, bO, d), v: numberLine(a, [x, d]) });
      else steps.push({ say: X.bridge(bO, down, ten, bO - down, d), v: numberLine(a, [x, ten, d]) });
    }
    steps.push({ say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) });
    return { steps, why: X.why };
  },
  columnSub({ a, b }, X) {
    const N = String(a).length, lenB = String(b).length, orig = digits(a, N), top = [...orig], bot = digits(b, N), ans = Array(N).fill(null), steps = [];
    const view = hl => colView('-', [...top], bot, { N, lenA: N, lenB, ans: [...ans], orig, hl });
    steps.push({ say: X.s1, v: view(-1) });
    for (let i = 0; i < N; i++) {
      if (top[i] < bot[i]) {
        const was = top[i], before = top[i + 1];
        top[i + 1] -= 1; top[i] += 10;
        steps.push({ say: X.exchange(i, bot[i], was, before, top[i + 1], top[i]), v: view(i) });
      }
      const r = top[i] - bot[i]; ans[i] = r;
      steps.push({ say: X.col(i, top[i], bot[i], r), v: view(i) });
    }
    const d = a - b;
    steps.push({ say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) });
    return { steps, why: X.why };
  }
};

/* ---------- speech ---------- */
let lastSaid = { text: '', tid: 'hoot' };
// Best voice first: Premium, then Enhanced/natural voices (any accent), then UK English or Danish.
// A grown-up can also pick one exact voice in "For grown-ups"; that choice wins while it is installed.
function voicesFor(lang) {
  try { return speechSynthesis.getVoices().filter(v => lang === 'da' ? /^da/i.test(v.lang) : /^en/i.test(v.lang)); } catch (e) { return []; }
}
function voiceRank(v) {
  const s = `${v.name} ${v.voiceURI}`.toLowerCase();
  return (/premium/.test(s) ? 30 : /enhanced|neural|natural/.test(s) ? 20 : 0) + (/^(en-gb|da)/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
}
const rankedVoices = lang => voicesFor(lang).sort((a, b) => voiceRank(b) - voiceRank(a) || a.name.localeCompare(b.name));
function voiceFor(lang) {
  const list = rankedVoices(lang), chosen = store.voice && store.voice[lang];
  return (chosen && list.find(v => v.voiceURI === chosen)) || list[0] || null;
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => fillVoicePicker(); } catch (e) {}
function fillVoicePicker() {
  const sel = document.getElementById('voice-select'); if (!sel) return;
  const t = tr(), list = rankedVoices(store.lang), chosen = store.voice && store.voice[store.lang];
  sel.innerHTML = `<option value="">${t.voiceAuto}${list[0] ? ` (${esc(list[0].name)})` : ''}</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === chosen ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');
  const none = document.getElementById('voice-none'); if (none) none.hidden = list.length > 0;
}
function toSpeech(t) {
  const da = store.lang === 'da';
  return t.replace(/<[^>]+>/g, ' ')
    .replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/=/g, da ? ' er lig med ' : ' equals ').replace(/□/g, da ? ' hvad ' : ' blank ')
    .replace(/×/g, da ? ' gange ' : ' times ').replace(/÷/g, da ? ' divideret med ' : ' divided by ')
    .replace(/\((H|T|O|E)\)/g, '');
}
function speak(text, tid) {
  lastSaid = { text, tid };
  if (!store.sound) return;
  try {
    // iPad Safari drops an utterance queued right after cancel(), so wait a moment when something was playing
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toSpeech(text)), v = voiceFor(store.lang);
    u.lang = v ? v.lang : store.lang === 'da' ? 'da-DK' : 'en-GB'; if (v) u.voice = v;
    u.rate = .9; u.pitch = TEACHERS[tid]?.pitch || 1;
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

    const l = id === 'mixed' ? null : findLevel(id);
    const tid = l ? l.topic.teacher : 'sparkle';
    if (!S.finished) finishRound();
    const next = l ? l.topic.levels[l.topic.levels.indexOf(l) + 1] : null;
    const head = t.head[n - 1], msg = t.msg[n - 1](first);
    app.innerHTML = `${topbar()}
    <section class="results" style="${tcStyle(tid)}">
      ${charWrap(tid, 'joy', 'lg')}
      <div class="big-stars" aria-label="${t.starsOf(n)}">${stars(n)}</div>
      <h1 style="font-size:clamp(34px,6vw,52px)">${head}</h1>
      <p style="max-width:52ch">${msg}${S.improved && l ? t.newBest : ''}</p>
      <div class="res-actions">
        ${next && n >= 2 ? `<button class="btn btn-big" data-act="lesson" data-id="${next.id}">${t.nextLevel}</button>` : ''}
        <button class="btn ${next && n >= 2 ? 'btn-soft' : 'btn-big'}" data-act="practice" data-id="${id}">${t.playAgain}</button>
        ${l ? `<button class="btn btn-soft" data-act="lesson" data-id="${id}">${t.seeLesson}</button>` : ''}
        <button class="btn btn-soft" data-act="home">${t.home}</button>
      </div>
    </section>`;
    if (!S.quiet) { confetti(n * 18); speak(`${head} ${msg}`, tid); }
  }
};

function resumeCard() {
  const r = savedRound(); if (!r) return '';
  const t = tr(), l = r.id === 'mixed' ? null : findLevel(r.id), tid = l ? l.topic.teacher : 'sparkle';
  const title = l ? `${topicTitle(l.topic)} · ${lvlText(l).title}` : t.mixedTitle;
  return `<section class="mixed resume" style="${tcStyle(tid)}">
    ${charWrap(tid, 'happy', 'sm')}
    <div class="mixed-text"><h3>${t.resumeTitle}</h3><p>${t.resumeText(title, r.i + 1, r.list.length)}</p></div>
    <button class="btn" data-act="practice" data-id="${r.id}">${t.resumeBtn}</button>
  </section>`;
}

function topicCard(tp) {
  const t = tr(), st = tp.levels.reduce((s, l) => s + (store.best[l.id] || 0), 0);
  return `<button class="topic${tp.soon ? ' soon' : ''}" data-act="${tp.soon ? 'soon' : 'topic'}" data-id="${tp.id}" style="${tcStyle(tp.teacher)}">
    <span class="topic-sign" aria-hidden="true">${tp.sign}</span>
    <span class="topic-art">${charSvg(tp.teacher)}</span>
    <span class="topic-text">
      <span class="topic-title">${topicTitle(tp)}</span>
      <span class="topic-teacher">${t.withTeacher(tName(tp.teacher))}</span>
      ${tp.soon ? `<span class="lock">${t.soon}</span>` : `<span class="topic-meta">${t.topicMeta(st, tp.levels.length * 3, tp.levels.length)}</span>`}
    </span>
  </button>`;
}

function qText(p) {
  const op = p.op === '+' ? '+' : M;
  return p.missing ? `${p.a} ${op} □ = ${p.a + p.b}` : `${p.a} ${op} ${p.b}`;
}

/* ---------- step-by-step explainer ---------- */
let ST = null;
function mountStepper({ title, steps, why, tid, onDone, el, backToQ }) {
  ST = { title, steps, why, tid, onDone, backToQ, i: 0, el: el || $('#stepper') };
  renderStepper(false);
}
function renderStepper(talk = true) {
  if (!ST || !ST.el) return;
  const t = tr(), { steps, i, tid } = ST, s = steps[i], last = i === steps.length - 1;
  ST.el.innerHTML = `
    <div class="st-head"><span class="st-title">${ST.title}</span><span class="st-dots" aria-label="${i + 1} / ${steps.length}">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="st-say">${charWrap(tid, last ? 'joy' : 'happy', 'sm')}<p>${s.say}</p>${replayBtn()}</div>
    <div class="st-visual">${s.v}</div>
    ${last && ST.why ? `<div class="st-why"><b>${t.whyWorks}</b><p>${ST.why}</p></div>` : ''}
    <div class="st-nav">
      <button class="btn btn-soft btn-small" data-act="st-prev" ${i === 0 ? 'disabled' : ''}>${t.back}</button>
      ${!last ? `<button class="btn btn-small" data-act="st-next">${t.nextStep}</button>` : ST.backToQ ? `<button class="btn btn-small" data-act="back-to-q">${t.typeAnswer}</button>` : ''}
    </div>`;
  lastSaid = { text: s.say, tid };
  if (talk) speak(s.say, tid);
  if (last && ST.onDone) ST.onDone();
}

/* ---------- practice ---------- */
function renderPractice(fresh) {
  const t = tr(), p = S.list[S.i], tid = teacherFor(p);
  if (fresh) { S.input = ''; S.tries = 0; S.helped = false; S.done = false; }
  const title = S.id === 'mixed' ? t.mixedTitle : lvlText(findLevel(S.id)).title;
  const greet = S.i === 0 ? t.greetFirst(store.name ? esc(store.name) : '') : pick(t.greetNext);
  app.innerHTML = `${topbar()}
  <div class="practice" style="${tcStyle(tid)}">
    <div class="pr-top">
      <button class="btn-link" data-act="${S.id === 'mixed' ? 'home' : 'topic'}" data-id="${S.id === 'mixed' ? '' : findLevel(S.id).topic.id}">${t.stop}</button>
      <b style="font-family:var(--font-display)">${title}</b>
      <div class="pdots" aria-label="${t.questionN(S.i + 1, S.list.length)}">${S.list.map((_, k) => `<i class="${S.marks[k] || (k === S.i ? 'cur' : '')}"></i>`).join('')}</div>
    </div>
    <div class="pr-grid">
      <div class="pr-left">
        <section class="talk" id="pr-talk">
          ${charWrap(tid, S.done ? 'joy' : 'happy', 'md')}
          <div class="bubble"><p class="bubble-who">${tName(tid)}</p><div class="say-row"><p id="pr-say">${greet}</p>${replayBtn()}</div></div>
        </section>
        <div class="qcard"><span class="q-label">${t.questionN(S.i + 1, S.list.length)}</span><div class="q" id="q" aria-live="polite">${qHtml(p, S.done ? 'right' : '')}</div></div>
        <section class="explain" id="explain" hidden><div id="stepper" class="stepper"></div></section>
      </div>
      <div class="pr-right">
        <div class="pad" id="pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-act="key" data-k="${n}">${n}</button>`).join('')}
          <button class="key key-sm" data-act="key" data-k="clear">${t.clear}</button>
          <button class="key" data-act="key" data-k="0">0</button>
          <button class="key key-sm" data-act="key" data-k="back" aria-label="${t.delLast}">⌫</button>
        </div>
        <div class="pr-actions">
          <button class="btn btn-soft" data-act="howto">${t.showHow}</button>
          <button class="btn" id="check-btn" data-act="check">${t.check}</button>
        </div>
      </div>
    </div>
  </div>`;
  if (S.done) markDone();
  if (fresh) speak(`${greet} ${t.askQ(qText(p), p.missing)}`, tid);
  lastSaid = { text: `${greet} ${qText(p)}`, tid };
}
function qHtml(p, state = '') {
  const op = p.op === '+' ? '+' : M;
  const box = `<span class="ans-box${S.input ? ' filled' : ''}${state ? ' ' + state : ''}" id="ans">${S.input || (S.done ? '' : '<i class="caret"></i>')}</span>`;
  return p.missing
    ? `<span>${p.a}</span><span class="op">${op}</span>${box}<span>=</span><span>${p.a + p.b}</span>`
    : `<span>${p.a}</span><span class="op">${op}</span><span>${p.b}</span><span>=</span>${box}`;
}
function updateQ(state) { $('#q').innerHTML = qHtml(S.list[S.i], state); }
function teacherSay(text, mood) {
  const tid = teacherFor(S.list[S.i]);
  $('#pr-say').innerHTML = text; setMood($('#pr-talk'), mood); speak(text, tid);
  if (mood === 'joy') setTimeout(() => { const el = $('#pr-talk'); if (el) setMood(el, 'happy'); }, 1600);
}
function markDone() {
  const t = tr(), btn = $('#check-btn');
  btn.textContent = S.i === S.list.length - 1 ? t.seeStars : t.nextQ; btn.style.setProperty('--tc', 'var(--good)');
}
function pressKey(k) {
  if (S.done) return;
  if (k === 'clear') S.input = '';
  else if (k === 'back') S.input = S.input.slice(0, -1);
  else if (S.input.length < 4) S.input = (S.input === '0' ? '' : S.input) + k;
  updateQ();
}
/* ---------- unfinished rounds & stars ---------- */
const starsFor = first => first >= 9 ? 3 : first >= 7 ? 2 : 1;
function savedRound() {
  const r = store.round;
  if (!r || !Array.isArray(r.list) || !r.list.length || !(r.i > 0) || r.i >= r.list.length) return null;
  if (r.id !== 'mixed' && !findLevel(r.id)) return null;
  return r;
}
function saveRound() {
  store.round = { id: S.id, list: S.list.map(p => [p.a, p.b, p.op, p.missing ? 1 : 0]), i: S.i + 1, first: S.first, marks: S.marks.slice(0, S.i + 1) };
  save();
}
function finishRound() {
  S.finished = true;
  const n = starsFor(S.first);
  if (S.id !== 'mixed' && n > (store.best[S.id] || 0)) { store.best[S.id] = n; S.improved = true; }
  store.round = null;
  save();
}
function refreshAfterSync(prevLang) {
  if (store.lang !== prevLang) { const l = store.lang; store.lang = prevLang; switchLang(l); return; }
  if (screen === 'home' || screen === 'topic') SCREENS[screen](S);
  else { const pill = $('.pill'); if (pill) pill.innerHTML = `${ICON.star(true)} ${totalStars()}`; }
}

function check() {
  if (S.done) return nextQ();
  const t = tr(), p = S.list[S.i];
  if (S.input === '') { teacherSay(t.typeFirst, 'think'); return; }
  if (Number(S.input) === answerOf(p)) {
    S.done = true;
    const firstTry = S.tries === 0 && !S.helped;
    if (firstTry) S.first++;
    S.marks[S.i] = firstTry ? 'ok' : 'help';
    updateQ('right');
    const nm = store.name && Math.random() < .35 ? `, ${esc(store.name)}` : '';
    const sum = p.missing ? `${p.a} + ${p.b} = ${p.a + p.b}` : `${qText(p)} = ${answerOf(p)}`;
    teacherSay(firstTry ? `${pick(t.praise(nm))} ${sum}.` : pick(t.praiseHelp), 'joy');
    confetti(firstTry ? 28 : 14);
    markDone();
    $('.pdots').children[S.i].className = S.marks[S.i];
    if (S.i === S.list.length - 1) finishRound(); else saveRound();
  } else {
    S.tries++;
    updateQ('wrong');
    if (S.tries === 1) teacherSay(pick(t.retry) + t.orShow, 'think');
    else { teacherSay(t.together, 'think'); openHowTo(); }
    const bad = S.input;
    setTimeout(() => { if (!S.done && S.input === bad && $('#q')) { S.input = ''; updateQ(); } }, 900);
  }
}
function openHowTo(keepStep) {
  const p = S.list[S.i], e = explain(p), box = $('#explain');
  S.helped = true;
  box.hidden = false;
  mountStepper({ title: tr().howTitle(qText(p)), steps: e.steps, why: e.why, tid: teacherFor(p), el: $('#stepper'), onDone: null, backToQ: true });
  if (keepStep != null) { ST.i = Math.min(keepStep, e.steps.length - 1); renderStepper(false); return; }
  renderStepper(true);
  box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
}
function nextQ() {
  if (S.i >= S.list.length - 1) { show('results', S); return; }
  S.i++; renderPractice(true);
  window.scrollTo({ top: 0 });
}

/* ---------- switching language keeps your place ---------- */
function switchLang(l) {
  if (l === store.lang) return;
  store.lang = l; save(); applyLang(); hush();
  const step = ST && ST.el && document.contains(ST.el) ? ST.i : null;
  if (screen === 'practice') {
    const open = !$('#explain').hidden;
    renderPractice(false);
    if (open) openHowTo(step);
  } else if (screen === 'lesson') SCREENS.lesson({ ...S, keepStep: step || 0 });
  else if (screen === 'results') { S.quiet = true; SCREENS.results(); }
  else SCREENS[screen](S);
}

/* ---------- events ---------- */
const ACTIONS = {
  home: () => show('home'),
  topic: d => show('topic', { id: d.id }),
  lesson: d => show('lesson', { id: d.id }),
  practice: d => show('practice', { id: d.id }),
  soon: d => { const tp = TOPICS.find(x => x.id === d.id); toast(tr().soonToast(tName(tp.teacher), topicTitle(tp))); },
  lang: d => switchLang(d.l),
  sound: () => {
    const t = tr(); store.sound = !store.sound; save(); if (!store.sound) hush();
    const b = $('[data-act="sound"]'); b.innerHTML = ICON.sound(store.sound); b.setAttribute('aria-pressed', store.sound); b.setAttribute('aria-label', store.sound ? t.voiceOffLabel : t.voiceOnLabel);
    if (store.sound) speak(t.voiceOn, 'hoot');
  },
  replay: (d, b) => {
    const p = b.closest('.say-row, .st-say')?.querySelector('p');
    const s = store.sound; store.sound = true; speak(p ? p.textContent : lastSaid.text, lastSaid.tid); store.sound = s;
  },
  'back-to-q': () => { $('#q')?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); },
  'st-next': () => { if (ST.i < ST.steps.length - 1) { ST.i++; renderStepper(); } },
  'st-prev': () => { if (ST.i > 0) { ST.i--; renderStepper(); } },
  key: d => pressKey(d.k),
  check: () => check(),
  howto: () => openHowTo(),
  'reset-ask': () => { const t = tr(); $('#reset-row').innerHTML = `<span>${t.resetAsk}</span><button class="btn btn-small" style="--tc:var(--oops)" data-act="reset-yes">${t.resetYes}</button><button class="btn btn-small btn-soft" data-act="reset-no">${t.resetNo}</button>`; },
  'reset-no': () => show('home'),
  'voice-test': () => { const s = store.sound; store.sound = true; speak(tr().voiceSample, 'hoot'); store.sound = s; },
  'reset-yes': () => { store = { name: '', best: {}, sound: store.sound, lang: store.lang, round: null, resetAt: Date.now() }; save(); show('home'); toast(tr().resetDone); }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act]; if (fn) fn(b.dataset, b);
});
app.addEventListener('change', e => {
  if (e.target.id !== 'voice-select') return;
  store.voice = { ...(store.voice || {}), [store.lang]: e.target.value || null }; save();
  const s = store.sound; store.sound = true; speak(tr().voiceSample, 'hoot'); store.sound = s;
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'name') {
    const v = $('#name-input').value.trim(); if (!v) return;
    store.name = v.slice(0, 20); save(); show('home');
    speak(tr().helloSpoken(store.name), 'hoot');
  }
});
document.addEventListener('keydown', e => {
  if (screen !== 'practice' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) { pressKey(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { pressKey('back'); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const t = e.target;
    if (t !== document.body && t !== document && !t.classList?.contains('key') && t.id !== 'check-btn') return;
    check(); e.preventDefault();
  }
});

applyLang();
show('home');
connectCloud();
</script>

</body>
</html>
