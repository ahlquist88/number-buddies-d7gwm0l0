    levels: {
      a1: { title: 'Räkna vidare', goal: 'Plus med tal upp till 10', what: 'När vi räknar plus lägger vi ihop två grupper. Börja med ett tal i huvudet och räkna vidare.', why: 'Om du börjar med det största talet behöver du bara räkna lite till. Det går snabbare och det är lättare att inte räkna fel.' },
      a2: { title: 'Tiokompisar', goal: 'Talpar som blir 10', what: 'Vissa tal passar ihop och blir precis 10, som 7 och 3. De kallas tiokompisar.', why: 'Tio är det mest användbara talet i matte. När du kan talen som blir 10 utantill blir många större uppgifter lätta.' },
      a3: { title: 'Gör en tia', goal: 'Plus som går över 10', what: 'När summan går över 10 fyller du först upp en tia. Sedan lägger du till resten.', why: 'Det är lätt att lägga till 10: 10 + 3 är 13. Så vi gör en svår uppgift till två lätta genom att göra 10 först.' },
      a4: { title: 'Tiotal och ental', goal: 'Plus till tvåsiffriga tal', what: 'Ett tvåsiffrigt tal består av tiotal och ental. 34 är 3 tiotal och 4 ental. Titta på vilken del som ändras när du räknar plus.', why: 'Tiotal och ental är olika stora, som långa stavar och små kuber. När du lägger till ental ändras bara entalen, om de inte går över nästa tia.' },
      a5: { title: 'Stora tal', goal: 'Plus med två- och tresiffriga tal', what: 'Dela upp större tal i tiotal och ental, eller ställ upp dem: hundratal, tiotal och ental.', why: 'När du räknar varje kolumn för sig blir stora tal överskådliga. När en kolumn blir 10 eller mer flyttar den extra tian till nästa kolumn. Det kallas minnessiffra.' },
      a6: { title: 'Dubbelt och nästan dubbelt', goal: 'Lägg ett tal till sig självt, eller ett till', what: 'Dubbelt är ett tal plus samma tal, som 7 + 7. Nästan dubbelt är två granntal, som 7 + 8.', why: 'Dubblor är lätta att komma ihåg. När du kan dem är nästan dubbelt bara dubbelt plus 1.' },
      a7: { title: 'Plus 9 och 11', goal: 'Använd en tia och justera', what: 'För att lägga till 9 lägger du till 10 och tar bort 1. För att lägga till 11 lägger du till 10 och 1 till.', why: 'Det går snabbt att lägga till en hel tia. Att justera svaret med 1 är mycket lättare än att lägga till 9 i huvudet.' },
      a8: { title: 'Tre tal', goal: 'Lägg ihop tre tal', what: 'När du lägger ihop tre tal, leta först efter två som blir 10.', why: 'Du kan lägga ihop tal i vilken ordning som helst och svaret blir detsamma. Så ta det lättaste paret först.' },
      a9: { title: 'Hundrakompisar', goal: 'Talpar som blir 100', what: 'Hundrakompisar är par som 30 och 70, eller 45 och 55. Räkna upp till nästa tia och sedan i tiotal till 100.', why: 'Hundrakompisar fungerar som tiokompisar: 3 + 7 = 10, så 30 + 70 = 100.' },
      a10: { title: 'Plus tiotal och hundratal', goal: 'Lägg till tiotal och hundratal till tresiffriga tal', what: 'När du bara lägger till tiotal ändras bara tiotalssiffran. När du bara lägger till hundratal ändras bara hundratalssiffran.', why: 'Varje siffra har sin egen plats. Att lägga till på en plats påverkar inte de andra, så länge den inte går över 9.' },
      a11: { title: 'Över hundra', goal: 'Uppgifter som går över 100, 200, 300 …', what: 'När summan går över ett hundratal hoppar du först till hundratalet och lägger sedan till resten.', why: 'Hundratal är vänliga tal precis som tiotal. Att stanna vid hundratalet gör ett stort hopp till två lätta.' },
      a12: { title: 'Saknade tal', goal: 'Hitta den saknade delen', what: 'I en uppgift som 38 + □ = 50 räknar du upp från 38 till 50 för att hitta det saknade talet.', why: 'Plus och minus är varandras motsatser. Den saknade delen är avståndet mellan talen.' },
      a13: { title: 'Två minnessiffror', goal: 'Tresiffriga tal med två minnessiffror', what: 'Ställ upp kolumnerna och börja med entalen. Den här gången får du minnessiffra mer än en gång.', why: 'Varje kolumn kan bara rymma upp till 9. Varje extra tia flyttar till nästa kolumn, ända upp till tusentalen.' },
      a14: { title: 'Textuppgifter', goal: 'Plus i berättelser', what: 'Läs berättelsen noga. Om saker läggs ihop, eller det kommer fler, räknar du plus.', why: 'Matte finns överallt i vardagen. Att hitta talet i en berättelse är en riktig superkraft.' },
      a15: { title: 'Tusental', goal: 'Plus med fyrsiffriga tal i uppställning', what: 'Stora tal fungerar som tresiffriga: ställ upp tusental, hundratal, tiotal och ental, och börja med entalen.', why: 'Uppställning fungerar för alla tal, eftersom varje kolumn följer samma regel.' },
      s1: { title: 'Ta bort', goal: 'Minus inom 10', what: 'Minus betyder att börja med en grupp och ta bort några. Vi tar reda på hur många som är kvar.', why: 'När du stryker över ser du precis vad som är kvar. Du kan alltid kolla genom att lägga tillbaka: det som är kvar plus det du tog bort blir starttalet.' },
      s2: { title: 'Tillbaka till tio', goal: 'Minus inom 20', what: 'När du tar bort förbi 10 hoppar du först tillbaka till 10. Sedan hoppar du tillbaka resten.', why: 'Att stanna vid 10 gör ett stort svårt hopp till två små lätta hopp, och från 10 kan du använda dina tiokompisar.' },
      s3: { title: 'Tiotal och ental', goal: 'Minus från tvåsiffriga tal', what: 'Titta på talet du tar bort. Är det ental eller tiotal? Då vet du vilken del av det stora talet som ändras.', why: 'Tar du bort 3 ändras bara entalen. Tar du bort 30 ändras bara tiotalen. Om entalen tar slut, stanna vid tian på vägen.' },
      s4: { title: 'Tiotal först', goal: 'Tvåsiffrigt minus tvåsiffrigt', what: 'Dela upp talet du tar bort i tiotal och ental. Ta bort tiotalen först och sedan entalen.', why: 'Två små hopp är lättare än ett stort. När du tar tiotalen först blir enthoppet litet, och du kan kolla genom att räkna plus.' },
      s5: { title: 'Subtraktion med uppställning', goal: 'Tresiffriga tal med växling', what: 'Ställ upp talen och börja med entalen. Om den övre siffran är för liten växlar du 1 från nästa kolumn.', why: 'När du växlar byter du 1 tiotal mot 10 ental (eller 1 hundratal mot 10 tiotal). Talet är detsamma, det är bara uppdelat på ett annat sätt så att vi kan ta bort.' },
      s6: { title: 'Räkna upp', goal: 'Hitta skillnaden', what: 'När två tal ligger nära varandra räknar du upp från det mindre talet till det större.', why: 'Minus betyder också att hitta skillnaden. Att räkna upp över ett litet mellanrum går snabbare än att räkna bakåt.' },
      s7: { title: 'Minus 9 och 11', goal: 'Använd en tia och justera', what: 'För att ta bort 9 tar du bort 10 och lägger tillbaka 1. För att ta bort 11 tar du bort 10 och 1 till.', why: 'Det är lätt att ta bort en hel tia. Sedan behöver du bara justera svaret med 1.' },
      s8: { title: 'Från ett helt tiotal', goal: 'Som 40 − 7', what: 'För att ta bort ett litet tal från ett helt tiotal delar du av en tia och använder dina tiokompisar.', why: '10 − 7 = 3, så 40 − 7 är 30 och 3, alltså 33. Tiokompisarna gör jobbet.' },
      s9: { title: 'Ta bort från 100', goal: 'Som 100 − 37', what: 'För att ta bort från 100 räknar du upp från det lilla talet till 100.', why: 'Svaret är talets hundrakompis. Det lättaste är att räkna upp i vänliga hopp.' },
      s10: { title: 'Minus tiotal och hundratal', goal: 'Ta bort tiotal och hundratal från tresiffriga tal', what: 'När du bara tar bort tiotal ändras bara tiotalssiffran. Samma sak gäller hundratal.', why: 'Varje siffra har sin egen plats. Att ta bort från en plats påverkar inte de andra, så länge det finns tillräckligt.' },
      s11: { title: 'Tillbaka över hundra', goal: 'Som 203 − 5', what: 'När du tar bort förbi ett hundratal hoppar du först tillbaka till hundratalet och sedan resten.', why: 'Att stanna vid hundratalet gör ett svårt hopp till två lätta, precis som att stanna vid en tia.' },
      s12: { title: 'Saknade tal', goal: 'Hitta den saknade delen', what: 'I 62 − □ = 40 räknar du upp från 40 till 62. I □ − 15 = 30 lägger du ihop 30 och 15.', why: 'Plus och minus är varandras motsatser, så du kan vända på frågan.' },
      s13: { title: 'Nollor i vägen', goal: 'Växla över en nolla', what: 'Om nästa kolumn har en 0 kan du inte växla från den. Gå en kolumn till och växla sedan steg för steg.', why: '400 är samma sak som 3 hundratal och 10 tiotal, som är samma som 3 hundratal, 9 tiotal och 10 ental. Talet ändras aldrig.' },
      s14: { title: 'Textuppgifter', goal: 'Minus i berättelser', what: 'Läs berättelsen. Om något tas bort eller används, eller du ska ta reda på hur många som saknas, räknar du minus.', why: 'Att hitta matten i en berättelse är något du kommer att använda varje dag.' },
      s15: { title: 'Tusental', goal: 'Subtraktion med fyrsiffriga tal i uppställning', what: 'Ställ upp tusental, hundratal, tiotal och ental. Börja med entalen och växla när den övre siffran är för liten.', why: 'Uppställning fungerar för alla tal, eftersom varje kolumn följer samma regel.' },
      m1: { title: 'Lika stora grupper', goal: '2:ans tabell', what: 'Gånger betyder lika stora grupper. 4 · 2 betyder 4 grupper med 2. Räkna med 2 i taget för att hitta svaret.', why: 'Att multiplicera är ett snabbt sätt att lägga ihop samma tal om och om igen.' },
      m2: { title: '10:ans tabell', goal: 'Räkna med 10 i taget', what: 'Gånger 10 betyder grupper med tio. 6 · 10 är 6 tiotal, alltså 60.', why: 'När du multiplicerar med 10 flyttar varje siffra ett steg åt vänster och en 0 kommer in på entalens plats.' },
      m3: { title: '5:ans tabell', goal: 'Räkna med 5 i taget', what: 'Räkna med 5 i taget: 5, 10, 15, 20 … Eller använd 10:ans tabell och ta hälften.', why: '5 är hälften av 10, så 5 gånger ett tal är hälften av 10 gånger talet. 5:ans tabell slutar alltid på 5 eller 0.' },
      m4: { title: 'Rader och byte', goal: 'Vänd på det', what: 'En array är rader med prickar. 5 · 7 är 5 rader med 7, och det är också 7 rader med 5.', why: 'Du kan byta plats på talen i en multiplikation och få samma svar. Välj det sätt som är lättast.' },
      m5: { title: '3:ans tabell', goal: 'Räkna med 3 i taget', what: '3 grupper är 2 grupper och en till. Ta det dubbla av talet och lägg till talet en gång till.', why: 'Om du kan dina dubblor kan du räkna ut alla tal i 3:ans tabell.' },
      m6: { title: '4:ans tabell', goal: 'Det dubbla av 2:ans', what: '4 är det dubbla av 2. För att multiplicera med 4 tar du det dubbla och sedan det dubbla igen.', why: '4:ans tabell är det dubbla av 2:ans tabell.' },
      m7: { title: '8:ans tabell', goal: 'Det dubbla av 4:ans', what: '8 är det dubbla av 4. För att multiplicera med 8 tar du det dubbla tre gånger.', why: 'Varje dubblering gör det dubbelt så stort: 2:an, 4:an, 8:an.' },
      m8: { title: 'Blandade tabeller', goal: '3:ans, 4:ans och 8:ans', what: 'Titta på talet du multiplicerar med och välj ditt knep: en grupp till för 3, dubbelt dubbelt för 4, dubbelt dubbelt dubbelt för 8.', why: 'När du har ett knep för varje tabell kan du alltid räkna ut det, även om du glömmer.' },
      m9: { title: 'Saknade tal', goal: 'Som □ · 4 = 20', what: 'Räkna i tabellen tills du når svaret. Antalet hopp är det saknade talet.', why: 'Ett saknat tal i en multiplikation är egentligen en division. Gånger och division är varandras motsatser.' },
      m10: { title: 'Större multiplikation', goal: 'Tvåsiffrigt gånger ensiffrigt', what: 'Dela upp det stora talet i tiotal och ental. Multiplicera varje del och lägg sedan ihop.', why: 'När du delar upp blir en svår multiplikation till två lätta som använder tabellerna du kan.' },
      d1: { title: 'Dela lika', goal: 'Dela mellan 2 och 3', what: 'Att dela betyder att alla får lika många. Dela ut en i taget.', why: 'Rättvis delning ger lika stora grupper. Du kan kolla med en multiplikation.' },
      d2: { title: 'Gör grupper', goal: 'Hur många femmor eller tior?', what: '20 / 5 kan betyda: hur många grupper med 5 får plats i 20? Räkna med 5 i taget och räkna hoppen.', why: 'Division är motsatsen till multiplikation, så när du räknar i hopp hittar du svaret.' },
      d3: { title: 'Använd tabellerna', goal: 'Dela med 2, 5 och 10', what: 'För att räkna ut 35 / 5 tänker du: vad gånger 5 blir 35?', why: 'Varje multiplikation ger dig en division på köpet. 7 · 5 = 35, så 35 / 5 = 7.' },
      d4: { title: 'Halvera', goal: 'Hälften av större tal', what: 'Att dela med 2 är att halvera. Halvera tiotalen och entalen var för sig och lägg ihop.', why: 'Det är lätt att halvera tiotal och ental, och när du sätter ihop dem igen har du hälften av hela talet.' },
      d5: { title: 'Dela med 3', goal: 'Använd 3:ans tabell', what: 'För att räkna ut 24 / 3 räknar du med 3 i taget upp till 24 och räknar hoppen.', why: '3:ans tabell baklänges delar i 3 lika stora grupper.' },
      d6: { title: 'Dela med 4', goal: 'Halvera och halvera igen', what: 'Att dela med 4 är samma sak som att halvera två gånger.', why: '4 är 2 · 2, så två halveringar ger 4 lika stora delar.' },
      d7: { title: 'Dela med 8', goal: 'Använd 8:ans tabell', what: 'För att räkna ut 56 / 8 tänker du: vad gånger 8 blir 56? Eller halvera tre gånger.', why: '8 är 2 · 2 · 2, så tre halveringar ger 8 lika stora delar.' },
      d8: { title: 'Blandad division', goal: 'Dela med 3, 4 och 8', what: 'Titta på talet du delar med och välj ditt knep: 3:ans tabell, halvera två gånger för 4, eller 8:ans tabell.', why: 'Alla divisioner kan kollas med en multiplikation.' },
      d9: { title: 'Saknade tal', goal: 'Som □ / 4 = 6', what: 'Vänd på det med en multiplikation: □ / 4 = 6 betyder 6 · 4 = □.', why: 'Division och gånger är varandras motsatser, så det ena kan alltid göra det andra ogjort.' },
      d10: { title: 'Större division', goal: 'Tvåsiffrigt delat med ensiffrigt', what: 'Dela upp talet i delar som är lätta att dela, som 40 och 8. Dela varje del och lägg sedan ihop.', why: 'När du delar upp i vänliga delar kan du använda tabellerna du redan kan.' }
    },
    ex: {
      countOn: { s1: (a, b) => `Vi räknar ut ${a} + ${b}. Plus betyder att lägga ihop grupper och se hur många det blir sammanlagt.`, trick: (big, small) => `Här är ett knep: börja med det största talet, ${big}. Då behöver du bara räkna ${small} till.`, count: (big, small, l) => `Ha ${big} i huvudet och räkna ${small} till: ${l}.`, land: (a, b, s) => `Vi landade på ${s}. Så ${a} + ${b} = ${s}!`, why: 'Det går snabbare att räkna vidare från det största talet än att räkna allt från 1.' },
      bond10: { s1: (q, a) => `${q}. En tioram har 10 rutor. ${a} av dem är fyllda.`, s2: (l, b) => `Räkna de tomma rutorna: ${l}. Det saknas ${b}.`, s3: (a, b) => `Så ${a} + ${b} = 10. ${a} och ${b} är tiokompisar!`, why: 'Tiokompisarna är 1 och 9, 2 och 8, 3 och 7, 4 och 6, och 5 och 5. När du kan dem utantill blir större uppgifter mycket lättare.' },
      bridgeAdd: { s1: (a, b, ten, big, swap) => `${a} + ${b} går över ${ten}, så vi använder ${ten} som ett trappsteg.${swap ? ` Vi börjar med det största talet, ${big}.` : ''}`, s2: (big, need, ten, small, rest) => `${big} behöver ${need} till för att bli ${ten}. Så vi delar upp ${small} i ${need} och ${rest}.`, s3: (big, need, ten) => `Först: ${big} + ${need} = ${ten}.`, s4: (ten, rest, s) => `Sedan: ${ten} + ${rest} = ${s}. Det är lätt att lägga till på en hel tia!`, s5: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: ten => `Tiotal är vänliga tal. När vi gör ${ten} först blir en svår uppgift till två lätta.` },
      onesAdd: { s1: (big, t, o, small) => `${big} är ${tio(t)} och ${o} ental. Vi lägger till ${small} ental.`, s2: (o, small, t) => `Bara entalen ändras: ${o} + ${small} = ${o + small}. Tiotalen är fortfarande ${t}.`, s3: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'När du lägger till några ental och de inte går över 9 är tiotalen desamma. Bara entalssiffran ändras.' },
      tensAdd: { s1: (a, b) => `${a} är ${a / 10} tiotal och ${b} är ${b / 10} tiotal.`, s2: (x, y, z) => `${x} tiotal + ${y} tiotal = ${z} tiotal. Det är precis som ${x} + ${y} = ${z}!`, s3: (a, b, s) => `${s / 10} tiotal är ${s}. Så ${a} + ${b} = ${s}.`, why: 'Att lägga ihop tiotal är som att lägga ihop små tal. Du räknar tiotal i stället för ental.' },
      placeAdd: { s1: (a, aT, aO, b, bT, bO) => `Dela upp båda talen i tiotal och ental: ${a} = ${aT} + ${aO} och ${b} = ${bT} + ${bO}.`, s2: (x, y, z) => `Lägg ihop tiotalen: ${x} + ${y} = ${z}.`, s3: (x, y, z) => `Lägg ihop entalen: ${x} + ${y} = ${z}.${z >= 10 ? ` Det är mer än 9 ental, så 10 av dem blir ett nytt tiotal: ${z} = 10 + ${z - 10}.` : ''}`, s4: (T, O, s) => `Sätt ihop dem igen: ${T} + ${O} = ${s}.`, why: 'Tiotal och ental är olika stora, som långa stavar och små kuber. När du lägger ihop varje sort för sig håller du ordning på allt.' },
      columnAdd: { s1: 'Ställ upp talen: hundratal (H), tiotal (T) och ental (E). Se till att siffrorna står rakt under varandra.', carryOver: i => `Minnessiffran 1 flyttar till ${D[i]}. Skriv 1.`, col: (i, x, y, c, t) => `${cap(D[i])}: ${x} + ${y}${c ? ' + 1 i minnet' : ''} = ${t}.`, carry: (i, t) => ` Det är 10 eller mer, så skriv ${t % 10} och ha 1 i minnet till ${D[i + 1]}.`, write: t => ` Skriv ${t}.`, end: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'Vi börjar alltid med entalen. Om de blir 10 eller mer flyttar den extra tian till tiotalskolumnen. Det kallas minnessiffra.' },
      takeAway: { s1: (a, b) => `${a} ${M} ${b} betyder: börja med ${a} och ta sedan bort ${b}.`, s2: b => `Stryk över ${b}.`, left: (l, d) => `Räkna det som är kvar: ${l}. Det är ${d} kvar.`, none: (a, b) => `Det är ingenting kvar! ${a} minus ${b} är 0.`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}. Kolla: ${d} + ${b} = ${a}.`, why: 'Minus betyder att ta reda på hur många som är kvar. Du kan kolla genom att lägga tillbaka: det som är kvar plus det du tog bort blir starttalet.' },
      onesSub: { s1: (a, t, o) => `${a} är ${tio(t)} och ${o} ental.`, s2: (b, o) => `Ta bort ${b} från entalen: ${o} ${M} ${b} = ${o - b}. Tiotalen ändras inte.`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}.`, why: 'När det finns tillräckligt med ental att ta bort är det bara entalen som ändras. Tiotalen är desamma.' },
      bridgeSub: { s1: (a, b, ten) => `${a} ${M} ${b} är ett svårt hopp, så vi stannar vid ${ten} på vägen.`, s2: (b, down, rest, ten) => `Dela upp ${b} i ${down} och ${rest}. Med ${down} kommer vi ner till ${ten}.`, s3: (a, down, ten) => `Först hoppar vi ${down} bakåt: ${a} ${M} ${down} = ${ten}.`, s4: (ten, rest, d) => `Sedan hoppar vi ${rest} till bakåt: ${ten} ${M} ${rest} = ${d}.`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}. Kolla: ${d} + ${b} = ${a}.`, why: 'När vi stannar vid en tia blir ett stort svårt hopp till två små lätta hopp.' },
      tensSub: { s1: (a, b, at, bt) => `${b} är ${bt} tiotal, så bara tiotalen ändras. ${a} har ${at} tiotal.`, s2: (at, bt) => `${at} tiotal minus ${bt} tiotal blir ${at - bt} tiotal. Det är precis som ${at} ${M} ${bt} = ${at - bt}!`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}.`, why: (at, bt) => `Att ta bort tiotal fungerar som att ta bort små tal. ${at} ${M} ${bt} = ${at - bt}, så ${at} tiotal ${M} ${bt} tiotal = ${at - bt} tiotal.` },
      placeSub: { s1: (a, b, bT, bO) => `${a} ${M} ${b}. Dela upp ${b} i tiotal och ental: ${bT} och ${bO}.`, s2: (a, bT, x) => `Ta bort tiotalen först: ${a} ${M} ${bT} = ${x}.`, ones: (x, bO, d) => `Ta nu bort entalen: ${x} ${M} ${bO} = ${d}.`, bridge: (bO, down, ten, rest, d) => `Ta nu bort ${bO} ental. Hoppa ${down} bakåt till ${ten}, och sedan ${rest} till till ${d}.`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}. Kolla med plus: ${d} + ${b} = ${a}.`, why: 'När du tar bort tiotalen först och sedan entalen blir varje hopp litet. Det är smart att kolla genom att lägga ihop svaret igen.' },
      columnSub: { s1: 'Ställ upp talen med det största talet överst. Börja med entalen.', exchange: (i, bot, was, before, after, now) => `${cap(D[i])}: vi kan inte ta ${bot} från ${was}. Växla 1 ${P[i + 1]} mot 10 ${P[i]}. ${cap(D[i + 1])} går från ${before} till ${after}, och ${D[i]} går från ${was} till ${now}.`, col: (i, t, b, r) => `${cap(D[i])}: ${t} ${M} ${b} = ${r}. Skriv ${r}.`, end: (a, b, d) => `Så ${a} ${M} ${b} = ${d}. Kolla: ${d} + ${b} = ${a}.`, why: 'När den övre siffran är för liten växlar vi 1 från nästa kolumn mot 10 i den här kolumnen. Talet är fortfarande detsamma, det är bara uppdelat på ett annat sätt.',
        noNext: (i, bot, was, j) => `${cap(D[i])}: vi kan inte ta ${bot} från ${was}, och det finns inga ${P[i + 1]} att växla. Så vi går först till ${D[j]}.`, exch: (k, before, after, low, lowAfter) => `Växla 1 ${P[k]} mot 10 ${P[k - 1]}. ${cap(D[k])} går från ${before} till ${after}, och ${D[k - 1]} går från ${low} till ${lowAfter}.` },
      story: { intro: (op, q) => op === '+' ? `Vi letar efter matten i berättelsen. Saker läggs ihop, så vi räknar plus: ${q}.` : `Vi letar efter matten i berättelsen. Något tas bort, eller vi ska hitta det som saknas, så vi räknar minus: ${q}.`, end: n => `Så svaret på berättelsen är ${n}.` },
      doubles: { s1: a => `${a} + ${a} är dubbelt: samma tal två gånger.`, split: (t, o) => `Dubbla tiotalen och dubbla entalen: det dubbla av ${t} är ${2 * t}, och det dubbla av ${o} är ${2 * o}.`, know: (a, s) => `Om du kan dina dubblor vet du det direkt: det dubbla av ${a} är ${s}.`, end: (a, s) => `Så ${a} + ${a} = ${s}.`, why: 'Dubblor är lätta att komma ihåg, och de hjälper med många andra uppgifter, som nästan dubbelt.' },
      nearDouble: { s1: (a, b) => `${a} och ${b} är granntal, så det här är nästan dubbelt.`, s2: sm => `Dubbla det mindre talet: ${sm} + ${sm} = ${2 * sm}.`, s3: (big, sm, d) => `${big} är ett mer än ${sm}, så lägg till 1: ${d} + 1 = ${d + 1}.`, end: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'Om du kan dina dubblor är nästan dubbelt bara dubbelt plus ett.' },
      compAdd: { s1: (b, ten) => `${b} ligger väldigt nära ${ten}, och det är lätt att lägga till ${ten}!`, s2: (a, ten) => `Lägg först till ${ten}: ${a} + ${ten} = ${a + ten}.`, minus: (x, s) => `Men vi lade till 1 för mycket, så ta bort 1: ${x} − 1 = ${s}.`, plus: (x, s) => `Vi behöver lägga till 1 till: ${x} + 1 = ${s}.`, end: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'Det går snabbt att lägga till en hel tia. Sedan justerar du bara med 1. Knepet fungerar för 9, 11, 19 och 21.' },
      threeAdd: { s1: (a, b, c) => `${a} + ${b} + ${c}. Med tre tal letar du först efter två som är lätta att lägga ihop.`, ten: (x, y) => `${x} och ${y} är tiokompisar! ${x} + ${y} = 10.`, double: (x, y, xy) => `${x} och ${y} är en dubbla: ${x} + ${y} = ${xy}.`, start: (x, y, xy) => `Börja med de två första: ${x} + ${y} = ${xy}.`, last: (xy, z, s) => `Lägg nu till det sista talet: ${xy} + ${z} = ${s}.`, end: (a, b, c, s) => `Så ${a} + ${b} + ${c} = ${s}.`, why: 'Du kan lägga ihop tal i vilken ordning som helst. När du först hittar ett par som blir 10 blir resten lätt.' },
      threeLeft: { s1: (a, b, ab) => `Vi räknar från vänster till höger. Först: ${a} + ${b} = ${ab}.`, s2: (ab, c, s) => `Lägg sedan till det sista talet: ${ab} + ${c} = ${s}.`, end: (a, b, c, s) => `Så ${a} + ${b} + ${c} = ${s}.`, why: 'Att lägga ihop två tal i taget fungerar alltid, vilken ordning du än väljer.' },
      bond100: { s1: a => `${a} + □ = 100. Hur långt är det från ${a} till 100?`, toTen: (a, up, nt) => `Hoppa först till nästa tia: ${a} + ${up} = ${nt}.`, toHundred: (nt, j) => `Hoppa sedan i tiotal upp till 100: ${nt} + ${j} = 100.`, add: (j1, j2, b) => `Lägg ihop hoppen: ${j1} + ${j2} = ${b}.`, end: (a, b) => `Så ${a} + ${b} = 100. ${a} och ${b} är hundrakompisar!`, why: 'Hundrakompisar fungerar som tiokompisar. 30 + 70 = 100 eftersom 3 + 7 = 10.' },
      placeBig: { s1: (b, k, col) => `${b} är ${k} ${P[col]}, så bara ${P[col]}ssiffran ändras.`, s2: (d, k, col) => `${d} ${P[col]} + ${k} ${P[col]} = ${d + k} ${P[col]}. De andra siffrorna är desamma.`, end: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'När du bara lägger till tiotal eller bara hundratal är de andra siffrorna desamma, så länge inget går över 9.' },
      placeBigSub: { s1: (b, k, col) => `${b} är ${k} ${P[col]}, så bara ${P[col]}ssiffran ändras.`, s2: (d, k, col) => `${d} ${P[col]} − ${k} ${P[col]} = ${d - k} ${P[col]}. De andra siffrorna är desamma.`, end: (a, b, d) => `Så ${a} − ${b} = ${d}.`, why: 'När du bara tar bort tiotal eller bara hundratal är de andra siffrorna desamma, så länge det finns tillräckligt.' },
      missingAdd: { s1: (q, known, c) => `${q}. Tänk: vad ska vi lägga till ${known} för att få ${c}?`, jump: (x, y, j) => `Räkna upp från ${x} till ${y}: det är ${j}.`, add: (js, ans) => `Lägg ihop hoppen: ${js} = ${ans}.`, end: (ans, e) => `Det saknade talet är ${ans}. Kolla: ${e}.`, why: (c, known, ans) => `Plus och minus är varandras motsatser. Du kan också räkna minus: ${c} − ${known} = ${ans}.` },
      missingSub: { s1b: (a, c) => `${a} − □ = ${c}. Något togs bort från ${a} och ${c} blev kvar. Räkna upp från ${c} till ${a} för att hitta det.`, s1a: (b, c) => `□ − ${b} = ${c}. Vi tog bort ${b} och ${c} blev kvar.`, back: (c, b, a) => `Så starttalet är det som blev kvar plus det som togs bort: ${c} + ${b} = ${a}.`, jump: (x, y, j) => `Räkna upp från ${x} till ${y}: det är ${j}.`, add: (js, ans) => `Lägg ihop hoppen: ${js} = ${ans}.`, end: (ans, e) => `Det saknade talet är ${ans}. Kolla: ${e}.`, why: 'Minus och plus är varandras motsatser, så du kan alltid vända på en fråga med ett saknat tal.' },
      countUpAny: { s1: (a, b) => `${a} − ${b}: vi räknar upp från ${b} till ${a} med vänliga tal.`, jump: (x, y, j) => `Från ${x} upp till ${y}: det är ${j}.`, add: (js, d) => `Lägg ihop hoppen: ${js} = ${d}.`, end: (a, b, d) => `Så ${a} − ${b} = ${d}.`, why: 'Minus betyder också att hitta skillnaden. Att räkna upp avståndet i vänliga hopp fungerar alltid.' },
      compSub: { s1: (b, ten) => `${b} ligger väldigt nära ${ten}, och det är lätt att ta bort ${ten}!`, s2: (a, ten) => `Ta först bort ${ten}: ${a} − ${ten} = ${a - ten}.`, plus: (x, d) => `Men vi tog bort 1 för mycket, så lägg tillbaka 1: ${x} + 1 = ${d}.`, minus: (x, d) => `Vi behöver ta bort 1 till: ${x} − 1 = ${d}.`, end: (a, b, d) => `Så ${a} − ${b} = ${d}.`, why: 'Det går snabbt att ta bort en hel tia. Justera sedan med 1: lägg tillbaka 1 för 9, ta bort 1 till för 11.' },
      fromTen: { s1: (a, b) => `${a} − ${b}. Dela upp ${a} i ${a - 10} och 10.`, s2: b => `Använd dina tiokompisar: 10 − ${b} = ${10 - b}.`, s3: (r, f, d) => `Sätt ihop det igen: ${r} + ${f} = ${d}.`, end: (a, b, d) => `Så ${a} − ${b} = ${d}.`, why: 'När du tar bort ett litet tal från ett helt tiotal använder du tiokompisarna: svarets entalssiffra är tiokompisen till talet du tog bort.' },
      from100: { s1: b => `100 − ${b}. Räkna upp från ${b} till 100 i vänliga hopp.`, jump: (x, y, j) => `Från ${x} upp till ${y}: det är ${j}.`, add: (js, d) => `Lägg ihop hoppen: ${js} = ${d}.`, end: (b, d) => `Så 100 − ${b} = ${d}. ${b} och ${d} är hundrakompisar!`, why: 'Att ta bort från 100 är samma sak som att hitta hundrakompisen.' },
      countAll: { s1: (a, b) => `Vi räknar alla. Här är ${a} orange och ${b} blå brickor.`, s2: l => `Peka på varje bricka och räkna: ${l}.`, end: (a, b, s) => `Det är ${s} sammanlagt. Så ${a} + ${b} = ${s}.`, why: 'Att räkna allt fungerar alltid. Det tar längre tid, men det är ett bra sätt att kolla.' },
      jumpAdd: { s1: (a, b, parts) => `Börja vid ${a} på tallinjen. Dela upp ${b} i ${parts} och hoppa en del i taget.`, jump: (pt, at) => `Hoppa +${pt}: vi landar på ${at}.`, end: (a, b, s) => `Vi landade på ${s}. Så ${a} + ${b} = ${s}.`, why: 'När du hoppar i hundratal, tiotal och ental är stora uppgifter lätta att följa.' },
      jumpSub: { s1: (a, b, parts) => `Börja vid ${a} på tallinjen. Dela upp ${b} i ${parts} och hoppa en del bakåt i taget.`, jump: (pt, at) => `Hoppa ${pt} bakåt: vi landar på ${at}.`, end: (a, b, d) => `Vi landade på ${d}. Så ${a} − ${b} = ${d}.`, why: 'När du hoppar bakåt i hundratal, tiotal och ental blir en stor minusuppgift till små lätta steg.' },
      partitionAdd: { s1: (a, pa, b, pb) => `Dela upp båda talen i sina delar: ${a} = ${pa} och ${b} = ${pb}.`, place: (i, x, y, s) => `Lägg ihop ${D[i]}: ${x} + ${y} = ${s}.`, join: (parts, s) => `Lägg nu ihop delarna: ${parts} = ${s}.`, end: (a, b, s) => `Så ${a} + ${b} = ${s}.`, why: 'Att lägga ihop varje plats för sig och sedan sätta ihop dem är som uppställning, fast högt.' },
      countBack: { s1: (a, b, l) => `Börja vid ${a} och räkna ${b} bakåt: ${l}.`, end: (a, b, d) => `Vi landade på ${d}. Så ${a} − ${b} = ${d}.`, why: 'Att räkna bakåt en i taget tar tid, men det fungerar alltid för små tal.' },
      groups: { s1: (a, b, x) => `${a} ${x} ${b} betyder ${a} grupper med ${b}.`, s2: (b, l) => `Räkna med ${b} i taget, en grupp i taget: ${l}.`, end: (a, b, r, x) => `Så ${a} ${x} ${b} = ${r}.`, why: (a, b, x) => `Multiplikation är ett snabbt sätt att lägga ihop lika stora grupper. ${a} ${x} ${b} är ${b} lagt ihop ${a} gånger.` },
      tensMul: { s1: (a, x) => `${a} ${x} 10 betyder ${a} grupper med tio. Det är ${a} tiotal.`, s2: (a, r) => `${a} tiotal är ${r}. Varje siffra flyttar ett steg åt vänster och en 0 kommer in på entalens plats.`, end: (a, r, x) => `Så ${a} ${x} 10 = ${r}.`, why: 'Gånger 10 gör varje siffra tio gånger mer värd, så varje siffra flyttar ett steg åt vänster.' },
      fives: { s1: (a, x, l) => `${a} ${x} 5: räkna med 5 i taget, ${a} gånger: ${l}.`, trick: (a, t, r, x) => `Här är ett knep: ${a} ${x} 10 = ${t}, och 5 är hälften av 10, så ta hälften av ${t}. Det blir ${r}.`, end: (a, r, x) => `Så ${a} ${x} 5 = ${r}.`, why: '5 är hälften av 10, så 5:ans tabell är hälften av 10:ans tabell. 5:ans tabell slutar alltid på 5 eller 0.' },
      array: { s1: (a, b, x) => `${a} ${x} ${b} kan ritas som en array: ${a} rader med ${b} prickar i varje.`, s2: (a, b, x) => `Vänd på den så får du ${b} rader med ${a}. Det är samma prickar! Så ${a} ${x} ${b} = ${b} ${x} ${a}.`, s3: (a, b, l) => `Använd ${a}:ans tabell: räkna med ${a} i taget, ${b} gånger: ${l}.`, end: (a, b, r, x) => `Så ${a} ${x} ${b} = ${r}.`, why: 'Du kan byta plats på talen i en multiplikation och svaret blir detsamma. Välj den ordning som är lättast för dig.' },
      threes: { s1: (a, x) => `${a} ${x} 3 är samma som 3 grupper med ${a}.`, s2: (a, d, r, x) => `Knep: 2 grupper med ${a} är det dubbla av ${a}, alltså ${d}. En grupp till med ${a}: ${d} + ${a} = ${r}.`, end: (a, r, x) => `Så ${a} ${x} 3 = ${r}.`, why: 'Tre grupper är två grupper plus en grupp till. Om du kan dina dubblor kan du räkna ut alla tal i 3:ans tabell.' },
      fours: { s1: (a, x) => `${a} ${x} 4: fyra är det dubbla av 2, så vi kan dubbla två gånger.`, s2: (a, d, x) => `Det dubbla av ${a} är ${d}. Det är ${a} ${x} 2.`, s3: (d, r, a, x) => `Dubbla igen: ${d} + ${d} = ${r}. Det är ${a} ${x} 4.`, end: (a, r, x) => `Så ${a} ${x} 4 = ${r}.`, why: '4:ans tabell är det dubbla av 2:ans tabell.' },
      eights: { s1: (a, x) => `${a} ${x} 8: åtta är dubbelt dubbelt dubbelt, så vi dubblar tre gånger!`, d1: (a, d) => `Det dubbla av ${a}: ${d}.`, d2: (d, e) => `Dubbla igen: ${e}.`, d3: (e, r) => `Och en gång till: ${r}.`, end: (a, r, x) => `Så ${a} ${x} 8 = ${r}.`, why: 'Varje dubblering gör det dubbelt så stort: 2:an, sedan 4:an, sedan 8:an.' },
      skipCount: { s1: (a, b, x) => `${a} ${x} ${b}: hoppa med ${b} i taget längs tallinjen, ${a} gånger.`, s2: (b, l) => `Säg talen högt medan du hoppar: ${l}.`, end: (a, b, r, x) => `Vi landade på ${r}. Så ${a} ${x} ${b} = ${r}.`, why: 'Att räkna i lika stora hopp är det som gångertabellerna är gjorda av.' },
      repeatAdd: { s1: (a, b, x, sum) => `${a} ${x} ${b} betyder att lägga ihop ${b}, ${a} gånger: ${sum}.`, s2: l => `Lägg ihop dem en i taget: ${l}.`, end: (a, b, r, x) => `Så ${a} ${x} ${b} = ${r}.`, why: 'Gånger är ett kort sätt att skriva samma tal lagt ihop om och om igen.' },
      partitionMul: { s1: (a, b, T, O, x) => `${a} ${x} ${b}. Dela upp ${a} i ${T} och ${O}.`, part: (n, b, r, x) => `${n} ${x} ${b} = ${r}.`, add: (x1, x2, r) => `Lägg ihop de två svaren: ${x1} + ${x2} = ${r}.`, end: (a, b, r, x) => `Så ${a} ${x} ${b} = ${r}.`, why: 'När du delar upp ett stort tal i tiotal och ental blir en svår multiplikation till två lätta.' },
      missingMul: { s1: (q, k, c) => `${q}. Vilket tal gånger ${k} blir ${c}?`, s2: (k, c, l) => `Räkna med ${k} i taget tills du når ${c}: ${l}.`, s3: ans => `Det är ${ans} hopp, så det saknade talet är ${ans}.`, end: (ans, e) => `Kolla: ${e}.`, why: (c, k, ans, dv) => `Ett saknat tal i en multiplikation är egentligen en division: ${c} ${dv} ${k} = ${ans}.` },
      share: { s1: (a, b, dv) => `${a} ${dv} ${b} betyder: dela ${a} lika mellan ${b}.`, s2: b => `Ge en till var och en av de ${b}, om och om igen, tills det är slut.`, end: (a, b, q, dv) => `Var och en får ${q}. Så ${a} ${dv} ${b} = ${q}.`, why: (b, q, a, x) => `När man delar rättvist får alla lika många. Kolla med en multiplikation: ${b} ${x} ${q} = ${a}.` },
      group: { s1: (a, b, dv) => `${a} ${dv} ${b} kan betyda: hur många grupper med ${b} får plats i ${a}?`, s2: (b, a, l) => `Hoppa med ${b} i taget från 0 till ${a} och räkna hoppen: ${l}.`, end: (a, b, q, dv) => `Det är ${q} hopp. Så ${a} ${dv} ${b} = ${q}.`, why: b => `Division är motsatsen till multiplikation. Att räkna hopp på ${b} är ${b}:ans tabell baklänges.` },
      inverse: { s1: (a, b, dv, x) => `${a} ${dv} ${b}: tänk på ${b}:ans tabell. Vilket tal gånger ${b} blir ${a}?`, s2: (b, l, a, q) => `Räkna med ${b} i taget: ${l}. ${a} är nummer ${q}.`, end: (a, b, q, dv, x) => `${q} ${x} ${b} = ${a}, så ${a} ${dv} ${b} = ${q}.`, why: 'Om du kan dina gångertabeller kan du också din division. De är varandras motsatser.' },

      s6: { title: 'Hitung naik', goal: 'Mencari selisih', what: 'Kalau dua angka berdekatan, hitung naik dari angka yang lebih kecil ke yang lebih besar.', why: 'Pengurangan juga berarti mencari selisih. Menghitung naik pada jarak yang kecil lebih cepat daripada menghitung mundur.' },
      s7: { title: 'Mengurangi 9 dan 11', goal: 'Pakai sepuluh, lalu perbaiki', what: 'Untuk mengurangi 9, kurangi 10 lalu tambahkan kembali 1. Untuk mengurangi 11, kurangi 10 lalu kurangi 1 lagi.', why: 'Mengurangi satu puluhan penuh itu mudah. Setelah itu kamu hanya perlu memperbaiki jawaban dengan 1.' },
      s8: { title: 'Dari puluhan penuh', goal: 'Seperti 40 − 7', what: 'Untuk mengurangi angka kecil dari puluhan penuh, ambil satu puluhan dan pakai teman 10.', why: '10 − 7 = 3, jadi 40 − 7 adalah 30 dan 3, yaitu 33. Teman 10 yang bekerja.' },
      s9: { title: 'Mengurangi dari 100', goal: 'Seperti 100 − 37', what: 'Untuk mengurangi dari 100, hitung naik dari angka kecil sampai 100.', why: 'Jawabannya adalah teman 100 dari angka itu. Cara termudah adalah menghitung naik dengan lompatan yang ramah.' },
      s10: { title: 'Mengurangi puluhan dan ratusan', goal: 'Mengurangi puluhan dan ratusan dari bilangan tiga angka', what: 'Kalau kamu hanya mengurangi puluhan, hanya angka puluhan yang berubah. Begitu juga dengan ratusan.', why: 'Setiap angka punya tempatnya sendiri. Mengurangi dari satu tempat tidak mengubah yang lain, selama jumlahnya cukup.' },
      s11: { title: 'Mundur melewati seratus', goal: 'Seperti 203 − 5', what: 'Kalau mengurangi melewati ratusan, lompat dulu mundur ke ratusan itu, lalu sisanya.', why: 'Berhenti di ratusan mengubah satu lompatan sulit menjadi dua lompatan mudah, sama seperti berhenti di puluhan.' },
      s12: { title: 'Angka yang hilang', goal: 'Cari bagian yang hilang', what: 'Pada 62 − □ = 40, hitung naik dari 40 sampai 62. Pada □ − 15 = 30, jumlahkan 30 dan 15.', why: 'Penjumlahan dan pengurangan saling berlawanan, jadi kamu bisa membalik pertanyaannya.' },
      s13: { title: 'Ada nol di tengah', goal: 'Meminjam melewati nol', what: 'Kalau kolom berikutnya berisi 0, kamu tidak bisa meminjam dari situ. Pergi satu kolom lagi, lalu pinjam langkah demi langkah.', why: '400 sama dengan 3 ratusan dan 10 puluhan, yang sama dengan 3 ratusan, 9 puluhan, dan 10 satuan. Bilangannya tidak pernah berubah.' },
      s14: { title: 'Soal cerita', goal: 'Pengurangan dalam cerita', what: 'Baca ceritanya. Kalau ada yang diambil atau dipakai, atau kamu harus mencari berapa lagi yang dibutuhkan, kamu mengurangi.', why: 'Menemukan matematika di dalam cerita adalah keterampilan yang akan kamu pakai setiap hari.' },
      s15: { title: 'Ribuan', goal: 'Pengurangan bersusun empat angka', what: 'Susun ribuan, ratusan, puluhan, dan satuan. Mulai dari satuan dan pinjam kalau angka atas terlalu kecil.', why: 'Cara bersusun berhasil untuk bilangan sebesar apa pun, karena setiap kolom mengikuti aturan yang sama.' },
      m1: { title: 'Kelompok yang sama', goal: 'Perkalian 2', what: 'Kali artinya kelompok yang sama besar. 4 × 2 artinya 4 kelompok berisi 2. Hitung loncat 2 untuk menemukan jawabannya.', why: 'Perkalian adalah cara cepat menjumlahkan angka yang sama berulang-ulang.' },
      m2: { title: 'Perkalian 10', goal: 'Hitung loncat 10', what: 'Kali 10 artinya kelompok berisi sepuluh. 6 × 10 adalah 6 puluhan, yaitu 60.', why: 'Saat dikali 10, setiap angka pindah satu tempat ke kiri dan angka 0 mengisi tempat satuan.' },
      m3: { title: 'Perkalian 5', goal: 'Hitung loncat 5', what: 'Hitung loncat 5: 5, 10, 15, 20 … Atau pakai perkalian 10 lalu ambil setengahnya.', why: '5 adalah setengah dari 10, jadi 5 kali sebuah angka adalah setengah dari 10 kali angka itu. Perkalian 5 selalu berakhir dengan 5 atau 0.' },
      m4: { title: 'Susunan dan tukar tempat', goal: 'Balik urutannya', what: 'Susunan adalah baris-baris titik. 5 × 7 adalah 5 baris berisi 7, dan juga 7 baris berisi 5.', why: 'Kamu boleh menukar tempat angka dalam perkalian dan hasilnya tetap sama. Pilih cara yang paling mudah.' },
      m5: { title: 'Perkalian 3', goal: 'Hitung loncat 3', what: '3 kelompok adalah 2 kelompok ditambah satu lagi. Gandakan angkanya, lalu tambahkan angka itu sekali lagi.', why: 'Kalau kamu hafal penjumlahan kembar, kamu bisa menghitung semua perkalian 3.' },
      m6: { title: 'Perkalian 4', goal: 'Dua kali perkalian 2', what: '4 adalah dua kali 2. Untuk mengali 4, gandakan angkanya, lalu gandakan lagi.', why: 'Perkalian 4 adalah dua kali perkalian 2.' },
      m7: { title: 'Perkalian 8', goal: 'Dua kali perkalian 4', what: '8 adalah dua kali 4. Untuk mengali 8, gandakan tiga kali.', why: 'Setiap kali digandakan, hasilnya jadi dua kali lebih besar: 2, 4, lalu 8.' },
      m8: { title: 'Perkalian campuran', goal: 'Perkalian 3, 4, dan 8', what: 'Lihat angka pengalinya dan pilih triknya: tambah satu kelompok untuk 3, gandakan dua kali untuk 4, gandakan tiga kali untuk 8.', why: 'Kalau punya trik untuk setiap perkalian, kamu selalu bisa menghitungnya, walaupun lupa.' },
      m9: { title: 'Angka yang hilang', goal: 'Seperti □ × 4 = 20', what: 'Hitung loncat sampai mencapai hasilnya. Banyaknya loncatan adalah angka yang hilang.', why: 'Angka yang hilang dalam perkalian sebenarnya adalah soal pembagian. Perkalian dan pembagian saling berlawanan.' },
      m10: { title: 'Perkalian lebih besar', goal: 'Dua angka dikali satu angka', what: 'Pecah angka yang besar menjadi puluhan dan satuan. Kalikan setiap bagian, lalu jumlahkan.', why: 'Memecah angka mengubah satu perkalian sulit menjadi dua perkalian mudah yang sudah kamu kuasai.' },
      d1: { title: 'Membagi rata', goal: 'Membagi kepada 2 dan 3', what: 'Membagi artinya memberi semua orang jumlah yang sama. Bagikan satu per satu.', why: 'Pembagian yang adil menghasilkan kelompok yang sama besar. Kamu bisa memeriksanya dengan perkalian.' },
      d2: { title: 'Membuat kelompok', goal: 'Ada berapa 5 atau 10?', what: '20 : 5 bisa berarti: berapa kelompok berisi 5 yang muat dalam 20? Hitung loncat 5 dan hitung loncatannya.', why: 'Pembagian adalah kebalikan dari perkalian, jadi hitung loncat membantumu menemukan jawabannya.' },
      d3: { title: 'Pakai perkalianmu', goal: 'Membagi dengan 2, 5, dan 10', what: 'Untuk menghitung 35 : 5, pikirkan: berapa kali 5 sama dengan 35?', why: 'Setiap fakta perkalian memberimu fakta pembagian gratis. 7 × 5 = 35, jadi 35 : 5 = 7.' },
      d4: { title: 'Membagi dua', goal: 'Setengah dari bilangan yang lebih besar', what: 'Membagi dengan 2 artinya membagi dua. Bagi dua puluhan dan satuannya masing-masing, lalu jumlahkan.', why: 'Setengah dari puluhan dan satuan itu mudah, dan kalau digabung lagi kamu mendapat setengah dari bilangan itu.' },
      d5: { title: 'Membagi dengan 3', goal: 'Pakai perkalian 3', what: 'Untuk menghitung 24 : 3, hitung loncat 3 sampai 24 dan hitung loncatannya.', why: 'Perkalian 3 yang dibalik membagi menjadi 3 kelompok yang sama besar.' },
      d6: { title: 'Membagi dengan 4', goal: 'Bagi dua, lalu bagi dua lagi', what: 'Membagi dengan 4 sama dengan membagi dua sebanyak dua kali.', why: '4 adalah 2 × 2, jadi dua kali dibagi dua menghasilkan 4 bagian yang sama besar.' },
      d7: { title: 'Membagi dengan 8', goal: 'Pakai perkalian 8', what: 'Untuk menghitung 56 : 8, pikirkan: berapa kali 8 sama dengan 56? Atau bagi dua tiga kali.', why: '8 adalah 2 × 2 × 2, jadi dibagi dua tiga kali menghasilkan 8 bagian yang sama besar.' },
      d8: { title: 'Pembagian campuran', goal: 'Membagi dengan 3, 4, dan 8', what: 'Lihat angka pembaginya dan pilih triknya: perkalian 3, bagi dua dua kali untuk 4, atau perkalian 8.', why: 'Setiap pembagian bisa diperiksa dengan perkalian.' },
      d9: { title: 'Angka yang hilang', goal: 'Seperti □ : 4 = 6', what: 'Balik dengan perkalian: □ : 4 = 6 artinya 6 × 4 = □.', why: 'Pembagian dan perkalian saling berlawanan, jadi yang satu selalu bisa membatalkan yang lain.' },
      d10: { title: 'Pembagian lebih besar', goal: 'Dua angka dibagi satu angka', what: 'Pecah angkanya menjadi bagian yang mudah dibagi, seperti 40 dan 8. Bagi setiap bagian, lalu jumlahkan.', why: 'Memecah menjadi bagian yang ramah membuatmu bisa memakai perkalian yang sudah kamu kuasai.' }
    },
    ex: {
      countOn: { s1: (a, b) => `Ayo hitung ${a} + ${b}. Penjumlahan artinya menggabungkan kelompok untuk mencari berapa semuanya.`, trick: (big, small) => `Ini triknya: mulai dari angka yang lebih besar, ${big}. Jadi kamu hanya perlu menghitung lanjut ${small}.`, count: (big, small, l) => `Simpan ${big} di kepala, lalu hitung lanjut ${small}: ${l}.`, land: (a, b, s) => `Kita sampai di ${s}. Jadi ${a} + ${b} = ${s}!`, why: 'Menghitung lanjut dari angka yang lebih besar lebih cepat daripada menghitung semuanya dari 1.' },
      bond10: { s1: (q, a) => `${q}. Bingkai sepuluh punya 10 kotak. ${a} sudah terisi.`, s2: (l, b) => `Hitung kotak yang kosong: ${l}. Masih kurang ${b}.`, s3: (a, b) => `Jadi ${a} + ${b} = 10. ${a} dan ${b} adalah teman 10!`, why: 'Teman 10 adalah 1 dan 9, 2 dan 8, 3 dan 7, 4 dan 6, serta 5 dan 5. Kalau sudah hafal, soal yang lebih besar jadi jauh lebih mudah.' },
      bridgeAdd: { s1: (a, b, ten, big, swap) => `${a} + ${b} melewati ${ten}, jadi kita pakai ${ten} sebagai batu loncatan.${swap ? ` Kita mulai dari angka yang lebih besar, ${big}.` : ''}`, s2: (big, need, ten, small, rest) => `${big} perlu ${need} lagi untuk menjadi ${ten}. Jadi kita pecah ${small} menjadi ${need} dan ${rest}.`, s3: (big, need, ten) => `Pertama: ${big} + ${need} = ${ten}.`, s4: (ten, rest, s) => `Lalu: ${ten} + ${rest} = ${s}. Menambah ke puluhan penuh itu mudah!`, s5: (a, b, s) => `Jadi ${a} + ${b} = ${s}.`, why: ten => `Puluhan adalah angka yang ramah. Membuat ${ten} dulu mengubah satu soal sulit menjadi dua soal mudah.` },
      onesAdd: { s1: (big, t, o, small) => `${big} adalah ${t} puluhan dan ${o} satuan. Kita menambah ${small} satuan.`, s2: (o, small, t) => `Hanya satuannya yang berubah: ${o} + ${small} = ${o + small}. Puluhannya tetap ${t}.`, s3: (a, b, s) => `Jadi ${a} + ${b} = ${s}.`, why: 'Kalau kamu menambah beberapa satuan dan tidak melewati 9, puluhannya tetap. Hanya angka satuan yang berubah.' },
      tensAdd: { s1: (a, b) => `${a} adalah ${a / 10} puluhan dan ${b} adalah ${b / 10} puluhan.`, s2: (x, y, z) => `${x} puluhan + ${y} puluhan = ${z} puluhan. Sama seperti ${x} + ${y} = ${z}!`, s3: (a, b, s) => `${s / 10} puluhan adalah ${s}. Jadi ${a} + ${b} = ${s}.`, why: 'Menjumlahkan puluhan sama seperti menjumlahkan angka kecil. Kamu menghitung puluhan, bukan satuan.' },
      placeAdd: { s1: (a, aT, aO, b, bT, bO) => `Pecah kedua angka menjadi puluhan dan satuan: ${a} = ${aT} + ${aO} dan ${b} = ${bT} + ${bO}.`, s2: (x, y, z) => `Jumlahkan puluhannya: ${x} + ${y} = ${z}.`, s3: (x, y, z) => `Jumlahkan satuannya: ${x} + ${y} = ${z}.${z >= 10 ? ` Itu lebih dari 9 satuan, jadi 10 di antaranya menjadi satu puluhan baru: ${z} = 10 + ${z - 10}.` : ''}`, s4: (T, O, s) => `Gabungkan lagi: ${T} + ${O} = ${s}.`, why: 'Puluhan dan satuan berbeda ukuran, seperti batang panjang dan kubus kecil. Menjumlahkan masing-masing membuat semuanya rapi.' },
      columnAdd: { s1: 'Tulis angkanya bersusun: ratusan (R), puluhan (P), dan satuan (S). Pastikan angkanya lurus di bawah satu sama lain.', carryOver: i => `Angka 1 yang disimpan pindah ke kolom ${P[i]}. Tulis 1.`, col: (i, x, y, c, t) => `${cap(P[i])}: ${x} + ${y}${c ? ' + 1 simpanan' : ''} = ${t}.`, carry: (i, t) => ` Itu 10 atau lebih, jadi tulis ${t % 10} dan simpan 1 ke kolom ${P[i + 1]}.`, write: t => ` Tulis ${t}.`, end: (a, b, s) => `Jadi ${a} + ${b} = ${s}.`, why: 'Kita selalu mulai dari satuan. Kalau hasilnya 10 atau lebih, puluhan tambahan pindah ke kolom puluhan. Itu disebut menyimpan.' },
      takeAway: { s1: (a, b) => `${a} ${M} ${b} artinya: mulai dari ${a}, lalu ambil ${b}.`, s2: b => `Coret ${b}.`, left: (l, d) => `Hitung yang tersisa: ${l}. Tersisa ${d}.`, none: (a, b) => `Tidak ada yang tersisa! ${a} dikurangi ${b} adalah 0.`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}. Periksa: ${d} + ${b} = ${a}.`, why: 'Pengurangan artinya mencari berapa yang tersisa. Kamu bisa memeriksa dengan menambahkan kembali: sisa ditambah yang diambil sama dengan angka awal.' },
      onesSub: { s1: (a, t, o) => `${a} adalah ${t} puluhan dan ${o} satuan.`, s2: (b, o) => `Ambil ${b} dari satuannya: ${o} ${M} ${b} = ${o - b}. Puluhannya tidak berubah.`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}.`, why: 'Kalau satuannya cukup untuk diambil, hanya satuan yang berubah. Puluhannya tetap.' },
      bridgeSub: { s1: (a, b, ten) => `${a} ${M} ${b} adalah lompatan yang sulit, jadi kita berhenti di ${ten} dalam perjalanan.`, s2: (b, down, rest, ten) => `Pecah ${b} menjadi ${down} dan ${rest}. Dengan ${down} kita turun ke ${ten}.`, s3: (a, down, ten) => `Pertama, lompat mundur ${down}: ${a} ${M} ${down} = ${ten}.`, s4: (ten, rest, d) => `Lalu lompat mundur ${rest} lagi: ${ten} ${M} ${rest} = ${d}.`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}. Periksa: ${d} + ${b} = ${a}.`, why: 'Berhenti di puluhan mengubah satu lompatan sulit menjadi dua lompatan kecil yang mudah.' },
      tensSub: { s1: (a, b, at, bt) => `${b} adalah ${bt} puluhan, jadi hanya puluhan yang berubah. ${a} punya ${at} puluhan.`, s2: (at, bt) => `${at} puluhan dikurangi ${bt} puluhan menjadi ${at - bt} puluhan. Sama seperti ${at} ${M} ${bt} = ${at - bt}!`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}.`, why: (at, bt) => `Mengurangi puluhan sama seperti mengurangi angka kecil. ${at} ${M} ${bt} = ${at - bt}, jadi ${at} puluhan ${M} ${bt} puluhan = ${at - bt} puluhan.` },
      placeSub: { s1: (a, b, bT, bO) => `${a} ${M} ${b}. Pecah ${b} menjadi puluhan dan satuan: ${bT} dan ${bO}.`, s2: (a, bT, x) => `Kurangi puluhannya dulu: ${a} ${M} ${bT} = ${x}.`, ones: (x, bO, d) => `Sekarang kurangi satuannya: ${x} ${M} ${bO} = ${d}.`, bridge: (bO, down, ten, rest, d) => `Sekarang kurangi ${bO} satuan. Lompat mundur ${down} ke ${ten}, lalu ${rest} lagi ke ${d}.`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}. Periksa dengan penjumlahan: ${d} + ${b} = ${a}.`, why: 'Mengurangi puluhan dulu, lalu satuan, membuat setiap lompatan tetap kecil. Menjumlahkan kembali jawabannya adalah cara bagus untuk memeriksa.' },
      columnSub: { s1: 'Tulis angkanya bersusun dengan angka yang lebih besar di atas. Mulai dari satuan.', exchange: (i, bot, was, before, after, now) => `${cap(P[i])}: kita tidak bisa mengambil ${bot} dari ${was}. Pinjam 1 ${P[i + 1]} menjadi 10 ${P[i]}. Angka ${P[i + 1]} berubah dari ${before} menjadi ${after}, dan ${P[i]} berubah dari ${was} menjadi ${now}.`, col: (i, t, b, r) => `${cap(P[i])}: ${t} ${M} ${b} = ${r}. Tulis ${r}.`, end: (a, b, d) => `Jadi ${a} ${M} ${b} = ${d}. Periksa: ${d} + ${b} = ${a}.`, why: 'Kalau angka atas terlalu kecil, kita meminjam 1 dari kolom berikutnya menjadi 10 di kolom ini. Bilangannya tetap sama, hanya dibagi dengan cara lain.',
        noNext: (i, bot, was, j) => `${cap(P[i])}: kita tidak bisa mengambil ${bot} dari ${was}, dan tidak ada ${P[i + 1]} untuk dipinjam. Jadi kita pergi dulu ke ${P[j]}.`, exch: (k, before, after, low, lowAfter) => `Pinjam 1 ${P[k]} menjadi 10 ${P[k - 1]}. Angka ${P[k]} berubah dari ${before} menjadi ${after}, dan ${P[k - 1]} berubah dari ${low} menjadi ${lowAfter}.` },
      story: { intro: (op, q) => op === '+' ? `Ayo cari soalnya di dalam cerita. Jumlahnya digabung, jadi kita menjumlahkan: ${q}.` : `Ayo cari soalnya di dalam cerita. Ada yang diambil, atau kita mencari yang kurang, jadi kita mengurangi: ${q}.`, end: n => `Jadi jawaban ceritanya adalah ${n}.` },
      doubles: { s1: a => `${a} + ${a} adalah penjumlahan kembar: angka yang sama dua kali.`, split: (t, o) => `Gandakan puluhan dan satuannya: dua kali ${t} adalah ${2 * t}, dan dua kali ${o} adalah ${2 * o}.`, know: (a, s) => `Kalau kamu hafal penjumlahan kembar, kamu langsung tahu: dua kali ${a} adalah ${s}.`, end: (a, s) => `Jadi ${a} + ${a} = ${s}.`, why: 'Penjumlahan kembar mudah diingat, dan membantu banyak soal lain, seperti hampir kembar.' },
      nearDouble: { s1: (a, b) => `${a} dan ${b} adalah angka berurutan, jadi ini hampir kembar.`, s2: sm => `Gandakan angka yang lebih kecil: ${sm} + ${sm} = ${2 * sm}.`, s3: (big, sm, d) => `${big} adalah satu lebih dari ${sm}, jadi tambah 1 lagi: ${d} + 1 = ${d + 1}.`, end: (a, b, s) => `Jadi ${a} + ${b} = ${s}.`, why: 'Kalau kamu hafal penjumlahan kembar, hampir kembar hanyalah kembar ditambah satu.' },
      compAdd: { s1: (b, ten) => `${b} sangat dekat dengan ${ten}, dan menambah ${ten} itu mudah!`, s2: (a, ten) => `Tambahkan ${ten} dulu: ${a} + ${ten} = ${a + ten}.`, minus: (x, s) => `Tapi kita menambah 1 terlalu banyak, jadi kurangi 1: ${x} − 1 = ${s}.`, plus: (x, s) => `Kita masih perlu menambah 1 lagi: ${x} + 1 = ${s}.`, end: (a, b, s) => `Jadi ${a} + ${b} = ${s}.`, why: 'Menambah satu puluhan penuh itu cepat. Lalu kamu tinggal memperbaikinya dengan 1. Trik ini berhasil untuk 9, 11, 19, dan 21.' },
      threeAdd: { s1: (a, b, c) => `${a} + ${b} + ${c}. Dengan tiga angka, cari dulu dua angka yang mudah dijumlahkan.`, ten: (x, y) => `${x} dan ${y} adalah teman 10! ${x} + ${y} = 10.`, double: (x, y, xy) => `${x} dan ${y} adalah kembar: ${x} + ${y} = ${xy}.`, start: (x, y, xy) => `Mulai dari dua angka pertama: ${x} + ${y} = ${xy}.`, last: (xy, z, s) => `Sekarang tambahkan angka terakhir: ${xy} + ${z} = ${s}.`, end: (a, b, c, s) => `Jadi ${a} + ${b} + ${c} = ${s}.`, why: 'Kamu boleh menjumlahkan dengan urutan apa saja. Menemukan pasangan yang hasilnya 10 dulu membuat sisanya mudah.' },
      threeLeft: { s1: (a, b, ab) => `Ayo hitung dari kiri ke kanan. Pertama: ${a} + ${b} = ${ab}.`, s2: (ab, c, s) => `Lalu tambahkan angka terakhir: ${ab} + ${c} = ${s}.`, end: (a, b, c, s) => `Jadi ${a} + ${b} + ${c} = ${s}.`, why: 'Menjumlahkan dua angka sekaligus selalu berhasil, urutan apa pun yang kamu pilih.' },
      bond100: { s1: a => `${a} + □ = 100. Seberapa jauh dari ${a} ke 100?`, toTen: (a, up, nt) => `Lompat dulu ke puluhan berikutnya: ${a} + ${up} = ${nt}.`, toHundred: (nt, j) => `Lalu lompat per puluhan sampai 100: ${nt} + ${j} = 100.`, add: (j1, j2, b) => `Jumlahkan lompatannya: ${j1} + ${j2} = ${b}.`, end: (a, b) => `Jadi ${a} + ${b} = 100. ${a} dan ${b} adalah teman 100!`, why: 'Teman 100 bekerja seperti teman 10. 30 + 70 = 100 karena 3 + 7 = 10.' },

/* ---------- speech ---------- */
let lastSaid = { text: '', tid: 'hoot' };
// Best voice first: Premium, then Enhanced/natural voices (any accent), then UK English or Danish.
// A grown-up can also pick one exact voice in "For grown-ups"; that choice wins while it is installed.
function voicesFor(lang) {
  try { return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(lang)); } catch (e) { return []; }
}
function voiceRank(v) {
  const s = `${v.name} ${v.voiceURI}`.toLowerCase();
  return (/premium/.test(s) ? 30 : /enhanced|neural|natural/.test(s) ? 20 : 0) + (/^(en-gb|da)/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
}
const rankedVoices = lang => voicesFor(lang).sort((a, b) => voiceRank(b) - voiceRank(a) || a.name.localeCompare(b.name));
/* The voice is a setting of this device (voices are installed per device), one per language,
   and the same voice reads for every teacher. It is remembered by its id and its name, so it is
   still found after a system update renames the id. */
const DEV_KEY = 'numberBuddies.device';
let DEV = {};
try { DEV = JSON.parse(localStorage.getItem(DEV_KEY) || '{}') || {}; } catch (e) {}
if (!DEV.voice) {
  // earlier versions kept the choice with the child
  DEV.voice = {};
  for (const k of Object.values(DB.kids)) for (const [l, uri] of Object.entries(k.voice || {})) if (uri && !DEV.voice[l]) DEV.voice[l] = { uri, name: '' };
}
const saveDev = () => { try { localStorage.setItem(DEV_KEY, JSON.stringify(DEV)); } catch (e) {} };
function chosenVoice(lang) {
  const c = DEV.voice && DEV.voice[lang]; if (!c) return null;
  const all = voicesFor(lang);
  return all.find(v => v.voiceURI === c.uri) || (c.name && all.find(v => v.name === c.name)) || (c.name && all.find(v => v.name.split(' (')[0] === c.name.split(' (')[0])) || null;
}
function voiceFor(lang) { return chosenVoice(lang) || rankedVoices(lang)[0] || null; }
let voicesReady = false;
try { voicesReady = speechSynthesis.getVoices().length > 0; speechSynthesis.onvoiceschanged = () => { voicesReady = true; fillVoicePicker(); }; } catch (e) {}
function fillVoicePicker() {
  const t = tr();
  for (const sel of document.querySelectorAll('.voice-sel')) {
    const lang = sel.dataset.lang, list = rankedVoices(lang), c = DEV.voice[lang], pickedV = chosenVoice(lang);
    sel.innerHTML = `<option value="">${t.voiceAuto}${list[0] ? ` (${esc(list[0].name)})` : ''}</option>` +
      list.map(v => `<option value="${esc(v.voiceURI)}"${pickedV && v.voiceURI === pickedV.voiceURI ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');
    const note = document.querySelector(`.voice-note[data-lang="${lang}"]`);
    if (note) note.textContent = !list.length ? t.voiceNoneFor(I18N[lang].langName) : c && !pickedV && c.name ? t.voiceMissing(c.name) : '';
  }
}
function toSpeech(t) {
  const w = tr().say || I18N.en.say;
  return t.replace(/<[^>]+>/g, ' ').replace(/&#39;|&apos;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/−/g, w.minus).replace(/\+/g, w.plus)
    .replace(/=/g, w.eq).replace(/□/g, w.blank)
    .replace(/×/g, w.times).replace(/÷/g, w.div)
    .replace(/_{2,}/g, w.gap)
    .replace(/\s·\s/g, w.times).replace(/\s:\s/g, w.div).replace(/\s\/\s/g, w.div)
    .replace(/\((H|T|O|E)\)/g, '');
}
function speak(text, tid, lang) {
  lastSaid = { text, tid };
  if (!store.sound) return;
  // iPad loads its voices a moment after the page; speaking before that would use the device's default voice
  if (!voicesReady) { try { if (speechSynthesis.getVoices().length) voicesReady = true; } catch (e) {} }
  if (!voicesReady) { const want = { text, tid, lang }; speak.waiting = want; setTimeout(() => { if (speak.waiting === want) { voicesReady = true; speak(text, tid, lang); } }, 700); return; }
  try {
    // iPad Safari drops an utterance queued right after cancel(), so wait a moment when something was playing
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speechSynthesis.cancel();
    const L = lang || curLang(), picked = chosenVoice(L), v = picked || voiceFor(L);
    const u = new SpeechSynthesisUtterance(toSpeech(text));
    u.lang = v ? v.lang : (I18N[L].voiceLang || 'en-GB'); if (v) u.voice = v;
    // a voice the grown-up chose keeps its own sound; otherwise each teacher gets a slightly different pitch
    u.rate = .9; u.pitch = picked ? 1 : TEACHERS[tid]?.pitch || 1;
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

function topbar() {
  const t = tr();
  return `<header class="topbar">
    <button class="brand" data-act="home" aria-label="${t.brand}"><span class="brand-mark"><b>+</b></span><span class="brand-name">${t.brand}</span></button>

    <span class="pill" aria-label="${t.starsAria(totalStars())}">${ICON.star(true)} ${totalStars()}</span>

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function confetti(n = 26) {
  if (reduced()) return;
  const fx = $('#fx'), colors = ['var(--add)', 'var(--sub)', 'var(--sun)', 'var(--mul)', 'var(--div)'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'conf';
    p.style.left = (42 + Math.random() * 16) + '%';
    p.style.setProperty('--dx', ((Math.random() * 2 - 1) * 42) + 'vw');
    p.style.setProperty('--dy', (-18 - Math.random() * 40) + 'vh');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.background = colors[i % colors.length]; p.style.animationDelay = (Math.random() * .15) + 's';
    fx.appendChild(p); setTimeout(() => p.remove(), 1800);
  }
}
function applyLang() { document.documentElement.lang = curLang(); document.title = tr().brand; }

const app = $('#app');
let screen = 'home', S = {};
function spellLangFor(name, params) {
  const id = params && params.id;
  let tp = null;
  if (name === 'topic') tp = TOPICS.find(t => t.id === id);
  else if (['lesson', 'practice', 'results'].includes(name) && id && id !== 'mixed') { if (String(id).startsWith('review-sp-')) return id.slice(10); tp = findLevel(id)?.topic; }
  return isSpellTopic(tp) ? tp.lang : null;
}
function show(name, params = {}) { hush(); if (!GROWNUP_SCREENS.includes(name)) gateUntil = 0; screen = name; S = params; forced = spellLangFor(name, params); applyLang(); SCREENS[name](params); window.scrollTo({ top: 0 }); }

  const t = tr(), info = roundInfo(r.id), l = info.level, tid = info.tid;
  const title = l ? `${topicTitle(l.topic)} · ${lvlText(l).title}` : info.title;

function qText(p) {
  if (p.sp) return p.w;
  const A = p.missing === 'a' ? '□' : p.a, B = p.missing === 'b' ? '□' : p.b;
  return `${A} ${opSym(p.op)} ${B}${p.c != null ? ` + ${p.c}` : ''}${p.missing ? ` = ${resOf(p)}` : ''}`;
}
const storyText = p => tr().stories[p.op][p.story](p.a, p.b);

/* ---------- step-by-step explainer ---------- */
let ST = null;
function mountStepper({ title, steps, why, tid, onDone, el, backToQ, problem }) {
  ST = { title, steps, why, tid, onDone, backToQ, problem, alt: 0, i: 0, el: el || $('#stepper') };
  renderStepper(false);
}
/* "I still don't understand": explain the same question another way, then another, then suggest a grown-up */
function otherWay(restart) {
  if (!ST || !ST.problem) return;
  const t = tr(), p = ST.problem, alts = altsFor(p);
  ST.alt = restart ? 0 : ST.alt + 1;
  ST.i = 0;
  if (ST.alt === 0) {
    const e = explain(p); ST.steps = e.steps; ST.why = e.why; ST.title = ST.title0 || ST.title;
  } else if (ST.alt > alts.length) {
    ST.steps = [{ say: t.noMoreWays, v: eq(qText(p)), end: true }]; ST.why = null; ST.title = ST.title0 || ST.title;
  } else {
    const e = explainWith(p, alts[ST.alt - 1]);
    ST.title0 = ST.title0 || ST.title; ST.title = t.otherWayTitle;
    ST.steps = [{ say: t.otherWayIntro[(ST.alt - 1) % t.otherWayIntro.length], v: eq(qText(p)) }, ...e.steps]; ST.why = e.why;
  }
  if (screen === 'practice') S.helped = true;
  renderStepper(true);
  ST.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
}
function renderStepper(talk = true) {
  if (!ST || !ST.el) return;
  const t = tr(), { steps, i, tid } = ST, s = steps[i], last = i === steps.length - 1;
  ST.el.innerHTML = `
    <div class="st-head"><span class="st-title">${ST.title}</span><span class="st-dots" aria-label="${i + 1} / ${steps.length}">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="st-say">${charWrap(tid, last ? 'joy' : 'happy', 'sm')}<p>${s.say}</p>${replayBtn()}</div>
    <div class="st-visual">${s.v}</div>
    ${last && ST.why ? `<div class="st-why"><b>${t.whyWorks}</b><p>${ST.why}</p></div>` : ''}
    <div class="st-nav">
      <button class="btn btn-soft btn-small" data-act="st-prev" ${i === 0 ? 'disabled' : ''}>${t.back}</button>
      ${!last ? `<button class="btn btn-small" data-act="st-next">${t.nextStep}</button>` : `<span class="st-end">
        ${ST.problem ? (s.end ? `<button class="btn btn-small btn-soft" data-act="first-way">${t.firstWayAgain}</button>` : `<button class="btn btn-small btn-soft" data-act="still">${t.stillStuck}</button>`) : ''}
        ${ST.backToQ ? `<button class="btn btn-small" data-act="back-to-q">${t.typeAnswer}</button>` : ''}</span>`}
    </div>`;
  lastSaid = { text: s.say, tid };
  if (talk) speak(s.say, tid);
  if (last && ST.onDone) ST.onDone();
}

/* ---------- practice ---------- */
// The question on screen: the round's current question, or a "try again" question for a yellow circle.
const cur = () => S.mode === 'redo' ? S.rp : S.list[S.i];
function dotsHtml() {
  const t = tr();

    const m = S.marks[k] || '', now = S.mode === 'redo' ? k === S.rk : k === S.i && !S.finished, st = m || (now ? 'cur' : '');
    const sign = m === 'ok' || m === 'fixed' ? '✓' : m === 'help' ? '↻' : '';
    return `<button class="pd ${m}${now ? ' cur' : ''}" data-act="dot" data-i="${k}"${m === 'help' ? '' : ' aria-disabled="true"'} aria-label="${t.dotLabel(k + 1, t.dotStates[st])}"><span aria-hidden="true">${sign}</span></button>`;
  }).join('');
}
function renderPractice(fresh) {

  <div class="practice${p.sp ? ' spelling' : ''}" style="${tcStyle(tid)}">
    <div class="pr-top">

    </div>

          <div class="bubble"><p class="bubble-who">${tName(tid)}</p><div class="say-row"><p id="pr-say">${greet}</p>${replayBtn()}</div></div>
        </section>
        <div class="qcard${redo ? ' redo' : ''}${p.sp ? ' spell' : ''}"><span class="q-label">${redo ? t.redoLabel(S.rk + 1) : t.questionN(S.i + 1, S.list.length)}</span>${p.sp ? spellCardTop(p) : p.story != null ? `<p class="story">${storyText(p)}</p>` : ''}<div class="q${p.sp ? ' q-spell' : ''}" id="q" aria-live="polite">${qHtml(p, S.done ? 'right' : '')}</div></div>
        <section class="explain" id="explain" hidden><div id="stepper" class="stepper"></div></section>
      </div>
      <div class="pr-right">
        ${p.sp ? (p.fmt === 'pick' ? '' : letterPad()) : `<div class="pad" id="pad">

          <button class="key key-sm" data-act="key" data-k="clear">${t.clear}</button>

          <button class="key key-sm" data-act="key" data-k="back" aria-label="${t.delLast}">⌫</button>
        </div>`}
        <div class="pr-actions">
          <button class="btn btn-soft" data-act="howto">${t.showHow}</button>
          <button class="btn" id="check-btn" data-act="check">${t.check}</button>

      </div>
    </div>
  </div>`;
  if (S.done) markDone();
  const ask = p.sp ? spellAsk(p) : p.story != null ? storyText(p) : t.askQ(qText(p), p.missing);
  if (fresh) speak(`${greet} ${ask}`, tid);
  lastSaid = { text: `${greet} ${ask}`, tid };
}
function qHtml(p, state = '') {
  if (p.sp) return spellQHtml(p, state);
  const box = `<span class="ans-box${S.input ? ' filled' : ''}${state ? ' ' + state : ''}" id="ans">${S.input || (S.done ? '' : '<i class="caret"></i>')}</span>`;
  if (p.story != null) return box;
  const op = `<span class="op">${opSym(p.op)}</span>`, A = p.missing === 'a' ? box : `<span>${p.a}</span>`, B = p.missing === 'b' ? box : `<span>${p.b}</span>`;
  const C = p.c != null ? `<span class="op">+</span><span>${p.c}</span>` : '';
  return `${A}${op}${B}${C}<span>=</span>${p.missing ? `<span>${resOf(p)}</span>` : box}`;
}

/* ---------- the learning path: every maths level in a sensible order ---------- */
const PATH_ALL = ['a1', 's1', 'a2', 'a3', 's2', 'a6', 'a4', 's3', 'a7', 's7', 'm1', 'm2', 'm3', 'd1', 'd2', 'a8', 's8', 'a9', 's6', 's4',

  'a14', 's14', 'a13', 's13', 'm9', 'd9', 'm10', 'd10', 'a15', 's15'];
// Times tables and sharing come at the very end of Year 3, so up to Year 3 (and "not sure")

const isAddSub = id => /^[as]\d/.test(id);

const tablesNeed = id => isAddSub(id) && !YEAR4_ADD_SUB.includes(id);

const ADD_SUB_COUNT = PATH_ALL.filter(tablesNeed).length;
const tablesOpen = (k = store) => (k.year || 0) >= 4;

const LEGACY_PATH = ['a1', 's1', 'a2', 'a6', 's2', 'a3', ...PATH_ALL.slice(6)];   // every path has the same 50 levels, only the order differs
// where the starting quiz begins for each school year (0 = not sure)
const YEAR_START_ID = { 0: 'a4', 1: 'a1', 2: 'a4', 3: 'a5', 4: 'm4', 5: 'm9', 6: 'm9' };
const yearStart = (k = store) => Math.max(0, kidPath(k).indexOf(YEAR_START_ID[k.year || 0] || 'a4') - 1);
/* The start of a child's path is kept as the first level they still need, so it stays right
   if a grown-up later changes the school year. Saves from before kept a position instead. */
function startIdx(k = store) {
  const p = kidPath(k);
  if (k.startId === '#end') return p.length;
  if (k.startId) { const i = p.indexOf(k.startId); return i < 0 ? 0 : i; }
  if (k.start > 0) { const id = LEGACY_PATH[k.start]; return id ? Math.max(0, p.indexOf(id)) : p.length; }

}

const PASS = 2;

  if (isSpellTopic(tp)) return !tp.custom && tp.levels.indexOf(l) < spellStart(tp, k);
  return k === store ? placedPast(l.id) : withKid(k, () => placedPast(l.id));
}

  const p = kidPath();

  const l = findLevel(id);

/* A question answered with help comes back the next day; got right first time it waits
   3 days, then 7, and then it is learnt. */
const DAY = 864e5;
const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const revKey = q => q.sp ? `sp:${q.lv}:${q.w}` : qKey(q);

}
const reviewGroup = r => r.q.sp ? 'review-sp-' + findLevel(r.q.lv).topic.lang : 'review';
const reviewDue = id => store.review.filter(r => r.due <= Date.now() && reviewValid(r) && reviewGroup(r) === id);
function reviewAdd(p) {
  if (!p || !p.lv) return;
  const k = revKey(p), r = store.review.find(x => x.k === k), due = startOfDay(Date.now()) + DAY;
  if (r) { r.box = 1; r.due = due; } else store.review.push({ k, q: plainQ(p), box: 1, due });
  if (store.review.length > 80) store.review.splice(0, store.review.length - 80);
}
function reviewResult(p, firstTry) {
  const k = revKey(p), r = store.review.find(x => x.k === k);
  if (!r) return;
  if (!firstTry) { r.box = 1; r.due = startOfDay(Date.now()) + DAY; return; }
  r.box++;
  if (r.box > 3) store.review = store.review.filter(x => x !== r);
  else r.due = startOfDay(Date.now()) + [0, 1, 3, 7][r.box] * DAY;

/* ---------- the family's own spelling lists ---------- */
const ALPHA = { en: 'abcdefghijklmnopqrstuvwxyz', da: 'abcdefghijklmnopqrstuvwxyzæøå', sv: 'abcdefghijklmnopqrstuvwxyzåäö', id: 'abcdefghijklmnopqrstuvwxyz' };
const okWord = (w, lang) => typeof w === 'string' && w.length >= 2 && w.length <= 20 && [...w.toLowerCase()].every(c => ALPHA[lang].includes(c) || c === "'") && /^[^']/.test(w);
const listVisible = L => !L.for || !L.for.length || L.for.includes(store.id);
function buildCustomTopics() {
  for (let i = TOPICS.length - 1; i >= 0; i--) if (TOPICS[i].custom) TOPICS.splice(i, 1);
  for (const L of DB.lists) {
    if (!SPELL_TEACHER[L.lang]) continue;
    const id = 'cl' + L.id;
    const words = L.words.filter(x => okWord(x.w, L.lang) && x.focus && x.w.includes(x.focus) && Array.isArray(x.wrong) && x.wrong.length >= 2)
      .map(x => ({ w: x.w, s: '', wrong: x.wrong.slice(0, 2), focus: x.focus, tip: '' }));
    if (!words.length) continue;
    const lvl = { id, custom: true, words, problems: words.map((wd, i) => spItem(wd, SPELL_FORMATS(i), id)) };
    lvl.examples = [spItem(words[0], 'type', id)];
    lvl.gen = r => spItem(RP(r, words), 'type', id);
    const tp = { id, kind: 'spell', custom: true, lang: L.lang, sign: 'Aa', teacher: SPELL_TEACHER[L.lang], name: L.name, list: L, levels: [lvl] };
    lvl.topic = tp; TOPICS.push(tp);
  }
}
const customLvlText = l => { const t = tr(); return { title: esc(l.topic.name), goal: t.clGoal(l.words.length), what: t.clWhat, why: t.clWhy }; };
const topicIntro = tp => tp.custom ? tr().clIntro(esc(tp.name)) : tr().topicIntro[tp.id];

  'list-new': () => { LE = null; show('listEdit', {}); },
  'list-edit': d => { LE = null; show('listEdit', { id: d.id }); },
  'list-play': d => { gateUntil = 0; show('topic', { id: 'cl' + d.id }); },
  'le-reroll': d => { readLE(); const x = LE.words[+d.i]; Object.assign(x, leEntry(x.w, LE.lang, (x.turn || 0) + 1, x.mine ? [x.fi, x.fn] : null)); $('#le-words').innerHTML = leWords(); },
  // tap the first tricky letter, then the last one (or the same letter again for just one)
  'le-tile': d => {
    readLE(); const i = +d.i, j = +d.j, x = LE.words[i];
    if (!lePick || lePick.i !== i) { lePick = { i, j }; Object.assign(x, leEntry(x.w, LE.lang, 0, [j, 1])); }
    else { const a = Math.min(lePick.j, j), b = Math.max(lePick.j, j); lePick = null; Object.assign(x, leEntry(x.w, LE.lang, 0, [a, b - a + 1])); }
    $('#le-words').innerHTML = leWords();
  },
  'le-rm': d => { readLE(); LE.words.splice(+d.i, 1); $('#le-words').innerHTML = leWords(); },
  'le-save': () => {
    const t = tr(); readLE();
    if (LE.words.length < 3) { $('#le-status').textContent = t.needWords; return; }
    const now = Date.now(), name = LE.name || t.listDefault(DB.lists.length + 1);
    const rec = { id: LE.id || newId(), name, lang: LE.lang, for: LE.for, words: LE.words.map(x => ({ w: x.w, wrong: x.wrong, focus: x.focus, turn: x.turn || 0, ...(x.mine ? { mine: true, fi: x.fi, fn: x.fn } : {}) })), updated: now };
    const i = DB.lists.findIndex(x => x.id === rec.id);
    if (i > -1) DB.lists[i] = { ...DB.lists[i], ...rec }; else DB.lists.push({ ...rec, created: now });
    buildCustomTopics(); save(); LE = null; show('parent', { tab: 'lists' }); toast(t.listSaved);
  },
  'le-del-ask': () => { const t = tr(); $('#le-del').innerHTML = `<span>${t.deleteListAsk}</span> <button class="btn btn-small" style="--tc:var(--oops)" data-act="le-del-yes">${t.removeYes}</button>`; },
  'le-del-yes': () => {
    const t = tr(), id = LE.id; DB.lists = DB.lists.filter(x => x.id !== id); DB.gone.push(id);
    buildCustomTopics(); save(); LE = null; show('parent', { tab: 'lists' }); toast(t.listDeleted);
  },
  'pin-forgot': () => show('gate', { next: S.next, mode: 'forgot' }),
  'pin-change': () => { pinFirst = null; show('gate', { next: { tab: 'settings' }, mode: 'create' }); },
  'acc-google': async () => { try { await fb.U.signInWithPopup(fb.auth, new fb.U.GoogleAuthProvider()); } catch (e) { accMsg(e); } },
  'acc-out': async () => { try { await fb.U.signOut(fb.auth); } catch (e) { accMsg(e); } },
  'acc-del-ask': () => { const t = tr(); $('#acc-del').innerHTML = `<span>${t.accDeleteAsk}</span><button class="btn btn-small" style="--tc:var(--oops)" data-act="acc-del-yes">${t.accDeleteYes}</button><button class="btn btn-small btn-soft" data-act="pa-tab" data-tab="account">${t.keep}</button>`; },
  'acc-del-yes': async () => {
    const t = tr();
    try {
      const ref = fb.F.doc(fb.db, 'families', fb.user.uid);
      cloud = null; await fb.F.deleteDoc(ref); await fb.user.delete(); accMsg(t.accDeleted);
    } catch (e) { accMsg(e && e.code === 'auth/requires-recent-login' ? t.accRelogin : e); }
  }
});
app.addEventListener('submit', async e => {
  const f = e.target, kind = f.dataset.form, t = tr();
  if (kind === 'ob-name') {
    const v = $('#ob-name').value.trim(); if (!v) return;
    store.name = v.slice(0, 20); save(); obNext('name');
  } else if (kind === 'pin') {
    const v = $('#pin-input').value.trim(), msg = $('#pin-msg'), { mode, next } = S;
    if (mode === 'forgot') { if (pinSum && Number(v) === pinSum[0] * pinSum[1]) { pinSum = null; gateUntil = Date.now() + 10 * 60e3; show('gate', { next, mode: 'create' }); } else msg.textContent = t.pinWrongSum; return; }
    if (!/^\d{4}$/.test(v)) { msg.textContent = t.pin4; return; }
    if (mode === 'enter') { if (pinHash(v) === DB.pin) { gateUntil = Date.now() + 10 * 60e3; show('parent', next); } else { msg.textContent = t.pinWrong; $('#pin-input').value = ''; } return; }
    if (mode === 'create') { pinFirst = v; show('gate', { next, mode: 'confirm' }); return; }
    if (mode === 'confirm') {
      if (v !== pinFirst) { pinFirst = null; show('gate', { next, mode: 'create' }); $('#pin-msg').textContent = t.pinMismatch; return; }
      DB.pin = pinHash(v); DB.pinAt = Date.now(); pinFirst = null; save(); gateUntil = Date.now() + 10 * 60e3; show('parent', next); toast(t.pinSaved);
    }
  } else if (kind === 'kid-edit') {
    const k = DB.kids[f.dataset.id]; if (!k) return;
    const fd = new FormData(f), sp = fd.getAll('sp');
    k.name = String(fd.get('name') || '').trim().slice(0, 20) || k.name; k.avatar = fd.get('avatar') || k.avatar; k.year = +fd.get('year') || 0;
    k.lang = LANG_IDS.includes(fd.get('lang')) ? fd.get('lang') : k.lang; k.spLangs = sp.length && sp.length < 4 ? sp : null;
    save(); applyLang(); show('parent', { tab: 'kids' }); toast(t.saved);
  } else if (kind === 'le-type') {
    readLE();
    const txt = $('#le-text').value, skipped = leAdd(txt.split(/[\s,;]+/));
    $('#le-text').value = '';
    $('#le-status').textContent = skipped.length ? t.badWords(skipped.join(', ')) : '';
  } else if (kind === 'acc-email') {
    const fd = new FormData(f), email = String(fd.get('email') || '').trim(), pw = String(fd.get('password') || ''), how = e.submitter && e.submitter.value;
    try {
      if (how === 'reset') { if (!email) return accMsg(t.accErr['auth/invalid-email']); await fb.U.sendPasswordResetEmail(fb.auth, email); accMsg(t.accResetSent); }
      else if (how === 'new') await fb.U.createUserWithEmailAndPassword(fb.auth, email, pw);
      else await fb.U.signInWithEmailAndPassword(fb.auth, email, pw);
    } catch (err) { accMsg(err); }
  }
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'le-lang') {
    readLE(); LE.lang = el.value;
    const keep = LE.words.filter(x => okWord(x.w, LE.lang)), dropped = LE.words.length - keep.length;
    LE.words = keep.map(x => leEntry(x.w, LE.lang, x.turn || 0));
    $('#le-words').innerHTML = leWords(); $('#le-status').textContent = dropped ? tr().badWords(String(dropped)) : '';
  } else if (el.classList.contains('w-in')) {
    const t = tr(), i = +el.dataset.i, w = el.value.trim().replace(/[’`]/g, "'");
    if (!w) { LE.words.splice(i, 1); }
    else if (!okWord(w, LE.lang)) { $('#le-status').textContent = t.badWords(w); el.value = LE.words[i].w; return; }
    else LE.words[i] = leEntry(w, LE.lang);
    $('#le-words').innerHTML = leWords();
  } else if (el.id === 'photo-input' && el.files && el.files[0]) {
    const t = tr(), st = $('#le-status'), file = el.files[0];
    readLE();
    st.textContent = t.photoLoading;
    try {
      const text = await readPhoto(file, LE.lang, p => { if (st) st.textContent = p < 0 ? t.photoLoading : t.photoReading(p); });
      const words = extractWords(text, LE.lang);
      if (!words.length) { st.textContent = t.photoNone; return; }
      const before = LE.words.length; leAdd(words);
      st.textContent = t.photoFound(LE.words.length - before);
    } catch (err) { st.textContent = t.photoFail; }
    el.value = '';
  }
});

function spellRound(l) {
  // ten questions; a short list of the family's own words goes round twice so every word is also typed
  const n = Math.min(10, l.words.length * 2);
  let pool = shuffle(l.words);
  while (pool.length < n) { const more = shuffle(l.words); if (more.length > 1 && more[0] === pool[pool.length - 1]) more.push(more.shift()); pool = pool.concat(more); }
  return pool.slice(0, n).map((wd, i) => { const k = i * 10 / n; return spItem(wd, k < 3 ? 'pick' : k < 6 ? 'fill' : 'type', l.id); });
}

buildCustomTopics();
applyLang();
show(Object.values(DB.kids).filter(k => k.onboarded).length > 1 ? 'kids' : 'home');
connectCloud().then(initFirebase);
