function qText(p) {
  const A = p.missing === 'a' ? '□' : p.a, B = p.missing === 'b' ? '□' : p.b;
  return `${A} ${opSym(p.op)} ${B}${p.c != null ? ` + ${p.c}` : ''}${p.missing ? ` = ${resOf(p)}` : ''}`;
}
const storyText = p => tr().stories[p.op][p.story](p.a, p.b);

/* ---------- step-by-step explainer ---------- */
let ST = null;
function mountStepper({ title, steps, why, tid, onDone, el, backToQ, problem }) {
  ST = { title, steps, why, tid, onDone, backToQ, problem, alt: 0, i: 0, el: el || $('#stepper') };
  renderStepper(false);
}
/* "I still don't understand": explain the same question another way, then another, then suggest a grown-up */
function otherWay(restart) {
  if (!ST || !ST.problem) return;
  const t = tr(), p = ST.problem, alts = altsFor(p);
  ST.alt = restart ? 0 : ST.alt + 1;
  ST.i = 0;
  if (ST.alt === 0) {
    const e = explain(p); ST.steps = e.steps; ST.why = e.why; ST.title = ST.title0 || ST.title;
  } else if (ST.alt > alts.length) {
    ST.steps = [{ say: t.noMoreWays, v: eq(qText(p)), end: true }]; ST.why = null;
  } else {
    const e = explainWith(p, alts[ST.alt - 1]);
    ST.title0 = ST.title0 || ST.title; ST.title = t.otherWayTitle;
    ST.steps = [{ say: t.otherWayIntro[(ST.alt - 1) % t.otherWayIntro.length], v: eq(qText(p)) }, ...e.steps]; ST.why = e.why;
  }
  if (screen === 'practice') S.helped = true;
  renderStepper(true);
  ST.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
}
function renderStepper(talk = true) {
  if (!ST || !ST.el) return;
  const t = tr(), { steps, i, tid } = ST, s = steps[i], last = i === steps.length - 1;
  ST.el.innerHTML = `
    <div class="st-head"><span class="st-title">${ST.title}</span><span class="st-dots" aria-label="${i + 1} / ${steps.length}">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="st-say">${charWrap(tid, last ? 'joy' : 'happy', 'sm')}<p>${s.say}</p>${replayBtn()}</div>
    <div class="st-visual">${s.v}</div>
    ${last && ST.why ? `<div class="st-why"><b>${t.whyWorks}</b><p>${ST.why}</p></div>` : ''}
    <div class="st-nav">
      <button class="btn btn-soft btn-small" data-act="st-prev" ${i === 0 ? 'disabled' : ''}>${t.back}</button>
      ${!last ? `<button class="btn btn-small" data-act="st-next">${t.nextStep}</button>` : `<span class="st-end">
        ${ST.problem ? (s.end ? `<button class="btn btn-small btn-soft" data-act="first-way">${t.firstWayAgain}</button>` : `<button class="btn btn-small btn-soft" data-act="still">${t.stillStuck}</button>`) : ''}
        ${ST.backToQ ? `<button class="btn btn-small" data-act="back-to-q">${t.typeAnswer}</button>` : ''}</span>`}
    </div>`;
  lastSaid = { text: s.say, tid };
  if (talk) speak(s.say, tid);
  if (last && ST.onDone) ST.onDone();
}

/* ---------- practice ---------- */
// The question on screen: the round's current question, or a "try again" question for a yellow circle.
const cur = () => S.mode === 'redo' ? S.rp : S.list[S.i];
function dotsHtml() {
  const t = tr();
  return S.list.map((_, k) => {
    const m = S.marks[k] || '', now = S.mode === 'redo' ? k === S.rk : k === S.i && !S.finished, st = m || (now ? 'cur' : '');
    return `<button class="pd ${m}${now ? ' cur' : ''}" data-act="dot" data-i="${k}"${m === 'help' ? '' : ' aria-disabled="true"'} aria-label="${t.dotLabel(k + 1, t.dotStates[st])}"></button>`;
  }).join('');
}
function renderPractice(fresh) {
  const t = tr(), p = cur(), tid = teacherFor(p), redo = S.mode === 'redo';
  if (fresh) { S.input = ''; S.tries = 0; S.helped = false; S.done = false; }
  const title = S.id === 'mixed' ? t.mixedTitle : lvlText(findLevel(S.id)).title;
  const greet = redo ? t.redoLabel(S.rk + 1) : S.i === 0 ? t.greetFirst(store.name ? esc(store.name) : '') : pick(t.greetNext);
  app.innerHTML = `${topbar()}
  <div class="practice" style="${tcStyle(tid)}">
    <div class="pr-top">
      <button class="btn-link" data-act="${S.id === 'mixed' ? 'home' : 'topic'}" data-id="${S.id === 'mixed' ? '' : findLevel(S.id).topic.id}">${t.stop}</button>
      <b style="font-family:var(--font-display)">${title}</b>
      ${redo || S.finished ? '' : `<button class="btn-link" data-act="restart-ask">${t.startOver}</button>`}
      <div class="pdots" role="group" aria-label="${t.questionN(S.i + 1, S.list.length)}">${dotsHtml()}</div>
    </div>
    <div class="confirm-row" id="restart-row" hidden></div>
    <div class="pr-grid">
      <div class="pr-left">
        <section class="redo-card" id="redo-card" hidden></section>
        <section class="talk" id="pr-talk">
          ${charWrap(tid, S.done ? 'joy' : 'happy', 'md')}
          <div class="bubble"><p class="bubble-who">${tName(tid)}</p><div class="say-row"><p id="pr-say">${greet}</p>${replayBtn()}</div></div>
        </section>
        <div class="qcard${redo ? ' redo' : ''}"><span class="q-label">${redo ? t.redoLabel(S.rk + 1) : t.questionN(S.i + 1, S.list.length)}</span>${p.story != null ? `<p class="story">${storyText(p)}</p>` : ''}<div class="q" id="q" aria-live="polite">${qHtml(p, S.done ? 'right' : '')}</div></div>
        <section class="explain" id="explain" hidden><div id="stepper" class="stepper"></div></section>
      </div>
      <div class="pr-right">
        <div class="pad" id="pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-act="key" data-k="${n}">${n}</button>`).join('')}
          <button class="key key-sm" data-act="key" data-k="clear">${t.clear}</button>
          <button class="key" data-act="key" data-k="0">0</button>
          <button class="key key-sm" data-act="key" data-k="back" aria-label="${t.delLast}">⌫</button>
        </div>
        <div class="pr-actions">
          <button class="btn btn-soft" data-act="howto">${t.showHow}</button>
          <button class="btn" id="check-btn" data-act="check">${t.check}</button>
        </div>
      </div>
    </div>
  </div>`;
  if (S.done) markDone();
  const ask = p.story != null ? storyText(p) : t.askQ(qText(p), p.missing);
  if (fresh) speak(`${greet} ${ask}`, tid);
  lastSaid = { text: `${greet} ${ask}`, tid };
}
function qHtml(p, state = '') {
  const box = `<span class="ans-box${S.input ? ' filled' : ''}${state ? ' ' + state : ''}" id="ans">${S.input || (S.done ? '' : '<i class="caret"></i>')}</span>`;
  if (p.story != null) return box;
  const op = `<span class="op">${opSym(p.op)}</span>`, A = p.missing === 'a' ? box : `<span>${p.a}</span>`, B = p.missing === 'b' ? box : `<span>${p.b}</span>`;
  const C = p.c != null ? `<span class="op">+</span><span>${p.c}</span>` : '';
  return `${A}${op}${B}${C}<span>=</span>${p.missing ? `<span>${resOf(p)}</span>` : box}`;
}
function updateQ(state) { $('#q').innerHTML = qHtml(cur(), state); }
function teacherSay(text, mood) {
  const tid = teacherFor(cur());
  $('#pr-say').innerHTML = text; setMood($('#pr-talk'), mood); speak(text, tid);
  if (mood === 'joy') setTimeout(() => { const el = $('#pr-talk'); if (el) setMood(el, 'happy'); }, 1600);
}
function markDone() {
  const t = tr(), btn = $('#check-btn');
  btn.textContent = S.mode === 'redo' ? (S.fromResults ? t.redoBackResults : t.redoBack) : S.i === S.list.length - 1 ? t.seeStars : t.nextQ;
  btn.style.setProperty('--tc', 'var(--good)');
}
function pressKey(k) {
  if (S.done) return;
  if (k === 'clear') S.input = '';
  else if (k === 'back') S.input = S.input.slice(0, -1);
  else if (S.input.length < 4) S.input = (S.input === '0' ? '' : S.input) + k;
  updateQ();
}
/* ---------- unfinished rounds & stars ---------- */
const starsFor = first => first >= 9 ? 3 : first >= 7 ? 2 : 1;
const plainQ = p => { const o = { a: p.a, b: p.b, op: p.op }; for (const k of ['c', 'missing', 'story', 's', 'lv']) if (p[k] != null) o[k] = p[k]; return o; };
function savedRound() {
  const r = store.round;
  if (!r || !Array.isArray(r.list) || !r.list.length || !(r.i > 0) || r.i >= r.list.length) return null;
  if (r.id !== 'mixed' && !findLevel(r.id)) return null;
  return r;
}
function saveRound() {
  if (S.finished) return;
  const next = S.done && S.mode !== 'redo' ? S.i + 1 : S.i;
  if (next >= S.list.length) return;
  store.round = { id: S.id, list: S.list.map(plainQ), i: next, first: S.first, marks: S.marks.slice(0, next) };
  save();
}
function finishRound() {
  S.finished = true;
  const was = lockedNow();
  recordStars();
  store.round = null;
  save();
  S.unlocked = was && !lockedNow();
}
function recordStars() {
  const n = starsFor(S.first);
  if (S.id !== 'mixed' && n > (store.best[S.id] || 0)) { store.best[S.id] = n; S.improved = true; }
}
const lockedNow = () => TOPICS.some(tp => lockInfo(tp));
function refreshAfterSync(prevLang) {
  if (store.lang !== prevLang) { const l = store.lang; store.lang = prevLang; switchLang(l); return; }
  if (screen === 'home' || screen === 'topic') SCREENS[screen](S);
  else { const pill = $('.pill'); if (pill) pill.innerHTML = `${ICON.star(true)} ${totalStars()}`; }
}

function check() {
  if (S.done) return S.mode === 'redo' ? exitRedo() : nextQ();
  const t = tr(), p = cur();
  if (S.input === '') { teacherSay(t.typeFirst, 'think'); return; }
  if (Number(S.input) === answerOf(p)) {
    S.done = true;
    const firstTry = S.tries === 0 && !S.helped;
    updateQ('right');
    confetti(firstTry ? 28 : 14);
    if (S.mode === 'redo') {
      if (firstTry) { S.marks[S.rk] = 'fixed'; S.first++; }
      teacherSay(firstTry ? pick(t.fixedPraise) : pick(t.praiseHelp), 'joy');
      if (S.finished) { recordStars(); save(); } else saveRound();
    } else {
      if (firstTry) S.first++;
      S.marks[S.i] = firstTry ? 'ok' : 'help';
      const nm = store.name && Math.random() < .35 ? `, ${esc(store.name)}` : '';
      teacherSay(firstTry ? `${pick(t.praise(nm))} ${fullEq(p)}.` : pick(t.praiseHelp), 'joy');
      if (S.i === S.list.length - 1) finishRound(); else saveRound();
    }
    markDone();
    $('.pdots').innerHTML = dotsHtml();
  } else {
    S.tries++;
    updateQ('wrong');
    if (S.tries === 1) teacherSay(pick(t.retry) + t.orShow, 'think');
    else { teacherSay(t.together, 'think'); openHowTo(); }
    const bad = S.input;
    setTimeout(() => { if (!S.done && S.input === bad && $('#q')) { S.input = ''; updateQ(); } }, 900);
  }
}
function openHowTo(keepStep) {
  const p = cur(), e = explain(p), box = $('#explain');
  S.helped = true;
  box.hidden = false;
  mountStepper({ title: tr().howTitle(p.story != null ? qText({ ...p, story: null }) : qText(p)), steps: e.steps, why: e.why, tid: teacherFor(p), el: $('#stepper'), onDone: null, backToQ: true, problem: p });
  if (keepStep != null) { ST.i = Math.min(keepStep, e.steps.length - 1); renderStepper(false); return; }
  renderStepper(true);
  box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
}
function nextQ() {
  if (S.i >= S.list.length - 1) { show('results', S); return; }
  S.i++; renderPractice(true);
  window.scrollTo({ top: 0 });
}

/* ---------- yellow circles: try a question like it again ---------- */
function askRedo(k) {
  const t = tr(), card = $('#redo-card'), p = S.list[k];
  if (!card) return;
  card.hidden = false;
  card.innerHTML = `<p>${t.redoText(`<b>${p.story != null ? storyText(p) + ' ' : ''}${fullEq(p)}</b>`)}</p>
    <div class="confirm-row"><button class="btn btn-small" data-act="redo-go" data-i="${k}">${t.redoBtn}</button><button class="btn btn-small btn-soft" data-act="redo-no">${t.redoNo}</button></div>`;
  card.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' });
  speak(card.querySelector('p').textContent, teacherFor(p));
}
function enterRedo(k) {
  S.saved = { input: S.input, tries: S.tries, helped: S.helped, done: S.done };
  S.mode = 'redo'; S.rk = k; S.rp = similarTo(S.list[k]);
  screen = 'practice';
  renderPractice(true);
  window.scrollTo({ top: 0 });
}
function exitRedo() {
  Object.assign(S, S.saved || {}); S.mode = null; S.rp = null;
  if (S.fromResults) { S.fromResults = false; S.quiet = true; show('results', S); return; }
  renderPractice(false);
  window.scrollTo({ top: 0 });
}

/* ---------- switching language keeps your place ---------- */
function switchLang(l) {
  if (l === store.lang) return;
  store.lang = l; save(); applyLang(); hush();
  const step = ST && ST.el && document.contains(ST.el) ? ST.i : null;
  if (screen === 'practice') {
    const open = !$('#explain').hidden;
    renderPractice(false);
    if (open) openHowTo(step);
  } else if (screen === 'lesson') SCREENS.lesson({ ...S, keepStep: step || 0 });
  else if (screen === 'results') { S.quiet = true; SCREENS.results(); }
  else SCREENS[screen](S);
}

/* ---------- events ---------- */
const ACTIONS = {
  home: () => show('home'),
  topic: d => { const tp = TOPICS.find(x => x.id === d.id); if (lockInfo(tp)) return ACTIONS.locked(d); show('topic', { id: d.id }); },
  lesson: d => show('lesson', { id: d.id }),
  practice: d => show('practice', { id: d.id }),
  soon: d => { const tp = TOPICS.find(x => x.id === d.id); toast(tr().soonToast(tName(tp.teacher), topicTitle(tp))); },
  lang: d => switchLang(d.l),
  sound: () => {
    const t = tr(); store.sound = !store.sound; save(); if (!store.sound) hush();
    const b = $('[data-act="sound"]'); b.innerHTML = ICON.sound(store.sound); b.setAttribute('aria-pressed', store.sound); b.setAttribute('aria-label', store.sound ? t.voiceOffLabel : t.voiceOnLabel);
    if (store.sound) speak(t.voiceOn, 'hoot');
  },
  replay: (d, b) => {
    const p = b.closest('.say-row, .st-say')?.querySelector('p');
    const s = store.sound; store.sound = true; speak(p ? p.textContent : lastSaid.text, lastSaid.tid); store.sound = s;
  },
  'back-to-q': () => { $('#q')?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); },
  'st-next': () => { if (ST.i < ST.steps.length - 1) { ST.i++; renderStepper(); } },
  'st-prev': () => { if (ST.i > 0) { ST.i--; renderStepper(); } },
  key: d => pressKey(d.k),
  check: () => check(),
  howto: () => openHowTo(),
  'reset-ask': () => { const t = tr(); $('#reset-row').innerHTML = `<span>${t.resetAsk}</span><button class="btn btn-small" style="--tc:var(--oops)" data-act="reset-yes">${t.resetYes}</button><button class="btn btn-small btn-soft" data-act="reset-no">${t.resetNo}</button>`; },
  'reset-no': () => show('home'),
  locked: d => { const tp = TOPICS.find(x => x.id === d.id); toast(tr().lockedToast(tName(tp.teacher))); },
  still: () => otherWay(false),
  'first-way': () => otherWay(true),
  dot: d => {
    const k = +d.i, m = S.marks && S.marks[k];
    if (S.mode === 'redo') return;
    if (m === 'help') askRedo(k);
    else if (m === 'ok' || m === 'fixed') toast(tr().dotOk);
  },
  'redo-go': d => { if (screen === 'results') S.fromResults = true; enterRedo(+d.i); },
  'redo-no': () => { const c = $('#redo-card'); if (c) c.hidden = true; },
  'restart-ask': () => { const t = tr(), r = $('#restart-row'); r.hidden = false; r.innerHTML = `<span>${t.startOverAsk}</span><button class="btn btn-small" data-act="restart-yes">${t.startOverYes}</button><button class="btn btn-small btn-soft" data-act="restart-no">${t.startOverNo}</button>`; },
  'restart-no': () => { const r = $('#restart-row'); r.hidden = true; r.innerHTML = ''; },
  'restart-yes': () => { store.round = null; save(); show('practice', { id: S.id, fresh: true }); },
  'voice-test': () => { const s = store.sound; store.sound = true; speak(tr().voiceSample, 'hoot'); store.sound = s; },
  'reset-yes': () => { store = { name: '', best: {}, sound: store.sound, lang: store.lang, round: null, resetAt: Date.now() }; save(); show('home'); toast(tr().resetDone); }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act]; if (fn) fn(b.dataset, b);
});
app.addEventListener('change', e => {
  if (e.target.id === 'unlock-all') { store.unlockAll = e.target.checked; save(); const g = $('.grownups'); show('home'); const g2 = $('.grownups'); if (g && g2) g2.open = true; return; }
  if (e.target.id !== 'voice-select') return;
  store.voice = { ...(store.voice || {}), [store.lang]: e.target.value || null }; save();
  const s = store.sound; store.sound = true; speak(tr().voiceSample, 'hoot'); store.sound = s;
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'name') {
    const v = $('#name-input').value.trim(); if (!v) return;
    store.name = v.slice(0, 20); save(); show('home');
    speak(tr().helloSpoken(store.name), 'hoot');
  }
});
document.addEventListener('keydown', e => {
  if (screen !== 'practice' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) { pressKey(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { pressKey('back'); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const t = e.target;
    if (t !== document.body && t !== document && !t.classList?.contains('key') && t.id !== 'check-btn') return;
    check(); e.preventDefault();
  }
});

applyLang();
show('home');
connectCloud();
</script>

</body>
