<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Number Buddies">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>Number Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column (max 980px) on a sky backdrop; each screen swaps inside #app. */
:root{
  --sky:#DCEFFF; --sky-deep:#C4E2FB; --cloud:#F4FAFF;
  --card:#FFFFFF; --card-2:#EEF6FF;
  --ink:#1F2D47; --ink-soft:#56688A; --line:#C3D8EE;
  --add:#E8701F; --add-soft:#FFE6D1;
  --sub:#D2407F; --sub-soft:#FBDDEB;
  --mul:#118F84; --mul-soft:#D2F3EF;
  --div:#4F5FE0; --div-soft:#E0E3FD;
  --sun:#FFB400; --good:#1C9150; --good-soft:#D7F5E3; --oops:#D93A3F; --oops-soft:#FDE1E1;
  --dot-a:#F07C2A; --dot-b:#2D8CE0;
  --shadow:0 5px 0 rgba(31,45,71,.07), 0 14px 30px rgba(31,45,71,.10);
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#101A31; --sky-deep:#0A1224; --cloud:#16233F;
    --card:#1C2948; --card-2:#24345A;
    --ink:#EEF3FF; --ink-soft:#A8B7D6; --line:#344A75;
    --add:#FF9B52; --add-soft:#47301F; --sub:#F06AA8; --sub-soft:#47223A;
    --mul:#3CC9BC; --mul-soft:#173F3D; --div:#8C98FF; --div-soft:#262D5C;
    --sun:#FFC83D; --good:#45C97C; --good-soft:#173E2A; --oops:#FF6B6F; --oops-soft:#4A1F24;
    --dot-a:#FF9B52; --dot-b:#5CB0FF;
    --shadow:0 5px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.30);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#101A31; --sky-deep:#0A1224; --cloud:#16233F;
  --card:#1C2948; --card-2:#24345A;
  --ink:#EEF3FF; --ink-soft:#A8B7D6; --line:#344A75;
  --add:#FF9B52; --add-soft:#47301F; --sub:#F06AA8; --sub-soft:#47223A;
  --mul:#3CC9BC; --mul-soft:#173F3D; --div:#8C98FF; --div-soft:#262D5C;
  --sun:#FFC83D; --good:#45C97C; --good-soft:#173E2A; --oops:#FF6B6F; --oops-soft:#4A1F24;
  --dot-a:#FF9B52; --dot-b:#5CB0FF;
  --shadow:0 5px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.30);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background-color:var(--sky);
  background-image:
    radial-gradient(ellipse 140px 46px at 8% 90px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 90px 40px at 14% 70px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 160px 50px at 92% 210px, var(--cloud) 98%, transparent 100%),
    radial-gradient(ellipse 90px 44px at 86% 190px, var(--cloud) 98%, transparent 100%),
    linear-gradient(var(--sky), var(--sky-deep));
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-body); font-size:18px; line-height:1.5;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--div);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.2px}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--add);color:#fff;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transform:rotate(-6deg)}
.brand-mark b{transform:rotate(6deg)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--font-display);font-weight:600;box-shadow:var(--shadow)}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow)}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.lang{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.lang button{border:0;background:none;border-radius:999px;padding:0 10px;height:38px;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-soft);letter-spacing:.5px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.star{width:22px;height:22px;fill:var(--line)}
.star.on{fill:var(--sun)}

/* characters */
.cw{flex:none;display:block}
.cw svg{display:block;width:100%;height:auto;overflow:visible}
.cw-lg{width:min(190px,40vw)} .cw-md{width:min(140px,30vw)} .cw-sm{width:84px}
.cw .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.char .eye-joy,.char .mouth-joy{display:none}
.char.mood-joy .eye-open,.char.mood-joy .mouth-calm{display:none}
.char.mood-joy .eye-joy,.char.mood-joy .mouth-joy{display:inline}
.char .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.char .pupil{transition:transform .35s ease}
.char.mood-think .pupil{transform:translate(4px,-5px)}
.char.mood-joy .bob{animation:hop .55s ease-in-out 2}
.char .glow{animation:glow 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.01,.99)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes glow{50%{opacity:.55}}

/* speech bubble */
.talk{display:flex;align-items:flex-end;gap:14px}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:28px;border:12px solid transparent;border-right-color:var(--card);border-left:0}
.bubble-who{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--tc,var(--add))}
.bubble h1{font-size:clamp(30px,5vw,44px)}
.bubble h2{font-size:clamp(24px,4vw,32px)}
.say-row{display:flex;align-items:flex-start;gap:10px}
.say-row p{flex:1;min-width:0}
.replay{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--card-2);display:grid;place-items:center}
.replay svg{width:18px;height:18px;fill:currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:14px 26px;font-family:var(--font-display);font-weight:600;font-size:20px;background:var(--tc,var(--add));color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-big{font-size:24px;padding:16px 34px}
.btn-small{font-size:17px;padding:10px 18px;border-radius:14px}
.btn-soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn-link{background:none;border:0;padding:6px 4px;font-family:var(--font-display);font-weight:600;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px}

/* home */
.hero{display:flex;align-items:flex-end;gap:16px}
.hero-cast{display:flex;align-items:flex-end;gap:0}
.hero-cast .cw:last-child{margin-left:-26px}
.name-form{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.name-form label{font-weight:700}
.name-form .row{display:flex;gap:8px;flex-wrap:wrap}
.name-form input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card-2);color:var(--ink)}
.section-title{font-size:22px;color:var(--ink-soft);font-weight:600}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.topic{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:0;background:var(--card);border-radius:28px;padding:16px 18px 20px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
@media (hover:hover){.topic:hover{transform:translateY(-3px)}}
.topic::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:var(--tc)}
.topic-art{flex:none;width:104px;padding:10px;border-radius:24px;background:var(--tc-soft)}
.topic-art svg{display:block;width:100%;height:auto}
.topic-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.topic-title{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.topic-teacher{color:var(--ink-soft);font-size:16px}
.topic-meta{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--tc);margin-top:6px}
.topic-sign{position:absolute;right:14px;top:6px;font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1;color:var(--tc);opacity:.22}
.topic.soon{cursor:default}
.topic.soon:hover{transform:none}
.topic.soon .topic-art{filter:saturate(.55)}
.lock{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--ink-soft);font-family:var(--font-display);font-weight:600;font-size:14px}
.mixed{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border-radius:28px;padding:18px 22px;box-shadow:var(--shadow)}
.resume{outline:4px solid var(--tc);outline-offset:-4px}
.mixed-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.mixed-text h3{font-size:24px}
.mixed-text p{color:var(--ink-soft)}
.grownups{background:var(--card-2);border-radius:20px;padding:6px 20px;color:var(--ink-soft);font-size:16px}
.grownups summary{font-family:var(--font-display);font-weight:600;font-size:17px;padding:10px 0;cursor:pointer;color:var(--ink)}
.grownups-body{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;max-width:68ch}
.confirm-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.voice-row{display:flex;flex-direction:column;gap:6px}
.voice-row label{font-weight:700;color:var(--ink)}
.voice-row .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voice-row select{flex:1;min-width:0;max-width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}

/* topic levels */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-soft);font-family:var(--font-display);font-weight:600}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:lvl}
.level{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.lvl-num{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--tc-soft);color:var(--tc);font-family:var(--font-display);font-weight:700;font-size:26px}
.level.done .lvl-num{background:var(--tc);color:#fff}
.lvl-text{flex:1;min-width:160px;display:flex;flex-direction:column}
.lvl-text b{font-family:var(--font-display);font-weight:600;font-size:22px}
.lvl-text span{color:var(--ink-soft);font-size:16px}
.lvl-stars{display:flex;gap:2px}
.lvl-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.tag{display:inline-block;align-self:flex-start;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--sun);color:#3A2A00;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase}

/* lesson */
.why-card{background:var(--tc-soft);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.why-card h3{font-size:18px;color:var(--tc);text-transform:uppercase;letter-spacing:.8px}
.lesson-go{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.lesson-go.ready .btn-big{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* stepper (worked explanation) */
.stepper{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.st-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-title{font-family:var(--font-display);font-weight:700;font-size:22px;flex:1;min-width:0}
.st-dots{display:flex;gap:6px}
.st-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.st-dots i.on{background:var(--tc)}
.st-say{display:flex;gap:12px;align-items:flex-start;background:var(--card-2);border-radius:20px;padding:12px 14px;font-size:20px}
.st-say .cw-sm{width:64px}
.st-say p{flex:1;min-width:0;align-self:center}
.st-visual{display:flex;justify-content:center;align-items:center;min-height:120px;overflow-x:auto;padding:6px 0}
.st-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st-why{border-top:3px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.st-why b{font-family:var(--font-display);color:var(--tc)}

/* visuals */
.frames{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:4px;padding:6px;border-radius:14px;background:var(--card);border:3px solid var(--line)}
.cell{display:grid;place-items:center;border-radius:8px;background:var(--card-2)}
.dot{width:32px;height:32px;border-radius:50%;display:block;position:relative;box-shadow:inset -3px -4px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.35)}
.dot-a{background:var(--dot-a)}
.dot-b{background:var(--dot-b);animation:pop .4s ease-out backwards}
.dot-e{background:none;box-shadow:none;border:3px dashed var(--dot-b)}
.dot-x{background:var(--dot-a);opacity:.35}
.dot-x::before,.dot-x::after{content:"";position:absolute;left:50%;top:-4px;width:5px;height:40px;margin-left:-2.5px;background:var(--oops);border-radius:3px;transform:rotate(45deg)}
.dot-x::after{transform:rotate(-45deg)}
@keyframes pop{from{transform:scale(0)}}
.nl{width:100%;max-width:660px;height:auto;display:block}
.nl-axis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.nl-tick{stroke:var(--ink);stroke-width:2}
.nl-pt{fill:var(--ink)}
.nl text{font-family:var(--font-display);text-anchor:middle}
.nl-num{fill:var(--ink-soft);font-size:17px;font-weight:500}
.nl-mark{fill:var(--ink);font-size:22px;font-weight:700}
.nl-hop{fill:none;stroke-width:4;stroke-linecap:round}
.nl-hop.nl-add{stroke:var(--add)} .nl-hop.nl-sub{stroke:var(--sub)}
.nl-head.nl-add{fill:var(--add)} .nl-head.nl-sub{fill:var(--sub)}
.nl-lab{font-size:20px;font-weight:700}
.nl-lab.nl-add{fill:var(--add)} .nl-lab.nl-sub{fill:var(--sub)}
.vis-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.vis-op{font-family:var(--font-display);font-weight:700;font-size:40px;color:var(--ink-soft)}
.vis-stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.blocks{display:flex;flex-direction:column;align-items:center;gap:6px}
.b-set{display:flex;align-items:flex-end;gap:5px;min-height:100px}
.b-rod{display:block;width:12px;height:100px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--bc) 0 9px,rgba(0,0,0,.25) 9px 10px);box-shadow:inset -2px 0 0 rgba(0,0,0,.15)}
.b-ones{display:grid;grid-template-rows:repeat(5,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;margin-left:6px}
.b-cube{display:block;width:12px;height:12px;border-radius:2px;background:var(--bc);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.b-flat{display:block;width:100px;height:100px;border-radius:4px;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(0,0,0,.22) 9px 10px),repeating-linear-gradient(to right,var(--bc) 0 9px,rgba(0,0,0,.22) 9px 10px)}
.tint-a{--bc:var(--dot-a)} .tint-b{--bc:var(--dot-b)}
.b-rod.x,.b-cube.x{opacity:.25;outline:2px solid var(--oops)}
.b-cap{font-family:var(--font-display);font-weight:700;font-size:24px}
.split{display:flex;flex-direction:column;align-items:center;font-family:var(--font-display);font-weight:700;font-size:30px}
.split span{display:grid;place-items:center;min-width:64px;height:64px;padding:0 10px;border-radius:32px;background:var(--card-2);border:3px solid var(--tc)}
.sp-legs{width:150px;height:44px}
.sp-legs path{stroke:var(--tc);stroke-width:4;stroke-linecap:round;fill:none}
.sp-parts{display:flex;gap:56px}
.eq{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,7vw,52px);text-align:center;font-variant-numeric:tabular-nums}
.eq mark{background:var(--good-soft);color:var(--good);border-radius:14px;padding:0 12px}
.eq small{display:block;font-size:20px;font-weight:600;color:var(--ink-soft)}
.col{display:grid;grid-template-columns:40px repeat(var(--n),54px);align-items:end;font-family:var(--font-display);font-weight:700;font-size:38px;text-align:center;font-variant-numeric:tabular-nums}
.col-h{font-size:16px;color:var(--ink-soft);font-weight:600;letter-spacing:.5px;padding-bottom:2px}
.col-c{font-size:20px;color:var(--add);height:26px;line-height:26px}
.col-d{height:56px;line-height:56px;border-radius:10px}
.col-op{font-size:34px;color:var(--ink-soft);height:56px;line-height:56px}
.col-rule{grid-column:1/-1;height:4px;border-radius:2px;background:var(--ink);margin:4px 0}
.col-ans{color:var(--good)}
.col .hl{background:var(--sun);color:#2A1E00}
.col-h.hl{background:none;color:var(--ink)}
.ex{position:relative;display:inline-block;line-height:1}
.ex s{color:var(--ink-soft);text-decoration-color:var(--oops);text-decoration-thickness:4px}
.ex em{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-style:normal;font-size:19px;color:var(--sub);white-space:nowrap}
.col .hl .ex s{color:#5B4A1A}

/* practice */
.practice{display:flex;flex-direction:column;gap:18px}
.pr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pdots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pd{width:24px;height:24px;padding:0;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.pd.cur{border-color:var(--tc);transform:scale(1.15)}
.pd.ok,.pd.fixed{background:var(--good);border-color:var(--good)}
.pd.fixed{box-shadow:0 0 0 3px var(--good-soft)}
.pd.help{background:var(--sun);border-color:var(--sun);cursor:pointer;animation:nudge 2.4s ease-in-out infinite}
.pd[aria-disabled="true"]{cursor:default}
@keyframes nudge{0%,80%,100%{transform:scale(1)}90%{transform:scale(1.25)}}
.res-dots{margin:0;justify-content:center}
.res-dots .pd{width:30px;height:30px}
.res-hint{color:var(--ink-soft);font-size:16px}

   NUMBER BUDDIES / TALVENNERNE
   How to extend later (times tables, sharing/division, ...):
   1. In TOPICS, remove `soon:true` from a topic and give it `levels`
      (each level: { id, examples:[problem], problems:[...] }).
      A problem is { a, b, op } (op is '+', '-', 'x' or '÷'), optional missing:'b'.
   2. Add the level texts (title, goal, what, why) to I18N.en.levels and
      I18N.da.levels under the same id.
   3. Add an explainer in EXPLAIN (keyed by strategy name), its sentences in
      I18N.<lang>.ex, and teach chooseStrategy() when to use it.
   ===================================================================== */

const M = '−';
const $ = (s, r = document) => r.querySelector(s);
const rep = (c, n) => Array.from({ length: Math.max(0, n) }, () => c);
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s[0].toUpperCase() + s.slice(1);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const digits = (n, N) => Array.from({ length: N }, (_, i) => Math.floor(n / 10 ** i) % 10);
const P = (a, b, op, extra) => ({ a, b, op, ...(extra || {}) });
const list = (a, b) => range(a, b).join(', ');

/* ---------- saved progress (this device only) ---------- */
const KEY = 'numberBuddies.v1';
let store = { name: '', best: {}, sound: true, lang: '' };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) store = { ...store, ...s }; } catch (e) {}
if (store.lang !== 'en' && store.lang !== 'da') store.lang = /^da\b/i.test(navigator.language || '') ? 'da' : 'en';
/* Progress lives in two places: this browser (instant, works offline) and, when the page runs
   on claude.ai, a private document in the signed-in account (survives cleared Safari data and
   follows the account to other devices). Only this viewer can read their own document. */
let cloud = null, cloudBusy = false, cloudDirty = false, cloudTimer = null;
function save() {
  store.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 600); }
}
async function pushCloud() {
  if (!cloud) return;
  if (cloudBusy) { cloudDirty = true; return; }
  cloudBusy = true;
  try { await cloud.set(JSON.parse(JSON.stringify(store))); }
  catch (e) {
    const c = e && e.code;
    if (c === 'unavailable') { cloudDirty = true; await new Promise(r => setTimeout(r, 1500 + Math.random() * 1000)); }
    else if (c !== 'resource_exhausted') cloud = null; // no write access in this view: keep using this device only
  }
  cloudBusy = false;
  if (cloudDirty && cloud) { cloudDirty = false; pushCloud(); }
}
function mergeRemote(r) {
  if ((r.resetAt || 0) > (store.savedAt || 0)) { store = { ...store, ...r }; return; }
  if ((store.resetAt || 0) > (r.savedAt || 0)) return;
  const best = { ...(r.best || {}) };
  for (const [k, v] of Object.entries(store.best || {})) best[k] = Math.max(best[k] || 0, v);
  const newer = (r.savedAt || 0) > (store.savedAt || 0);
  store = {
    ...store, best,
    name: newer ? (r.name || store.name || '') : (store.name || r.name || ''),
    lang: newer && (r.lang === 'en' || r.lang === 'da') ? r.lang : store.lang,
    sound: newer && typeof r.sound === 'boolean' ? r.sound : store.sound,
    round: newer ? (r.round || null) : (store.round || null),
    unlockAll: newer ? !!r.unlockAll : !!store.unlockAll
  };
}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    const before = JSON.stringify(store);
    if (snap.exists) mergeRemote(snap.data());
    cloud = ref;
    save();
    if (JSON.stringify({ ...store, savedAt: 0 }) !== JSON.stringify({ ...JSON.parse(before), savedAt: 0 })) refreshAfterSync(JSON.parse(before).lang);
    const note = document.getElementById('sync-note'); if (note) note.textContent = tr().syncCloud;
  } catch (e) {}

function frames(cells) {
  const n = Math.max(10, Math.ceil(cells.length / 10) * 10);
  let h = '<div class="frames" aria-hidden="true">';
  for (let f = 0; f < n / 10; f++) {
    h += '<div class="frame">';
    for (let i = 0; i < 10; i++) { const c = cells[f * 10 + i]; h += `<span class="cell">${c ? `<i class="dot dot-${c}"></i>` : ''}</span>`; }
    h += '</div>';
  }
  return h + '</div>';
}
function numberLine(from, hops = [], opt = {}) {
  const pts = [from], H = []; let cur = from;
  hops.forEach(to => { H.push({ a: cur, b: to }); cur = to; pts.push(to); });
  const lo = Math.min(...pts), hi = Math.max(...pts);
  let min = opt.min ?? Math.floor(lo / 10) * 10, max = opt.max ?? Math.ceil(hi / 10) * 10;
  if (max - min < 10) max = min + 10;
  const W = 640, pad = 30, y = 118;
  const span = max - min, step = span <= 20 ? 1 : span <= 200 ? 10 : span <= 2000 ? 100 : 1000, big = step * 10;
  if (step > 10) { min = Math.floor(min / step) * step; max = Math.ceil(max / step) * step; }
  const nDig = String(Math.max(Math.abs(min), Math.abs(max))).length, numW = nDig * 10 + 8, markW = nDig * 13 + 6;
  const marks = [...new Set(pts)].sort((a, b) => a - b);
  const lin = v => pad + (v - min) / (max - min) * (W - 2 * pad);
  const gaps = marks.slice(1).map((v, i) => lin(v) - lin(marks[i]));
  // big numbers with small jumps (5520 → 5620 → 5664) use an "empty number line": in order, not to scale
  const empty = span > 20 && gaps.length > 0 && Math.min(...gaps) < markW + 4;
  const sx = !empty ? lin : v => { const i = marks.indexOf(v), n = marks.length, l0 = marks[0], l1 = marks[n - 1];
    return pad + 24 + (W - 2 * pad - 48) * (0.35 * (v - l0) / ((l1 - l0) || 1) + 0.65 * (n > 1 ? i / (n - 1) : 0.5)); };
  let s = `<svg class="nl" viewBox="0 0 ${W} 192" role="img" aria-label="${tr().numberLine} ${min}–${max}">`;
  s += `<line x1="${pad - 16}" y1="${y}" x2="${W - pad + 16}" y2="${y}" class="nl-axis"/>`;
  for (let v = min; v <= max && !empty; v += step) {

    range(0, N - 1).reverse().forEach(i => { const x = da[i] * 10 ** i, y = db[i] * 10 ** i; if (x || y) { sums.push(x + y); steps.push({ say: X.place(i, x, y, x + y), v: eq(`${x} + ${y} = ${mk(x + y)}`, tr().place[i]) }); } });
    steps.push({ say: X.join(sums.join(' + '), s), v: eq(`${sums.join(' + ')} = ${mk(s)}`) });
    steps.push({ say: X.end(a, b, s), v: eq(`${a} + ${b} = ${mk(s)}`) });
    return { steps, why: X.why };
  },
  countBack({ a, b }, X) {
    const d = a - b, hops = range(d, a - 1).reverse();
    return { steps: [
      { say: X.s1(a, b, hops.join(', ')), v: numberLine(a, hops, { min: 0, max: a > 10 ? 20 : 10 }) },
      { say: X.end(a, b, d), v: eq(`${a} ${M} ${b} = ${mk(d)}`, chk(d, b, a)) }
    ], why: X.why };
  },

  /* times tables */
  groups({ a, b }, X) {
    const r = a * b, x = XS();
    return { steps: [
      { say: X.s1(a, b, x), v: groupsVis(a, b) },
      { say: X.s2(b, multiples(b, a).join(', ')), v: skipLine(b, a) },
      { say: X.end(a, b, r, x), v: eq(`${a} ${x} ${b} = ${mk(r)}`) }
    ], why: X.why(a, b, x) };
  },
  tensMul({ a }, X) {
    const r = a * 10, x = XS();
    return { steps: [
      { say: X.s1(a, x), v: r <= 120 ? blocks(r) : pvChart(r, 1) },
      { say: X.s2(a, r), v: row(pvChart(a, 0, String(r).length), opS('→'), pvChart(r, 0)) },
      { say: X.end(a, r, x), v: eq(`${a} ${x} 10 = ${mk(r)}`) }
    ], why: X.why };
  },
  fives({ a }, X) {
    const r = a * 5, x = XS();
    return { steps: [
      { say: X.s1(a, x, multiples(5, a).join(', ')), v: skipLine(5, a) },
      { say: X.trick(a, 10 * a, r, x), v: eq(`${a} ${x} 10 = ${10 * a} → ${mk(r)}`) },
      { say: X.end(a, r, x), v: eq(`${a} ${x} 5 = ${mk(r)}`) }
    ], why: X.why };
  },
  array({ a, b }, X) {
    const r = a * b, x = XS();
    return { steps: [
      { say: X.s1(a, b, x), v: arrayVis(a, b) },
      { say: X.s2(a, b, x), v: arrayVis(b, a) },
      { say: X.s3(a, b, multiples(a, b).join(', ')), v: skipLine(a, b) },
      { say: X.end(a, b, r, x), v: eq(`${a} ${x} ${b} = ${mk(r)}`) }
    ], why: X.why };
  },
  threes({ a }, X) {
    const x = XS();
    return { steps: [
      { say: X.s1(a, x), v: groupsVis(3, a) },
      { say: X.s2(a, 2 * a, 3 * a, x), v: eq(`${2 * a} + ${a} = ${mk(3 * a)}`) },
      { say: X.end(a, 3 * a, x), v: eq(`${a} ${x} 3 = ${mk(3 * a)}`) }
    ], why: X.why };
  },
  fours({ a }, X) {
    const x = XS();
    return { steps: [
      { say: X.s1(a, x), v: arrayVis(4, a) },
      { say: X.s2(a, 2 * a, x), v: chain([a, 2 * a], '×2') },
      { say: X.s3(2 * a, 4 * a, a, x), v: chain([a, 2 * a, 4 * a], '×2') },
      { say: X.end(a, 4 * a, x), v: eq(`${a} ${x} 4 = ${mk(4 * a)}`) }
    ], why: X.why };
  },
  eights({ a }, X) {
    const x = XS();
    return { steps: [
      { say: X.s1(a, x), v: chain([a], '×2') },
      { say: X.d1(a, 2 * a), v: chain([a, 2 * a], '×2') },
      { say: X.d2(2 * a, 4 * a), v: chain([a, 2 * a, 4 * a], '×2') },
      { say: X.d3(4 * a, 8 * a), v: chain([a, 2 * a, 4 * a, 8 * a], '×2') },
      { say: X.end(a, 8 * a, x), v: eq(`${a} ${x} 8 = ${mk(8 * a)}`) }
    ], why: X.why };
  },
  skipCount({ a, b }, X) {
    const r = a * b, x = XS();
    return { steps: [
      { say: X.s1(a, b, x), v: skipLine(b, Math.min(a, 12)) },
      { say: X.s2(b, multiples(b, a).join(', ')), v: chips(multiples(b, a), r) },
      { say: X.end(a, b, r, x), v: eq(`${a} ${x} ${b} = ${mk(r)}`) }
    ], why: X.why };
  },
  repeatAdd({ a, b }, X) {
    const r = a * b, x = XS(), sum = rep(b, a).join(' + ');
    return { steps: [
      { say: X.s1(a, b, x, sum), v: groupsVis(a, b) },
      { say: X.s2(multiples(b, a).join(', ')), v: chips(multiples(b, a), r) },
      { say: X.end(a, b, r, x), v: eq(`${sum} = ${mk(r)}`) }
    ], why: X.why };
  },
  partitionMul({ a, b }, X) {
    const T = a - a % 10, O = a % 10, r = a * b, x = XS();
    return { steps: [
      { say: X.s1(a, b, T, O, x), v: split(a, T, O) },
      { say: X.part(T, b, T * b, x), v: eq(`${T} ${x} ${b} = ${mk(T * b)}`) },
      { say: X.part(O, b, O * b, x), v: eq(`${O} ${x} ${b} = ${mk(O * b)}`) },
      { say: X.add(T * b, O * b, r), v: eq(`${T * b} + ${O * b} = ${mk(r)}`) },
      { say: X.end(a, b, r, x), v: eq(`${a} ${x} ${b} = ${mk(r)}`) }
    ], why: X.why };
  },
  missingMul(p, X) {
    const c = resOf(p), known = p.missing === 'a' ? p.b : p.a, ans = c / known, x = XS(), dv = DS();
    return { steps: [
      { say: X.s1(qText(p), known, c), v: eq(qHtmlStatic(p)) },
      { say: X.s2(known, c, multiples(known, ans).join(', ')), v: skipLine(known, ans) },
      { say: X.s3(ans), v: chips(multiples(known, ans), c) },
      { say: X.end(ans, fullEq(p)), v: eq(qHtmlStatic(p, ans)) }
    ], why: X.why(c, known, ans, dv) };
  },

  /* sharing */
  share({ a, b }, X) {
    const q = a / b, dv = DS(), x = XS();
    return { steps: [
      { say: X.s1(a, b, dv), v: pileVis(a) },
      { say: X.s2(b), v: platesVis(b, q) },
      { say: X.end(a, b, q, dv), v: eq(`${a} ${dv} ${b} = ${mk(q)}`, `${b} ${x} ${q} = ${a}`) }
    ], why: X.why(b, q, a, x) };
  },
  group({ a, b }, X) {
    const q = a / b, dv = DS();
    return { steps: [
      { say: X.s1(a, b, dv), v: q * b <= 60 ? groupsVis(q, b) : pileVis(Math.min(a, 60)) },
      { say: X.s2(b, a, multiples(b, q).join(', ')), v: skipLine(b, q) },
      { say: X.end(a, b, q, dv), v: eq(`${a} ${dv} ${b} = ${mk(q)}`) }
    ], why: X.why(b) };
  },
  inverse({ a, b }, X) {
    const q = a / b, dv = DS(), x = XS();
    return { steps: [
      { say: X.s1(a, b, dv, x), v: eq(`? ${x} ${b} = ${a}`) },
      { say: X.s2(b, multiples(b, q).join(', '), a, q), v: chips(multiples(b, q), a) },
      { say: X.end(a, b, q, dv, x), v: eq(`${q} ${x} ${b} = ${a}`, `${a} ${dv} ${b} = ${q}`) }
    ], why: X.why };
  },
  halve({ a }, X) {
    const O = a % 10, T = a - O, dv = DS(), h = a / 2;
    if (!O || T === 0) return { steps: [
      { say: X.s1(a, dv), v: split(a, h, h) },
      { say: X.whole(a, h), v: eq(`${a} ${dv} 2 = ${mk(h)}`) }
    ], why: X.why };
    return { steps: [
      { say: X.s1(a, dv), v: split(a, T, O) },
      { say: X.s2(T, O), v: row(split(T, T / 2, T / 2), split(O, O / 2, O / 2)) },
      { say: X.s3(T / 2, O / 2, h), v: eq(`${T / 2} + ${O / 2} = ${mk(h)}`) },
      { say: X.end(a, h, dv), v: eq(`${a} ${dv} 2 = ${mk(h)}`) }
    ], why: X.why };
  },
  quarter({ a }, X) {
    const dv = DS();
    return { steps: [
      { say: X.s1(a, dv), v: chain([a], '÷2') },
      { say: X.h1(a, a / 2), v: chain([a, a / 2], '÷2') },
      { say: X.h2(a / 2, a / 4), v: chain([a, a / 2, a / 4], '÷2') },
      { say: X.end(a, a / 4, dv), v: eq(`${a} ${dv} 4 = ${mk(a / 4)}`) }
    ], why: X.why };
  },
  eighth({ a }, X) {
    const dv = DS();
    return { steps: [
      { say: X.s1(a, dv), v: chain([a], '÷2') },
      { say: X.h1(a, a / 2), v: chain([a, a / 2], '÷2') },
      { say: X.h2(a / 2, a / 4), v: chain([a, a / 2, a / 4], '÷2') },
      { say: X.h3(a / 4, a / 8), v: chain([a, a / 2, a / 4, a / 8], '÷2') },
      { say: X.end(a, a / 8, dv), v: eq(`${a} ${dv} 8 = ${mk(a / 8)}`) }
    ], why: X.why };
  },
  partitionDiv({ a, b }, X) {
    const chunk = Math.floor(a / (10 * b)) * 10 * b, rest = a - chunk, q = a / b, dv = DS();
    return { steps: [
      { say: X.s1(a, b, chunk, rest, dv), v: split(a, chunk, rest) },
      { say: X.part(chunk, b, chunk / b, dv), v: eq(`${chunk} ${dv} ${b} = ${mk(chunk / b)}`) },
      { say: X.part(rest, b, rest / b, dv), v: eq(`${rest} ${dv} ${b} = ${mk(rest / b)}`) },
      { say: X.add(chunk / b, rest / b, q), v: eq(`${chunk / b} + ${rest / b} = ${mk(q)}`) },
      { say: X.end(a, b, q, dv), v: eq(`${a} ${dv} ${b} = ${mk(q)}`) }

  missingDiv(p, X) {

      { say: X.s2a(p.b, c, p.a, x), v: eq(`${p.b} ${x} ${c} = ${mk(p.a)}`) },
      { say: X.end(p.a, fullEq(p)), v: eq(qHtmlStatic(p, p.a)) }
    ], why: X.why };
    return { steps: [
      { say: X.s1b(p.a, c, dv), v: eq(qHtmlStatic(p)) },
      { say: X.s2b(c, p.a, multiples(c, p.b).join(', '), p.b), v: skipLine(c, p.b) },
      { say: X.end(p.b, fullEq(p)), v: eq(qHtmlStatic(p, p.b)) }
    ], why: X.why };
  },

  /* other ways that re-use the explanations above */
  swapMul({ a, b }, X) {
    const inner = explainWith(P(b, a, 'x'), chooseStrategy(P(b, a, 'x')));
    return { steps: [{ say: X.s1(a, b, XS()), v: row(arrayVis(Math.min(a, 10), Math.min(b, 10)), opS('='), arrayVis(Math.min(b, 10), Math.min(a, 10))) }, ...inner.steps], why: X.why };
  },
  missingTurn(p, X) {
    const c = resOf(p), x = XS(), dv = DS();
    let q, ans;
    if (p.op === '+') { const known = p.missing === 'a' ? p.b : p.a; q = P(c, known, '-'); ans = c - known; }
    else if (p.op === '-') { if (p.missing === 'b') { q = P(p.a, c, '-'); ans = p.b; } else { q = P(c, p.b, '+'); ans = p.a; } }
    else if (p.op === 'x') { const known = p.missing === 'a' ? p.b : p.a; q = P(c, known, '÷'); ans = c / known; }
    else { if (p.missing === 'a') { q = P(c, p.b, 'x'); ans = p.a; } else { q = P(p.a, c, '÷'); ans = p.b; } }
    const inner = explainWith(q, chooseStrategy(q));
    return { steps: [{ say: X.s1(qText(p), qText(q)), v: eq(`${qText(q)} = □`) }, ...inner.steps, { say: X.end(ans, fullEq(p)), v: eq(qHtmlStatic(p, ans)) }], why: inner.why };
  }
});

/* a fixed equation with the missing number shown (or a box) for pictures */
function qHtmlStatic(p, fill) {
  const v = n => fill != null ? mk(fill) : '□';
  const A = p.missing === 'a' ? v() : p.a, B = p.missing === 'b' ? v() : p.b;
  return `${A} ${opSym(p.op)} ${B}${p.c != null ? ` + ${p.c}` : ''} = ${p.missing ? resOf(p) : fill != null ? mk(fill) : '□'}`;
}

/* story questions: find the maths in the story, then explain the sum */
function storyWrap(p, inner) {
  const X = tr().ex.story, q = qText({ ...p, story: null });
  return { steps: [{ say: X.intro(p.op, q), v: eq(`${q} = □`) }, ...inner.steps, { say: X.end(resOf(p)), v: eq(`${q} = ${mk(resOf(p))}`) }], why: inner.why };
}
function explainWith(p, s) {
  const base = { ...p }; delete base.story;
  const e = EXPLAIN[s](base, tr().ex[s] || {});
  return p.story != null ? storyWrap(p, e) : e;
}

/* other ways to explain the same question, in the order a teacher would try them */
function altsFor(p) {
  const s = stratOf(p), { a, b } = p, r = resOf(p), out = [];
  const add = x => { if (x && x !== s && EXPLAIN[x] && !out.includes(x)) out.push(x); };
  if (p.missing) add('missingTurn');
  else if (p.op === '+') {
    if (p.c != null) add('threeLeft');
    else {
      if (r <= 20) add('countAll');
      if (r <= 20 && Math.min(a, b) <= 9 && r > 10) add('bridgeAdd');
      if (a >= 10 || b >= 10) add('jumpAdd');
      if (a >= 10 && b >= 10) { add('partitionAdd'); add('columnAdd'); }
    }
  } else if (p.op === '-') {
    if (a <= 20 && b <= 10) { add('takeAway'); add('countBack'); }
    add('countUpAny');
    if (a >= 10 && b >= 10) add('jumpSub');
    if (a >= 100) add('columnSub');
  } else if (p.op === 'x') {
    if (a <= 10 && b <= 10 && a * b <= 60) { add('groups'); add('array'); }
    if (a <= 12 && b <= 12) add('skipCount');
    if (a <= 5) add('repeatAdd');
    if (a >= 11) add('partitionMul');
    if (a !== b && a <= 12 && b <= 12 && b !== 1) add('swapMul');
  } else {
    const q = a / b;
    if (a <= 30 && b <= 5) add('share');
    if (q <= 12) { add('inverse'); add('group'); }
    if (b === 2 && a >= 12) add('halve');
    if (b === 4) add('quarter');
    if (b === 8) add('eighth');
    if (q > 12) add('partitionDiv');
  }
  return out;
}

      s12: { title: 'Missing numbers', goal: 'Find the missing part', what: 'In 62 − □ = 40, count up from 40 to 62. In □ − 15 = 30, add 30 and 15.', why: 'Adding and taking away are opposites, so you can turn the question around.' },
      s13: { title: 'Zeros in the way', goal: 'Exchanging across a zero', what: 'If the next column has a 0, you cannot exchange from it. Go one more column along, then exchange step by step.', why: '400 is the same as 3 hundreds and 10 tens, which is the same as 3 hundreds, 9 tens and 10 ones. The number never changes.' },
      s14: { title: 'Word problems', goal: 'Taking away in stories', what: 'Read the story. If something is taken away or used up, or you need to find how many more, you subtract.', why: 'Spotting the maths in a story is a skill you will use every day.' },
      s15: { title: 'Thousands', goal: '4-digit column subtraction', what: 'Line up thousands, hundreds, tens and ones. Start with the ones and exchange when the top digit is too small.', why: 'The column method works for any size of number, because every column follows the same rule.' },
      m1: { title: 'Equal groups', goal: 'The 2 times table', what: 'Times means equal groups. 4 × 2 means 4 groups of 2. Count in 2s to find the answer.', why: 'Multiplying is a fast way of adding the same number again and again.' },
      m2: { title: 'The 10 times table', goal: 'Count in 10s', what: 'Times 10 means groups of ten. 6 × 10 is 6 tens, which is 60.', why: 'When you multiply by 10, every digit moves one place to the left and a 0 fills the ones.' },
      m3: { title: 'The 5 times table', goal: 'Count in 5s', what: 'Count in 5s: 5, 10, 15, 20 … Or use the 10s and take half.', why: '5 is half of 10, so 5 times a number is half of 10 times it. Fives always end in 5 or 0.' },
      m4: { title: 'Arrays and swapping', goal: 'Turn it around', what: 'An array is rows of dots. 5 × 7 is 5 rows of 7, and it is also 7 rows of 5.', why: 'You can swap the numbers in a times sum and get the same answer. Choose the way that is easier.' },
      m5: { title: 'The 3 times table', goal: 'Count in 3s', what: '3 groups is 2 groups and one more. Double the number, then add it once more.', why: 'If you know your doubles, you can work out any 3 times fact.' },
      m6: { title: 'The 4 times table', goal: 'Double the 2s', what: '4 is double 2. To times by 4, double the number, then double again.', why: 'The 4 times table is double the 2 times table.' },
      m7: { title: 'The 8 times table', goal: 'Double the 4s', what: '8 is double 4. To times by 8, double three times.', why: 'Each double makes it twice as big: 2s, 4s, 8s.' },
      m8: { title: 'Mixed tables', goal: '3s, 4s and 8s', what: 'Look at the number you times by and choose your trick: one more group for 3s, double double for 4s, double double double for 8s.', why: 'Knowing a trick for each table means you can always work it out, even if you forget.' },
      m9: { title: 'Missing numbers', goal: 'Like □ × 4 = 20', what: 'Count in the times table until you reach the answer. The number of jumps is the missing number.', why: 'A missing number in a times sum is really a sharing question. Times and sharing are opposites.' },
      m10: { title: 'Bigger times', goal: '2-digit × 1-digit', what: 'Split the bigger number into tens and ones. Times each part, then add.', why: 'Splitting turns one hard times sum into two easy ones that use the tables you know.' },
      d1: { title: 'Sharing equally', goal: 'Share between 2 and 3', what: 'Sharing means giving everyone the same amount. Hand them out one at a time.', why: 'Fair sharing makes equal groups. You can check with a times sum.' },
      d2: { title: 'Making groups', goal: 'How many 5s or 10s?', what: '20 ÷ 5 can mean: how many groups of 5 fit into 20? Count in 5s and count the jumps.', why: 'Division is the opposite of multiplication, so counting in steps finds the answer.' },
      d3: { title: 'Use your tables', goal: 'Divide by 2, 5 and 10', what: 'To work out 35 ÷ 5, think: what times 5 makes 35?', why: 'Every times fact gives you a division fact for free. 7 × 5 = 35, so 35 ÷ 5 = 7.' },
      d4: { title: 'Halving', goal: 'Half of bigger numbers', what: 'Dividing by 2 means halving. Halve the tens and the ones separately, then add.', why: 'Halves of tens and ones are easy, and putting them back together gives half of the whole number.' },
      d5: { title: 'Dividing by 3', goal: 'Use the 3 times table', what: 'To work out 24 ÷ 3, count in 3s to 24 and count the jumps.', why: 'The 3 times table, used backwards, shares into 3 equal groups.' },
      d6: { title: 'Dividing by 4', goal: 'Halve, then halve again', what: 'Dividing by 4 is the same as halving twice.', why: '4 is 2 × 2, so two halvings make 4 equal parts.' },
      d7: { title: 'Dividing by 8', goal: 'Use the 8 times table', what: 'To work out 56 ÷ 8, think: what times 8 makes 56? Or halve three times.', why: '8 is 2 × 2 × 2, so halving three times gives 8 equal parts.' },
      d8: { title: 'Mixed sharing', goal: 'Divide by 3, 4 and 8', what: 'Look at the number you divide by and pick your trick: the 3s table, halve twice for 4, or the 8s table.', why: 'Every division can be checked with a times sum.' },
      d9: { title: 'Missing numbers', goal: 'Like □ ÷ 4 = 6', what: 'Turn it around with a times sum: □ ÷ 4 = 6 means 6 × 4 = □.', why: 'Sharing and times are opposites, so one can always undo the other.' },
      d10: { title: 'Bigger sharing', goal: '2-digit ÷ 1-digit', what: 'Split the number into parts that are easy to share, like 40 and 8. Share each part, then add.', why: 'Splitting into friendly parts lets you use the tables you already know.' }
    },
    ex: {
      story: { intro: (op, q) => op === '+' ? `Let's find the maths in the story. Amounts are put together, so we add: ${q}.` : `Let's find the maths in the story. Some are taken away, or we find what is missing, so we subtract: ${q}.`, end: n => `So the answer to the story is ${n}.` },
      columnSub: { noNext: (i, bot, was, j) => `${cap(EN[i])}: we can't take ${bot} from ${was}, and there are no ${EN[i + 1]} to exchange. So first we go to the ${EN[j]}.`,

      doubles: { s1: a => `${a} + ${a} is a double: the same number twice.`, split: (t, o) => `Double the tens and double the ones: double ${t} is ${2 * t}, and double ${o} is ${2 * o}.`, know: (a, s) => `If you know your doubles, you know it straight away: double ${a} is ${s}.`, end: (a, s) => `So ${a} + ${a} = ${s}.`, why: 'Doubles are easy to remember, and they help with lots of other sums, like near doubles.' },
      nearDouble: { s1: (a, b) => `${a} and ${b} are next-door numbers, so this is a near double.`, s2: sm => `Double the smaller one: ${sm} + ${sm} = ${2 * sm}.`, s3: (big, sm, d) => `${big} is one more than ${sm}, so add 1 more: ${d} + 1 = ${d + 1}.`, end: (a, b, s) => `So ${a} + ${b} = ${s}.`, why: 'If you know your doubles, a near double is just a double plus one.' },
      compAdd: { s1: (b, ten) => `${b} is very close to ${ten}, and adding ${ten} is easy!`, s2: (a, ten) => `First add ${ten}: ${a} + ${ten} = ${a + ten}.`, minus: (x, s) => `But we added 1 too many, so take 1 away: ${x} − 1 = ${s}.`, plus: (x, s) => `We still need to add 1 more: ${x} + 1 = ${s}.`, end: (a, b, s) => `So ${a} + ${b} = ${s}.`, why: 'Adding a whole ten is quick. Then you just fix it by 1. This trick works for 9, 11, 19 and 21.' },
      threeAdd: { s1: (a, b, c) => `${a} + ${b} + ${c}. With three numbers, look for two that are easy to add first.`, ten: (x, y) => `${x} and ${y} are friends of 10! ${x} + ${y} = 10.`, double: (x, y, xy) => `${x} and ${y} are a double: ${x} + ${y} = ${xy}.`, start: (x, y, xy) => `Start with the first two: ${x} + ${y} = ${xy}.`, last: (xy, z, s) => `Now add the last number: ${xy} + ${z} = ${s}.`, end: (a, b, c, s) => `So ${a} + ${b} + ${c} = ${s}.`, why: 'You can add numbers in any order. Finding a pair that makes 10 first makes the rest easy.' },
      threeLeft: { s1: (a, b, ab) => `Let's go from left to right. First: ${a} + ${b} = ${ab}.`, s2: (ab, c, s) => `Then add the last number: ${ab} + ${c} = ${s}.`, end: (a, b, c, s) => `So ${a} + ${b} + ${c} = ${s}.`, why: 'Adding two numbers at a time always works, whichever order you choose.' },
      bond100: { s1: a => `${a} + □ = 100. How far is it from ${a} to 100?`, toTen: (a, up, nt) => `First jump to the next ten: ${a} + ${up} = ${nt}.`, toHundred: (nt, j) => `Then jump in tens up to 100: ${nt} + ${j} = 100.`, add: (j1, j2, b) => `Add the jumps together: ${j1} + ${j2} = ${b}.`, end: (a, b) => `So ${a} + ${b} = 100. ${a} and ${b} are friends of 100!`, why: 'Friends of 100 work like friends of 10. 30 + 70 = 100 because 3 + 7 = 10.' },
      placeBig: { s1: (b, k, col) => `${b} is ${k} ${EN[col]}, so only the ${EN[col]} digit changes.`, s2: (d, k, col) => `${d} ${EN[col]} + ${k} ${EN[col]} = ${d + k} ${EN[col]}. The other digits stay the same.`, end: (a, b, s) => `So ${a} + ${b} = ${s}.`, why: 'When you add only tens or only hundreds, the other digits stay the same, as long as nothing goes past 9.' },
      placeBigSub: { s1: (b, k, col) => `${b} is ${k} ${EN[col]}, so only the ${EN[col]} digit changes.`, s2: (d, k, col) => `${d} ${EN[col]} − ${k} ${EN[col]} = ${d - k} ${EN[col]}. The other digits stay the same.`, end: (a, b, d) => `So ${a} − ${b} = ${d}.`, why: 'When you take away only tens or only hundreds, the other digits stay the same, as long as there are enough.' },
      missingAdd: { s1: (q, known, c) => `${q}. To find the missing number, think: what do we add to ${known} to make ${c}?`, jump: (x, y, j) => `Count up from ${x} to ${y}: that's ${j}.`, add: (js, ans) => `Add the jumps: ${js} = ${ans}.`, end: (ans, e) => `The missing number is ${ans}. Check: ${e}.`, why: (c, known, ans) => `Adding and taking away are opposites. You could also take away: ${c} − ${known} = ${ans}.` },
      missingSub: { s1b: (a, c) => `${a} − □ = ${c}. Something was taken from ${a} and ${c} was left. Count up from ${c} to ${a} to find it.`, s1a: (b, c) => `□ − ${b} = ${c}. We took ${b} away and ${c} was left.`, back: (c, b, a) => `So the start number is what was left plus what was taken: ${c} + ${b} = ${a}.`, jump: (x, y, j) => `Count up from ${x} to ${y}: that's ${j}.`, add: (js, ans) => `Add the jumps: ${js} = ${ans}.`, end: (ans, e) => `The missing number is ${ans}. Check: ${e}.`, why: 'Taking away and adding are opposites, so you can always turn a missing number question around.' },
      countUpAny: { s1: (a, b) => `${a} − ${b}: let's count up from ${b} to ${a}, using friendly numbers.`, jump: (x, y, j) => `From ${x} up to ${y}: that's ${j}.`, add: (js, d) => `Add the jumps: ${js} = ${d}.`, end: (a, b, d) => `So ${a} − ${b} = ${d}.`, why: 'Taking away also means finding the difference. Counting up the gap in friendly jumps always works.' },
      compSub: { s1: (b, ten) => `${b} is very close to ${ten}, and taking away ${ten} is easy!`, s2: (a, ten) => `First take away ${ten}: ${a} − ${ten} = ${a - ten}.`, plus: (x, d) => `But we took away 1 too many, so give 1 back: ${x} + 1 = ${d}.`, minus: (x, d) => `We still need to take away 1 more: ${x} − 1 = ${d}.`, end: (a, b, d) => `So ${a} − ${b} = ${d}.`, why: 'Taking away a whole ten is quick. Then fix it by 1: give 1 back for 9, take 1 more for 11.' },
      fromTen: { s1: (a, b) => `${a} − ${b}. Split ${a} into ${a - 10} and 10.`, s2: b => `Use your friends of 10: 10 − ${b} = ${10 - b}.`, s3: (r, f, d) => `Put it back together: ${r} + ${f} = ${d}.`, end: (a, b, d) => `So ${a} − ${b} = ${d}.`, why: 'Taking a small number from a whole ten uses your friends of 10: the ones digit of the answer is the friend of the number you took away.' },
      from100: { s1: b => `100 − ${b}. Count up from ${b} to 100 in friendly jumps.`, jump: (x, y, j) => `From ${x} up to ${y}: that's ${j}.`, add: (js, d) => `Add the jumps: ${js} = ${d}.`, end: (b, d) => `So 100 − ${b} = ${d}. ${b} and ${d} are friends of 100!`, why: 'Taking away from 100 is the same as finding the friend of 100.' },
      countAll: { s1: (a, b) => `Let's count them all. Here are ${a} orange counters and ${b} blue counters.`, s2: l => `Point to each counter and count: ${l}.`, end: (a, b, s) => `There are ${s} altogether. So ${a} + ${b} = ${s}.`, why: 'Counting everything always works. It is slower, but it is a great way to check.' },
      jumpAdd: { s1: (a, b, parts) => `Start at ${a} on the number line. Split ${b} into ${parts} and jump one part at a time.`, jump: (pt, at) => `Jump +${pt}: we land on ${at}.`, end: (a, b, s) => `We landed on ${s}. So ${a} + ${b} = ${s}.`, why: 'Jumping in hundreds, tens and ones keeps big sums easy to follow.' },
      jumpSub: { s1: (a, b, parts) => `Start at ${a} on the number line. Split ${b} into ${parts} and jump back one part at a time.`, jump: (pt, at) => `Jump back ${pt}: we land on ${at}.`, end: (a, b, d) => `We landed on ${d}. So ${a} − ${b} = ${d}.`, why: 'Jumping back in hundreds, tens and ones breaks a big take-away into small easy steps.' },
      partitionAdd: { s1: (a, pa, b, pb) => `Split both numbers into their parts: ${a} = ${pa} and ${b} = ${pb}.`, place: (i, x, y, s) => `Add the ${EN[i]}: ${x} + ${y} = ${s}.`, join: (parts, s) => `Now add the parts together: ${parts} = ${s}.`, end: (a, b, s) => `So ${a} + ${b} = ${s}.`, why: 'Adding each place on its own, then putting them together, is like the column method said out loud.' },
      countBack: { s1: (a, b, l) => `Start at ${a} and count back ${b}: ${l}.`, end: (a, b, d) => `We landed on ${d}. So ${a} − ${b} = ${d}.`, why: 'Counting back one at a time is slow but always works for small numbers.' },
      groups: { s1: (a, b, x) => `${a} ${x} ${b} means ${a} groups of ${b}.`, s2: (b, l) => `Count in ${b}s, one group at a time: ${l}.`, end: (a, b, r, x) => `So ${a} ${x} ${b} = ${r}.`, why: (a, b, x) => `Multiplying is a quick way of adding equal groups. ${a} ${x} ${b} is ${b} added ${a} times.` },
      tensMul: { s1: (a, x) => `${a} ${x} 10 means ${a} groups of ten. That's ${a} tens.`, s2: (a, r) => `${a} tens is ${r}. Each digit moves one place to the left, and a 0 fills the ones.`, end: (a, r, x) => `So ${a} ${x} 10 = ${r}.`, why: 'Times 10 makes every digit worth ten times more, so each digit moves one place to the left.' },
      fives: { s1: (a, x, l) => `${a} ${x} 5: count in 5s, ${a} times: ${l}.`, trick: (a, t, r, x) => `Here's a trick: ${a} ${x} 10 = ${t}, and 5 is half of 10, so take half of ${t}. That's ${r}.`, end: (a, r, x) => `So ${a} ${x} 5 = ${r}.`, why: '5 is half of 10, so the 5 times table is half of the 10 times table. Fives always end in 5 or 0.' },
      array: { s1: (a, b, x) => `${a} ${x} ${b} can be drawn as an array: ${a} rows with ${b} dots in each row.`, s2: (a, b, x) => `Turn it around and you get ${b} rows of ${a}. It's the same dots! So ${a} ${x} ${b} = ${b} ${x} ${a}.`, s3: (a, b, l) => `Use the ${a} times table: count in ${a}s, ${b} times: ${l}.`, end: (a, b, r, x) => `So ${a} ${x} ${b} = ${r}.`, why: 'You can swap the numbers in a times sum and the answer stays the same. Pick the order that is easier for you.' },
      threes: { s1: (a, x) => `${a} ${x} 3 is the same as 3 groups of ${a}.`, s2: (a, d, r, x) => `Trick: 2 groups of ${a} is double ${a}, which is ${d}. One more group of ${a}: ${d} + ${a} = ${r}.`, end: (a, r, x) => `So ${a} ${x} 3 = ${r}.`, why: 'Three groups is two groups plus one more group. If you know your doubles, you can find any 3 times fact.' },
      fours: { s1: (a, x) => `${a} ${x} 4: four is double 2, so we can double twice.`, s2: (a, d, x) => `Double ${a}: that's ${d}. That is ${a} ${x} 2.`, s3: (d, r, a, x) => `Double it again: ${d} + ${d} = ${r}. That is ${a} ${x} 4.`, end: (a, r, x) => `So ${a} ${x} 4 = ${r}.`, why: 'The 4 times table is double the 2 times table.' },
      eights: { s1: (a, x) => `${a} ${x} 8: eight is double double double, so we double three times!`, d1: (a, d) => `Double ${a}: ${d}.`, d2: (d, e) => `Double again: ${e}.`, d3: (e, r) => `And once more: ${r}.`, end: (a, r, x) => `So ${a} ${x} 8 = ${r}.`, why: 'Each double makes it twice as big: 2s, then 4s, then 8s.' },
      skipCount: { s1: (a, b, x) => `${a} ${x} ${b}: jump in ${b}s along the number line, ${a} times.`, s2: (b, l) => `Say the ${b}s out loud as you jump: ${l}.`, end: (a, b, r, x) => `We landed on ${r}. So ${a} ${x} ${b} = ${r}.`, why: 'Counting in jumps of the same size is what times tables are made of.' },
      repeatAdd: { s1: (a, b, x, sum) => `${a} ${x} ${b} means adding ${b}, ${a} times: ${sum}.`, s2: l => `Add them one at a time: ${l}.`, end: (a, b, r, x) => `So ${a} ${x} ${b} = ${r}.`, why: 'Times is a short way of writing the same number added again and again.' },
      partitionMul: { s1: (a, b, T, O, x) => `${a} ${x} ${b}. Split ${a} into ${T} and ${O}.`, part: (n, b, r, x) => `${n} ${x} ${b} = ${r}.`, add: (x1, x2, r) => `Add the two answers: ${x1} + ${x2} = ${r}.`, end: (a, b, r, x) => `So ${a} ${x} ${b} = ${r}.`, why: 'Splitting a big number into tens and ones turns one hard times sum into two easy ones.' },
      missingMul: { s1: (q, k, c) => `${q}. Which number times ${k} makes ${c}?`, s2: (k, c, l) => `Count in ${k}s until you reach ${c}: ${l}.`, s3: ans => `That's ${ans} jumps, so the missing number is ${ans}.`, end: (ans, e) => `Check: ${e}.`, why: (c, k, ans, dv) => `A missing number in a times sum is really a sharing sum: ${c} ${dv} ${k} = ${ans}.` },
      share: { s1: (a, b, dv) => `${a} ${dv} ${b} means share ${a} equally between ${b}.`, s2: b => `Give one to each of the ${b}, again and again, until they are all gone.`, end: (a, b, q, dv) => `Each one gets ${q}. So ${a} ${dv} ${b} = ${q}.`, why: (b, q, a, x) => `Sharing fairly means everyone gets the same. Check with a times sum: ${b} ${x} ${q} = ${a}.` },
      group: { s1: (a, b, dv) => `${a} ${dv} ${b} can mean: how many groups of ${b} fit into ${a}?`, s2: (b, a, l) => `Jump in ${b}s from 0 to ${a} and count the jumps: ${l}.`, end: (a, b, q, dv) => `That's ${q} jumps. So ${a} ${dv} ${b} = ${q}.`, why: b => `Division is the opposite of multiplication. Counting jumps of ${b} is the ${b} times table backwards.` },
      inverse: { s1: (a, b, dv, x) => `${a} ${dv} ${b}: think of the ${b} times table. Which number times ${b} makes ${a}?`, s2: (b, l, a, q) => `Count in ${b}s: ${l}. ${a} is number ${q}.`, end: (a, b, q, dv, x) => `${q} ${x} ${b} = ${a}, so ${a} ${dv} ${b} = ${q}.`, why: 'If you know your times tables, you know your division facts too. They are opposites.' },
      halve: { s1: (a, dv) => `${a} ${dv} 2 means half of ${a}. Split ${a} into tens and ones.`, s2: (T, O) => `Half of ${T} is ${T / 2}, and half of ${O} is ${O / 2}.`, s3: (x, y, h) => `Put the halves together: ${x} + ${y} = ${h}.`, whole: (a, h) => `Half of ${a} is ${h}.`, end: (a, h, dv) => `So ${a} ${dv} 2 = ${h}.`, why: 'Halving the tens and the ones separately makes big numbers easy to halve.' },
      quarter: { s1: (a, dv) => `${a} ${dv} 4: dividing by 4 is the same as halving twice.`, h1: (a, h) => `Half of ${a} is ${h}.`, h2: (h, q) => `Half of ${h} is ${q}.`, end: (a, q, dv) => `So ${a} ${dv} 4 = ${q}.`, why: '4 is 2 × 2, so halving twice is the same as sharing into 4 equal parts.' },
      eighth: { s1: (a, dv) => `${a} ${dv} 8: dividing by 8 is the same as halving three times.`, h1: (a, h) => `Half of ${a} is ${h}.`, h2: (h, q) => `Half of ${h} is ${q}.`, h3: (q, e) => `And half of ${q} is ${e}.`, end: (a, e, dv) => `So ${a} ${dv} 8 = ${e}.`, why: '8 is 2 × 2 × 2, so halving three times shares into 8 equal parts.' },
      partitionDiv: { s1: (a, b, ch, rest, dv) => `${a} ${dv} ${b}. Split ${a} into parts that are easy to share: ${ch} and ${rest}.`, part: (n, b, r, dv) => `${n} ${dv} ${b} = ${r}.`, add: (x, y, q) => `Add the answers: ${x} + ${y} = ${q}.`, end: (a, b, q, dv) => `So ${a} ${dv} ${b} = ${q}.`, why: 'Splitting a big number into easy parts lets you use the times tables you already know.' },
      missingDiv: { s1a: (b, c, dv) => `□ ${dv} ${b} = ${c}. A number was shared into ${b} groups of ${c}.`, s2a: (b, c, a, x) => `So the number is ${b} groups of ${c}: ${b} ${x} ${c} = ${a}.`, s1b: (a, c, dv) => `${a} ${dv} □ = ${c}. ${a} is split into groups of ${c}. How many groups?`, s2b: (c, a, l, ans) => `Count in ${c}s up to ${a}: ${l}. That's ${ans} groups.`, end: (ans, e) => `The missing number is ${ans}. Check: ${e}.`, why: 'Division and multiplication are opposites, so you can turn the question around.' },
      swapMul: { s1: (a, b, x) => `Let's swap the numbers: ${b} ${x} ${a} has the same answer as ${a} ${x} ${b}, because the dots are the same.`, why: 'You can swap the numbers in a times sum, so choose the order you find easier.' },
      missingTurn: { s1: (q, q2) => `Let's turn it around. ${q} is the same question as ${q2}.`, end: (ans, e) => `So the missing number is ${ans}: ${e}.` }

  const da = {
    gu: ['Der er 500 opgaver fordelt på 50 niveauer. Plus og Minus har 15 niveauer hver, fra små regnestykker til opstilling med firecifrede tal. Gangetabeller og Division har 10 niveauer hver og låses op, når alle niveauer i Plus og Minus har mindst én stjerne.',

    levels: {
      a6: { title: 'Dobbelt og næsten dobbelt', goal: 'Læg et tal til sig selv, eller én mere', what: 'Dobbelt er et tal lagt til sig selv, som 7 + 7. Næsten dobbelt er to nabotal, som 7 + 8.', why: 'Dobbelttal er lette at huske. Når du kan dem, er næsten dobbelt bare dobbelt plus 1.' },
      a7: { title: 'Plus 9 og 11', goal: 'Brug en tier, og ret til', what: 'For at lægge 9 til lægger du 10 til og trækker 1 fra. For at lægge 11 til lægger du 10 til og 1 mere.', why: 'Det er hurtigt at lægge en hel tier til. Det er meget lettere at rette svaret med 1 end at lægge 9 til i hovedet.' },
      a8: { title: 'Tre tal', goal: 'Læg tre tal sammen', what: 'Når du lægger tre tal sammen, så kig først efter to, der giver 10.', why: 'Du kan lægge tal sammen i hvilken som helst rækkefølge, og svaret er det samme. Så tag det letteste par først.' },
      a9: { title: '100-venner', goal: 'Par der giver 100', what: '100-venner er par som 30 og 70 eller 45 og 55. Tæl op til næste tier, og så i tiere op til 100.', why: '100-venner virker ligesom tiervenner: 3 + 7 = 10, så 30 + 70 = 100.' },
      a10: { title: 'Plus tiere og hundreder', goal: 'Læg tiere og hundreder til trecifrede tal', what: 'Når du kun lægger tiere til, er det kun tiercifferet, der ændrer sig. Når du kun lægger hundreder til, er det kun hundredcifferet.', why: 'Hvert ciffer har sin egen plads. Når du lægger til én plads, er de andre de samme, så længe den ikke går over 9.' },
      a11: { title: 'Over hundrede', goal: 'Regnestykker forbi 100, 200, 300 …', what: 'Når et regnestykke går forbi et hundrede, hopper du først til hundredet og lægger så resten til.', why: 'Hundreder er venlige tal ligesom tiere. Når du stopper ved hundredet, bliver ét stort hop til to lette.' },
      a12: { title: 'Manglende tal', goal: 'Find den manglende del', what: 'I et regnestykke som 38 + □ = 50 tæller du op fra 38 til 50 for at finde det manglende tal.', why: 'Plus og minus er hinandens modsætninger. Den manglende del er afstanden mellem tallene.' },
      a13: { title: 'To gange i mente', goal: 'Trecifrede tal med to menter', what: 'Stil kolonnerne op, og start med enerne. Denne gang får du 1 i mente mere end én gang.', why: 'Hver kolonne kan kun rumme op til 9. Hver ekstra tier flytter til næste kolonne, helt op til tusinderne.' },
      a14: { title: 'Regnehistorier', goal: 'Plus i historier', what: 'Læs historien grundigt. Hvis mængder lægges sammen, eller der kommer flere til, skal du bruge plus.', why: 'Matematik er overalt i hverdagen. At finde regnestykket i en historie er en rigtig superkraft.' },
      a15: { title: 'Tusinder', goal: 'Plus med firecifrede tal', what: 'Store tal virker ligesom trecifrede: Stil tusinder, hundreder, tiere og enere op, og start med enerne.', why: 'Opstilling virker for tal i alle størrelser, fordi hver kolonne følger den samme regel.' },
      s6: { title: 'Tæl op', goal: 'Find forskellen', what: 'Når to tal ligger tæt, tæller du op fra det mindste tal til det største.', why: 'Minus betyder også at finde forskellen. Det er hurtigere at tælle op over et lille hul end at tælle tilbage.' },
      s7: { title: 'Minus 9 og 11', goal: 'Brug en tier, og ret til', what: 'For at trække 9 fra trækker du 10 fra og lægger 1 tilbage. For at trække 11 fra trækker du 10 fra og 1 mere.', why: 'Det er let at trække en hel tier fra. Så skal du bare rette svaret med 1.' },
      s8: { title: 'Fra et helt tiertal', goal: 'Som 40 − 7', what: 'For at trække et lille tal fra et helt tiertal deler du en tier af og bruger dine tiervenner.', why: '10 − 7 = 3, så 40 − 7 er 30 og 3, altså 33. Tiervennerne gør arbejdet.' },
      s9: { title: 'Træk fra 100', goal: 'Som 100 − 37', what: 'For at trække fra 100 tæller du op fra det lille tal til 100.', why: 'Svaret er tallets 100-ven. Det letteste er at tælle op i venlige hop.' },
      s10: { title: 'Minus tiere og hundreder', goal: 'Træk tiere og hundreder fra trecifrede tal', what: 'Når du kun trækker tiere fra, er det kun tiercifferet, der ændrer sig. Det samme gælder hundreder.', why: 'Hvert ciffer har sin egen plads. Når du trækker fra én plads, er de andre de samme, så længe der er nok.' },
      s11: { title: 'Tilbage over hundrede', goal: 'Som 203 − 5', what: 'Når du trækker fra forbi et hundrede, hopper du først tilbage til hundredet og så resten.', why: 'Når du stopper ved hundredet, bliver ét svært hop til to lette, ligesom når du stopper ved en tier.' },
      s12: { title: 'Manglende tal', goal: 'Find den manglende del', what: 'I 62 − □ = 40 tæller du op fra 40 til 62. I □ − 15 = 30 lægger du 30 og 15 sammen.', why: 'Plus og minus er hinandens modsætninger, så du kan vende spørgsmålet om.' },
      s13: { title: 'Nuller i vejen', goal: 'Veksling over et nul', what: 'Hvis der står et 0 i næste kolonne, kan du ikke veksle fra det. Gå en kolonne længere, og veksl så trin for trin.', why: '400 er det samme som 3 hundreder og 10 tiere, som igen er 3 hundreder, 9 tiere og 10 enere. Tallet ændrer sig aldrig.' },
      s14: { title: 'Regnehistorier', goal: 'Minus i historier', what: 'Læs historien. Hvis noget bliver taget væk eller brugt, eller du skal finde ud af, hvor mange der mangler, bruger du minus.', why: 'At finde matematikken i en historie er noget, du kan bruge hver dag.' },
      s15: { title: 'Tusinder', goal: 'Minus med firecifrede tal', what: 'Stil tusinder, hundreder, tiere og enere op. Start med enerne, og veksl, når det øverste ciffer er for lille.', why: 'Opstilling virker for tal i alle størrelser, fordi hver kolonne følger den samme regel.' },
      m1: { title: 'Lige store grupper', goal: '2-tabellen', what: 'Gange betyder lige store grupper. 4 · 2 betyder 4 grupper med 2. Tæl i 2\'ere for at finde svaret.', why: 'At gange er en hurtig måde at lægge det samme tal sammen igen og igen.' },
      m2: { title: '10-tabellen', goal: 'Tæl i 10\'ere', what: 'Gange 10 betyder grupper med ti. 6 · 10 er 6 tiere, altså 60.', why: 'Når du ganger med 10, flytter hvert ciffer én plads til venstre, og et 0 kommer ind på enernes plads.' },
      m3: { title: '5-tabellen', goal: 'Tæl i 5\'ere', what: 'Tæl i 5\'ere: 5, 10, 15, 20 … Eller brug 10-tabellen, og tag det halve.', why: '5 er det halve af 10, så 5 gange et tal er det halve af 10 gange tallet. 5-tabellen ender altid på 5 eller 0.' },
      m4: { title: 'Rækker og bytning', goal: 'Vend det om', what: 'Et array er rækker af prikker. 5 · 7 er 5 rækker med 7, og det er også 7 rækker med 5.', why: 'Du kan bytte om på tallene i et gangestykke og få det samme svar. Vælg den måde, der er lettest.' },
      m5: { title: '3-tabellen', goal: 'Tæl i 3\'ere', what: '3 grupper er 2 grupper og én mere. Tag det dobbelte af tallet, og læg tallet til én gang mere.', why: 'Hvis du kan dine dobbelttal, kan du regne alle tal i 3-tabellen ud.' },
      m6: { title: '4-tabellen', goal: 'Det dobbelte af 2-tabellen', what: '4 er det dobbelte af 2. For at gange med 4 tager du det dobbelte og så det dobbelte igen.', why: '4-tabellen er det dobbelte af 2-tabellen.' },
      m7: { title: '8-tabellen', goal: 'Det dobbelte af 4-tabellen', what: '8 er det dobbelte af 4. For at gange med 8 tager du det dobbelte tre gange.', why: 'Hver gang du tager det dobbelte, bliver det dobbelt så stort: 2\'ere, 4\'ere, 8\'ere.' },
      m8: { title: 'Blandede tabeller', goal: '3-, 4- og 8-tabellen', what: 'Se på det tal, du ganger med, og vælg dit trick: én gruppe mere for 3, dobbelt dobbelt for 4, dobbelt dobbelt dobbelt for 8.', why: 'Når du har et trick til hver tabel, kan du altid regne det ud, også hvis du glemmer det.' },
      m9: { title: 'Manglende tal', goal: 'Som □ · 4 = 20', what: 'Tæl i tabellen, til du når svaret. Antallet af hop er det manglende tal.', why: 'Et manglende tal i et gangestykke er i virkeligheden et divisionsstykke. Gange og division er hinandens modsætninger.' },
      m10: { title: 'Større gangestykker', goal: 'Tocifret gange etcifret', what: 'Del det store tal op i tiere og enere. Gang hver del, og læg så sammen.', why: 'Når du deler op, bliver ét svært gangestykke til to lette, der bruger de tabeller, du kan.' },
      d1: { title: 'Del ligeligt', goal: 'Del mellem 2 og 3', what: 'At dele betyder at give alle lige mange. Del ud én ad gangen.', why: 'Retfærdig deling giver lige store grupper. Du kan tjekke med et gangestykke.' },
      d2: { title: 'Lav grupper', goal: 'Hvor mange 5\'ere eller 10\'ere?', what: '20 : 5 kan betyde: Hvor mange grupper med 5 er der i 20? Tæl i 5\'ere, og tæl hoppene.', why: 'Division er det modsatte af gange, så når du tæller i spring, finder du svaret.' },
      d3: { title: 'Brug dine tabeller', goal: 'Divider med 2, 5 og 10', what: 'For at regne 35 : 5 tænker du: Hvad gange 5 giver 35?', why: 'Hvert gangestykke giver dig et divisionsstykke gratis. 7 · 5 = 35, så 35 : 5 = 7.' },
      d4: { title: 'Halvering', goal: 'Det halve af større tal', what: 'At dividere med 2 er at halvere. Halvér tierne og enerne hver for sig, og læg dem sammen.', why: 'Det er let at halvere tiere og enere, og når du sætter dem sammen igen, har du det halve af hele tallet.' },
      d5: { title: 'Divider med 3', goal: 'Brug 3-tabellen', what: 'For at regne 24 : 3 tæller du i 3\'ere op til 24 og tæller hoppene.', why: '3-tabellen baglæns deler i 3 lige store grupper.' },
      d6: { title: 'Divider med 4', goal: 'Halvér, og halvér igen', what: 'At dividere med 4 er det samme som at halvere to gange.', why: '4 er 2 · 2, så to halveringer giver 4 lige store dele.' },
      d7: { title: 'Divider med 8', goal: 'Brug 8-tabellen', what: 'For at regne 56 : 8 tænker du: Hvad gange 8 giver 56? Eller halvér tre gange.', why: '8 er 2 · 2 · 2, så tre halveringer giver 8 lige store dele.' },
      d8: { title: 'Blandet division', goal: 'Divider med 3, 4 og 8', what: 'Se på det tal, du dividerer med, og vælg dit trick: 3-tabellen, halvér to gange for 4 eller 8-tabellen.', why: 'Alle divisionsstykker kan tjekkes med et gangestykke.' },
      d9: { title: 'Manglende tal', goal: 'Som □ : 4 = 6', what: 'Vend det om med et gangestykke: □ : 4 = 6 betyder 6 · 4 = □.', why: 'Division og gange er hinandens modsætninger, så det ene kan altid gøre det andet om.' },
      d10: { title: 'Større division', goal: 'Tocifret divideret med etcifret', what: 'Del tallet op i dele, der er lette at dele, som 40 og 8. Del hver del, og læg så sammen.', why: 'Når du deler op i venlige dele, kan du bruge de tabeller, du allerede kan.' }

/* ---------- speech ---------- */
let lastSaid = { text: '', tid: 'hoot' };
// Best voice first: Premium, then Enhanced/natural voices (any accent), then UK English or Danish.
// A grown-up can also pick one exact voice in "For grown-ups"; that choice wins while it is installed.
function voicesFor(lang) {
  try { return speechSynthesis.getVoices().filter(v => lang === 'da' ? /^da/i.test(v.lang) : /^en/i.test(v.lang)); } catch (e) { return []; }
}
function voiceRank(v) {
  const s = `${v.name} ${v.voiceURI}`.toLowerCase();
  return (/premium/.test(s) ? 30 : /enhanced|neural|natural/.test(s) ? 20 : 0) + (/^(en-gb|da)/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
}
const rankedVoices = lang => voicesFor(lang).sort((a, b) => voiceRank(b) - voiceRank(a) || a.name.localeCompare(b.name));
function voiceFor(lang) {
  const list = rankedVoices(lang), chosen = store.voice && store.voice[lang];
  return (chosen && list.find(v => v.voiceURI === chosen)) || list[0] || null;
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => fillVoicePicker(); } catch (e) {}
function fillVoicePicker() {
  const sel = document.getElementById('voice-select'); if (!sel) return;
  const t = tr(), list = rankedVoices(store.lang), chosen = store.voice && store.voice[store.lang];
  sel.innerHTML = `<option value="">${t.voiceAuto}${list[0] ? ` (${esc(list[0].name)})` : ''}</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === chosen ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');
  const none = document.getElementById('voice-none'); if (none) none.hidden = list.length > 0;
}
function toSpeech(t) {
  const da = store.lang === 'da';
  return t.replace(/<[^>]+>/g, ' ')
    .replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/=/g, da ? ' er lig med ' : ' equals ').replace(/□/g, da ? ' hvad ' : ' blank ')
    .replace(/×/g, da ? ' gange ' : ' times ').replace(/÷/g, da ? ' divideret med ' : ' divided by ')
    .replace(/\s·\s/g, da ? ' gange ' : ' times ').replace(/\s:\s/g, da ? ' divideret med ' : ' divided by ')
    .replace(/\((H|T|O|E)\)/g, '');
}
function speak(text, tid) {
  lastSaid = { text, tid };
  if (!store.sound) return;
  try {
    // iPad Safari drops an utterance queued right after cancel(), so wait a moment when something was playing
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toSpeech(text)), v = voiceFor(store.lang);
    u.lang = v ? v.lang : store.lang === 'da' ? 'da-DK' : 'en-GB'; if (v) u.voice = v;
    u.rate = .9; u.pitch = TEACHERS[tid]?.pitch || 1;
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

function confetti(n = 26) {

  },
  practice({ id, fresh }) {
    const r = fresh ? null : savedRound();
    if (r && r.id === id) {

      const list = r.list.map(q => Array.isArray(q) ? P(q[0], q[1], q[2], q[3] ? { missing: 'b' } : null) : { ...q });

};

function resumeCard() {

const LOCK_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';
